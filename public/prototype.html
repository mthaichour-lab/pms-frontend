/* ---- Analyse d'un import CSV / TSV (fonction pure : testable hors navigateur) ---- */
function parseCSV(txt){
  const lignes=String(txt||"").trim().split(/\r?\n/).filter(l=>l.trim());
  if(!lignes.length) return {rows:[],sep:";"};
  const sep=[";","\t",","].map(c=>({c,n:lignes[0].split(c).length})).sort((a,b)=>b.n-a.n)[0].c;
  return {sep, rows:lignes.map(l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,"")))};
}
function toNum(x){
  if(typeof x==="number") return x;
  const v=parseFloat(String(x).replace(/\s| /g,"").replace(",","."));
  return isNaN(v)?null:v;
}
function analyserImport(txt,cible,P){
  const {rows,sep}=parseCSV(txt);
  if(!rows.length) return {cible,sep,lignes:[],ok:0,ko:0,vide:true};
  // ignorer une éventuelle ligne d'en-tête
  const head=rows[0].join(" ").toLowerCase();
  const corps=/compte|libell|solde|client|montant|produit|nom|segment|sens|agence|secteur|tiers/.test(head)&&rows.length>1?rows.slice(1):rows;
  const maturites=Object.keys(P.mat);
  const lignes=corps.map((r,i)=>{
    const err=[];
    if(cible==="cbs"){
      const [compte,lib,code,moyen,fin,courus]=r;
      if(!compte) err.push("compte manquant");
      if(!code||!MAP[code]) err.push("code produit inconnu : "+(code||"—"));
      if(toNum(moyen)===null) err.push("solde moyen non numérique");
      if(toNum(fin)===null) err.push("solde fin non numérique");
      return {n:i+1, err, brut:r,
        val:err.length?null:[compte,lib||"",code,toNum(moyen),toNum(fin),toNum(courus)||0],
        cat:MAP[code]||null};
    }else if(cible==="tiers"){
      const [id,nom,segment]=r;
      if(!id) err.push("identifiant manquant");
      if(!nom) err.push("nom manquant");
      if(["Particulier","Entreprise"].indexOf(segment)<0) err.push("segment invalide (Particulier / Entreprise)");
      return {n:i+1, err, brut:r,
        val:err.length?null:[id,nom,segment,r[3]||"",r[4]||"",r[5]||"",r[6]||"",r[7]||"",r[8]||"",r[9]||""]};
    }else{  // positions
      const [id,sens,produit,montant,maturite]=r;
      if(!id) err.push("identifiant tiers manquant");
      if(["Financement","Placement"].indexOf(sens)<0) err.push("sens invalide (Financement / Placement)");
      if(sens==="Financement" && FIN_POSTS.indexOf(produit)<0) err.push("financement inconnu : "+(produit||"—"));
      if(sens==="Placement" && CATS_PLACEMENT.indexOf(produit)<0) err.push("placement inconnu : "+(produit||"—"));
      if(toNum(montant)===null||toNum(montant)<0) err.push("montant invalide");
      if(maturite && maturites.indexOf(maturite)<0) err.push("maturité inconnue : "+maturite);
      return {n:i+1, err, brut:r,
        val:err.length?null:[id,sens,produit,toNum(montant),maturite||""]};
    }
  });
  return {cible, sep, lignes, ok:lignes.filter(l=>!l.err.length).length,
          ko:lignes.filter(l=>l.err.length).length, vide:false};
}

/* ---- Absorption d'une perte du pool : IRR → PER → capital des déposants ---- */
function absorberPerte(deficit, soldeIRR, soldePER){
  const parIRR = Math.min(deficit, Math.max(0,soldeIRR));
  const reste1 = deficit - parIRR;
  const parPER = Math.min(reste1, Math.max(0,soldePER));
  const parCapital = reste1 - parPER;
  return {deficit, parIRR, parPER, parCapital};
}

/* ---- Panier de financements : agrégat + rendement (réutilisé par le moteur et l'allocation) ---- */
function computeBasket(rows, totRevGlobal, totCharges, perRate){
  const enc=sum(rows.map(r=>r.encMoyen)), rev=sum(rows.map(r=>r.revAnnuel));
  const charges = totRevGlobal ? totCharges*(rev/totRevGlobal) : 0;
  const net = rev - charges, per = net*perRate, base = net - per;
  return {enc, rev, charges, net, per, base,
          rendement: enc ? base/enc : 0, margeBrute: enc ? rev/enc : 0};
}

/* ---- Clé déposant moyenne d'un panier, pondérée par le revenu de chaque source ---- */
function cleMoyenneSource(rows, keysSource){
  const rev = sum(rows.map(r=>r.revAnnuel));
  if(!rev) return 0;
  return sum(rows.map(r=>{
    const k = keysSource[r.post];
    return r.revAnnuel * (k ? k[1] : 0);
  })) / rev;
}

/* ---- Optimisation : viser un taux servi tout en maximisant l'adossement ----
   Ajouter un financement moins rentable dilue le rendement du panier.
   On part donc du plus rentable et on élargit TANT QUE la cible reste tenue :
   on obtient la plus grande capacité d'adossement compatible avec le taux visé. */
function optimiserPanier(rows, cible, ctx, cascadeOpts){
  const tri = rows.slice().sort((a,b)=>b.tauxEffectif-a.tauxEffectif);
  if(!tri.length) return {posts:[], atteint:false, taux:0, max:0};
  const tauxDe = sel => depositCascade(Object.assign({},cascadeOpts,
      {rendementBase: computeBasket(sel,ctx.totRev,ctx.totCharges,ctx.per).rendement})).tauxNet;
  const max = tauxDe([tri[0]]);
  if(max < cible) return {posts:[tri[0].post], atteint:false, taux:max, max:max};
  const pick=[tri[0]];
  for(let i=1;i<tri.length;i++){
    const essai=pick.concat([tri[i]]);
    if(tauxDe(essai) >= cible) pick.push(tri[i]); else break;
  }
  return {posts:pick.map(r=>r.post), atteint:true, taux:tauxDe(pick), max:max};
}

/* ---- Solveur générique (bissection) : fonctionne pour un levier croissant OU décroissant ---- */
function goalSeek(fn, lo, hi, target, iter){
  iter = iter || 90;
  let a=lo, b=hi, fa=fn(a)-target, fb=fn(b)-target;
  if(!isFinite(fa)||!isFinite(fb)) return {ok:false, x:null, raison:"calcul non défini"};
  if(fa*fb>0) return {ok:false, x:null, raison:"objectif hors de portée sur la plage admissible",
                      min:Math.min(fn(a),fn(b)), max:Math.max(fn(a),fn(b))};
  for(let i=0;i<iter;i++){
    const m=(a+b)/2, fm=fn(m)-target;
    if(fa*fm<=0){ b=m; fb=fm; } else { a=m; fa=fm; }
  }
  return {ok:true, x:(a+b)/2, raison:null};
}

/* ---- Fusion défensive : un état sauvegardé plus ancien reçoit les nouvelles clés par défaut ---- */
function fillDefaults(def,cur){
  if(cur===null||cur===undefined) return def;
  if(Array.isArray(def)) return Array.isArray(cur)?cur:def;
  if(def && typeof def==="object"){
    const o={};
    for(const k in def) o[k]=fillDefaults(def[k],cur[k]);
    for(const k in cur) if(!(k in def)) o[k]=cur[k];
    return o;
  }
  return (typeof cur===typeof def) ? cur : def;
}

    let v=parseFloat(el.value); if(isNaN(v))return;
    if(el.dataset.pct==="1")v=v/100;
    const chemin=el.dataset.path;
    if(estTrace(chemin)&&parametresVerrouilles(STATE.gouvernance)){
      toast("Paramètres verrouillés : modification refusée",true); renderView(CURRENT); return; }
    if(estTrace(chemin)){ const avant=getPath(STATE,chemin); if(avant!==v) journaliser(chemin,avant,v); }
    setPath(STATE,chemin,v); recompute();
  }else if(el.matches("input.txt")){
    // Un champ texte peut conditionner l'interface (identité → circuit de validation) :
    // on repeint, en conservant le focus et la position du curseur.
    setPath(STATE,el.dataset.path,el.value);
    repaintGardantFocus();
  }else if(el.matches("textarea[data-path]")||el.matches("input.search[data-path]")){
    // Zone de collage et champ de recherche : le rendu doit suivre la frappe,
    // sans que le champ perde le focus ni la position du curseur.
    setPath(STATE,el.dataset.path,el.value);
    repaintGardantFocus();
  }
});
function repaintGardantFocus(){
  const a=document.activeElement;
  const path=a&&a.dataset?a.dataset.path:null;
  let s=null,f=null;
  try{ s=a.selectionStart; f=a.selectionEnd; }catch(e){}
  recompute();
  if(path){
    const n=document.querySelector('[data-path="'+path+'"]');
    if(n){ n.focus(); if(s!==null){ try{ n.setSelectionRange(s,f); }catch(e){} } }
  }
}
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches('input[type=checkbox][data-path]')){setPath(STATE,el.dataset.path,el.checked);recompute();return;}
  if(el.matches("select.cell")){
    const chemin=el.dataset.path, brut=el.value;
    const v=/^-?\d+(\.\d+)?$/.test(brut)?parseFloat(brut):brut;
    if(estTrace(chemin)&&parametresVerrouilles(STATE.gouvernance)){
      toast("Paramètres verrouillés : modification refusée",true); renderView(CURRENT); return; }
    if(estTrace(chemin)){ const avant=getPath(STATE,chemin); if(avant!==v) journaliser(chemin,avant,v); }
    setPath(STATE,chemin,v); recompute();
  }
});

    ${p.rows.map(r=>`<tr><td class="cat">${esc(r.cat)}</td><td class="num">${mda(r.moyen,0)}</td><td class="num">${pf(r.tx,0)}</td><td class="num">${mda(r.invest,2)}</td><td class="num">${pf(r.quote,2)}</td></tr>`).join("")}
    <tr class="total"><td>TOTAL</td><td class="num">${mda(p.totRes,0)}</td><td></td><td class="num">${mda(p.totInvest,1)}</td><td class="num">100,00 %</td></tr>
    </tbody></table></div>
  <div class="card" style="margin-top:16px"><h3 class="sub" style="margin-top:2px">Répartition des encours investis</h3>${barsH(p.rows.map(r=>({label:r.cat,value:r.invest})))}</div>`;
};

VIEWS.ecoulements=m=>{
  const e=m.ecoul;
  const months=["M0","M1","M2","M3","M4","M5","M6","M7","M8","M9","M10","M11","M12"];
  return `
  <h2 class="section">Module des écoulements — run-off des financements</h2>
  <p class="lead">Run-off mensuel : encours(M+1) = encours(M) × (1 − taux d'écoulement) + production nouvelle. Revenu mensuel = encours moyen × marge / 12. Recalibrage du rendement du pool sur une plage cohérente au marché (~6–7 %).</p>
  <h3 class="sub">1 · Paramètres des postes de financement</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Poste</th><th class="num">Encours initial</th><th class="num">Production/mois</th><th class="num">Taux d'écoulement</th><th class="num">Marge annuelle</th><th class="num">Produits courus CBS</th></tr></thead>
    <tbody>
    ${e.rows.map((r,i)=>`<tr><td class="cat">${esc(r.post)}</td>
      <td class="num">${mda(r.enc0,0)}</td>
      <td class="num">${numInput(`ecoul.${r.post}.0`,r.prod,{step:0.1})}</td>
      <td class="num">${numInput(`ecoul.${r.post}.1`,r.ecoulTx,{pct:true,step:0.1})}</td>
      <td class="num">${numInput(`ecoul.${r.post}.2`,r.marge,{pct:true,step:0.1})}</td>
      <td class="num">${mda(r.courus,1)}</td></tr>`).join("")}
    <tr class="total"><td>TOTAL</td><td class="num">${mda(e.totEncByMonth[0],0)}</td><td class="num">${mda(sum(e.rows.map(r=>r.prod)),1)}</td><td></td><td></td><td class="num">${mda(sum(e.rows.map(r=>r.courus)),1)}</td></tr>
    </tbody></table></div>

  <h3 class="sub">2 · Écoulement des encours — fin de mois</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Poste</th>${months.map(x=>`<th class="num">${x}</th>`).join("")}</tr></thead>
    <tbody>
    ${e.rows.map(r=>`<tr><td class="cat">${esc(r.post)}</td>${r.enc.map(v=>`<td class="num">${mda(v,0)}</td>`).join("")}</tr>`).join("")}
    <tr class="total"><td>TOTAL ENCOURS</td>${e.totEncByMonth.map(v=>`<td class="num">${mda(v,0)}</td>`).join("")}</tr>
    </tbody></table></div>
  <div class="card" style="margin-top:16px"><h3 class="sub" style="margin-top:2px">Trajectoire de l'encours total du pool</h3>${lineChart(e.totEncByMonth,months)}</div>

  <h3 class="sub">3 · Revenus annuels &amp; rapprochement produits courus CBS</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Poste</th><th class="num">Revenu modèle</th><th class="num">Produits courus CBS</th><th class="num">Écart</th><th class="num">Écart %</th></tr></thead>
    <tbody>
    ${e.rows.map(r=>{const d=r.revAnnuel-r.courus;const pc=r.courus?d/r.courus:0;const al=Math.abs(pc)>0.05;
      return `<tr><td class="cat">${esc(r.post)}</td><td class="num">${mda(r.revAnnuel,1)}</td><td class="num">${mda(r.courus,1)}</td><td class="num" style="color:${al?'var(--err)':'inherit'}">${mda(d,2)}</td><td class="num" style="color:${al?'var(--err)':'inherit'}">${pf(pc,2)}</td></tr>`;}).join("")}
    <tr class="total"><td>TOTAL</td><td class="num">${mda(e.totRevAnnuel,1)}</td><td class="num">${mda(sum(e.rows.map(r=>r.courus)),1)}</td><td class="num">${mda(e.totRevAnnuel-sum(e.rows.map(r=>r.courus)),2)}</td><td></td></tr>
    </tbody></table></div>

  <h3 class="sub">4 · Contrôle de liquidité du pool</h3>
  <div class="tbl-wrap"><table><tbody>
    <tr><td>Encours moyen des financements sur l'horizon</td><td class="num">${mda(e.encMoyen,1)} MDA</td></tr>
    <tr><td>Encours investis du pool (ressources mobilisées)</td><td class="num">${mda(m.pool.totInvest,1)} MDA</td></tr>
    <tr><td>Coussin de liquidité</td><td class="num">${mda(e.coussin,1)} MDA</td></tr>
    <tr class="total"><td>Financements ≤ ressources investies</td><td class="num">${okBadge(e.liqOK)}</td></tr>
  </tbody></table></div>`;
};

VIEWS.revenus=m=>{
  const r=m.revenus;
  return `
  <h2 class="section">Résultat du pool — produits, charges &amp; réserves</h2>
  <p class="lead">Produits des financements islamiques (classe 7) issus des écoulements, moins charges directes, moins dotation PER (partagée banque/déposants, avant part du Moudarib). L'IRR est prélevée en aval, uniquement sur la part des déposants.</p>
  <div class="grid2">
    <div class="card"><h3 class="sub" style="margin-top:2px">1 · Produits des financements</h3>
      <div class="tbl-wrap"><table><tbody>
        <tr><td>Marge Mourabaha (imm. + équip. + exploit.)</td><td class="num">${mda(r.produits.margeMrb)}</td></tr>
        <tr><td>Loyers Ijara Mountahia Bitamlik</td><td class="num">${mda(r.produits.ijara)}</td></tr>
        <tr><td>Marges Salam</td><td class="num">${mda(r.produits.salam)}</td></tr>
        <tr><td>Marges Istisna'a</td><td class="num">${mda(r.produits.istisna)}</td></tr>
        <tr><td>Quote-parts Moucharaka</td><td class="num">${mda(r.produits.moucharaka)}</td></tr>
        <tr><td>Commissions &amp; récupérations</td><td class="num">${numInput("revenus.commissions",STATE.revenus.commissions,{step:0.5})}</td></tr>
        <tr class="total"><td>Total des produits</td><td class="num">${mda(r.totProduits)}</td></tr>
      </tbody></table></div>
    </div>
    <div class="card"><h3 class="sub" style="margin-top:2px">2 · Charges directes du pool</h3>
      <div class="tbl-wrap"><table><tbody>
        <tr><td>Charges directes de gestion des actifs</td><td class="num">${numInput("revenus.chargesGestion",STATE.revenus.chargesGestion,{step:0.5})}</td></tr>
        <tr><td>Pertes &amp; dépréciations (Règl. 14-03)</td><td class="num">${numInput("revenus.pertesDepreciations",STATE.revenus.pertesDepreciations,{step:0.5})}</td></tr>
        <tr class="total"><td>Total des charges directes</td><td class="num">${mda(r.totCharges)}</td></tr>
      </tbody></table></div>
      <div class="note" style="margin-bottom:0">Seuls les produits effectivement acquis entrent dans le pool ; les produits suspendus (impayés) en sont exclus.</div>
    </div>
  </div>
  <h3 class="sub">3 · Résultat &amp; réserves</h3>
  <div class="kpis">
    ${kpi("Produit brut du pool",mda(r.produitBrut),"MDA",null,{icon:"coins",
      note:`produits <b>${mda(r.totProduits,1)}</b> − charges <b>${mda(r.totCharges,1)}</b>`})}
    ${kpi("Dotation PER",mda(r.per),"MDA","gold",{icon:"shield",bar:STATE.params.dotationPER,
      note:`${pf(STATE.params.dotationPER,0)} du produit brut · <b>avant</b> part du Moudarib`})}
    ${kpi("Base de distribution",mda(r.base),"MDA","gold",{icon:"scale",
      note:`assiette de partage après PER`})}
    ${kpi("Rendement brut du pool",pf(r.rendementBrut),"","brand",{icon:"gauge",
      note:`rapporté aux <b>${mda(m.pool.totInvest,0)}</b> MDA investis`})}
  </div>
  <h3 class="sub">4 · Purification des revenus non conformes</h3>
  <div class="card">
    <div class="ctl-row">
      <label class="fld"><span>Revenus non conformes de la période (MDA)</span>${numInput("revenus.nonConformes",STATE.revenus.nonConformes,{step:0.5,charia:true})}</label>
      <label class="fld"><span>Cumul reporté</span>${numInput("purification.cumulOuv",STATE.purification.cumulOuv,{step:0.5})}</label>
      <label class="fld"><span>Versé aux œuvres (MDA)</span>${numInput("purification.verse",STATE.purification.verse,{step:0.5})}</label>
      <label class="fld"><span>Bénéficiaire caritatif</span>${txtInput("purification.beneficiaire",STATE.purification.beneficiaire)}</label>
      <label class="fld"><span>Référence de la décision Charia</span>${txtInput("purification.decision",STATE.purification.decision)}</label>
    </div>
    <div class="tbl-wrap" style="margin-top:12px"><table><tbody>
      <tr><td>Montant à purifier sur la période</td><td class="num">${mda(m.purification.ncPeriode,2)}</td></tr>
      <tr><td>Part des produits du pool</td><td class="num">${pf(m.purification.partDuProduit,2)}</td></tr>
      <tr><td>Cumul à purifier</td><td class="num">${mda(m.purification.cumul,2)}</td></tr>
      <tr><td>Déjà versé</td><td class="num">−${mda(m.purification.verse,2)}</td></tr>
      <tr class="total"><td>Solde restant à verser</td><td class="num">${mda(m.purification.solde,2)} MDA</td></tr>
    </tbody></table></div>
    <div class="cover ${m.purification.ncPeriode===0?"ok":(m.purification.documente?"ok":"ko")}" style="margin-top:12px"><span class="ci"></span><span>${
      m.purification.ncPeriode===0
        ? "Aucun revenu non conforme constaté sur la période. La base de distribution est intégralement conforme."
        : (m.purification.documente
           ? `<b>${mda(m.purification.ncPeriode,2)}</b> MDA exclus de la base de distribution et affectés à la purification — bénéficiaire : <b>${esc(m.purification.beneficiaire)}</b>, décision <b>${esc(m.purification.decision)}</b>.`
           : `<b>${mda(m.purification.ncPeriode,2)}</b> MDA exclus de la base, mais <b>le bénéficiaire caritatif et la décision du Comité Charia ne sont pas renseignés</b> : la purification n'est pas documentée.`)
    }</span></div>
    <div class="note charia" style="margin-bottom:0">Les revenus non conformes (pénalités de retard, produits accidentels) sont retirés de la base <b>avant tout partage</b> : ils ne peuvent bénéficier ni aux déposants ni aux actionnaires. Leur affectation caritative relève d'une décision du Comité Charia et doit être justifiée par une preuve de versement.</div>
  </div>

  <h3 class="sub">5 · Réserves PER / IRR — mouvements de la période</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Réserve</th><th class="num">Ouverture</th><th class="num">Dotation</th><th class="num">Reprise</th><th class="num">Clôture</th><th class="num">Plafond</th><th>Statut</th></tr></thead>
    <tbody>
      <tr><td class="cat">PER — péréquation des profits</td>
        <td class="num">${numInput("reserves.perOuv",STATE.reserves.perOuv,{step:1})}</td>
        <td class="num">${mda(m.reserves.perDot,2)}</td>
        <td class="num">${numInput("reserves.perReprise",STATE.reserves.perReprise,{step:1})}</td>
        <td class="num"><b>${mda(m.reserves.perClot,2)}</b></td>
        <td class="num">${mda(m.reserves.plafondPER,1)}</td>
        <td>${okBadge(!m.reserves.perDepasse)}</td></tr>
      <tr><td class="cat">IRR — risques d'investissement</td>
        <td class="num">${numInput("reserves.irrOuv",STATE.reserves.irrOuv,{step:1})}</td>
        <td class="num">${mda(m.reserves.irrDot,3)}</td>
        <td class="num">${numInput("reserves.irrReprise",STATE.reserves.irrReprise,{step:1})}</td>
        <td class="num"><b>${mda(m.reserves.irrClot,2)}</b></td>
        <td class="num">${mda(m.reserves.plafondIRR,1)}</td>
        <td>${okBadge(!m.reserves.irrDepasse)}</td></tr>
      <tr class="total"><td>Capacité d'absorption totale</td><td class="num"></td><td class="num"></td><td class="num"></td>
        <td class="num">${mda(m.reserves.total,2)}</td><td class="num">${pf(m.perte.capaciteEnPct,2)} des encours</td><td></td></tr>
    </tbody></table></div>
  <div class="note charia">Plafonds fixés par l'ALCO et validés par le Comité Charia (IFSB GN-3). Le sort des réserves en cas de clôture du pool doit être défini au contrat : affectation caritative ou restitution.</div>

  <h3 class="sub">6 · Scénario de perte du pool</h3>
  <div class="card">
    ${m.perte.actif
      ? `<div class="cover ko"><span class="ci"></span><span><b>Le pool est en perte</b> : déficit de <b>${mda(m.perte.absorption.deficit,2)}</b> MDA.</span></div>
         <div class="tbl-wrap" style="margin-top:12px"><table>
           <thead><tr><th>Ordre d'absorption</th><th class="num">Montant (MDA)</th><th>Supporté par</th></tr></thead>
           <tbody>
             <tr><td class="cat">1. Réserve IRR</td><td class="num">${mda(m.perte.absorption.parIRR,2)}</td><td class="mini">Déposants — réserve constituée sur leur part</td></tr>
             <tr><td class="cat">2. Réserve PER</td><td class="num">${mda(m.perte.absorption.parPER,2)}</td><td class="mini">Banque et déposants conjointement</td></tr>
             <tr class="total"><td>3. Capital des déposants</td><td class="num">${mda(m.perte.absorption.parCapital,2)}</td><td class="mini">Rab al-Mal — perte en capital (${pf(m.perte.tauxPerteCapital,2)})</td></tr>
           </tbody></table></div>
         <div class="note charia" style="margin-bottom:0">Le <b>Moudarib ne supporte aucune perte en capital</b> : il perd son effort et sa part de profit (Norme AAOIFI n° 13). Une prise en charge de la perte par la banque équivaudrait à une garantie de capital et invaliderait le contrat.</div>`
      : `<div class="cover ok"><span class="ci"></span><span>Pool bénéficiaire sur la période. Le dispositif absorberait une perte jusqu'à <b>${mda(m.perte.capaciteAbsorption,2)}</b> MDA (<b>${pf(m.perte.capaciteEnPct,2)}</b> des encours investis) <b>sans entamer le capital</b> des déposants.</span></div>
         <div class="mini" style="margin-top:10px">Pour éprouver la cascade, portez les charges ou les dépréciations au-delà des produits : l'ordre IRR → PER → capital s'affiche automatiquement.</div>`}
  </div>

  <div class="card"><h3 class="sub" style="margin-top:2px">Cascade du résultat</h3>${waterfall([
    {label:"Produits",value:r.totProduits,type:"pos"},
    {label:"Charges",value:-r.totCharges,type:"neg"},
    {label:"PER",value:-r.per,type:"neg"},
    {label:"Base distr.",value:r.base,type:"tot"}
  ])}</div>`;
};

VIEWS.moudaraba=m=>{
  const s=STATE.simMoudaraba, sim=m.sim, ec=m.ecole;
  return `
  <h2 class="section">Distribution Moudaraba Motlaqa — pool des dépôts d'investissement</h2>
  <p class="lead">Deux méthodes d'allocation du profit aux catégories de dépôts. La <b>Méthode 2</b> (moyennes pondérées, AAOIFI FAS 27) corrige la subvention croisée de la Méthode 1 (clé fixe) et constitue la méthode cible.</p>

  <h3 class="sub">Méthode 1 — clé fixe par catégorie</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Catégorie</th><th class="num">Investi</th><th class="num">Pond.</th><th class="num">Part profit</th><th class="num">Clé Banque</th><th class="num">Part Banque</th><th class="num">Part Dép. brute</th><th class="num">IRR</th><th class="num">Part Dép. nette</th><th class="num">Rdt dép.</th></tr></thead>
    <tbody>
    ${m.m1.rows.map(r=>`<tr><td class="cat">${esc(r.cat)}</td><td class="num">${mda(r.B,1)}</td><td class="num">${pf(r.C,0)}</td><td class="num">${mda(r.D,2)}</td><td class="num">${pf(r.E,1)}</td><td class="num">${mda(r.F,2)}</td><td class="num">${mda(r.G,2)}</td><td class="num">${mda(r.H,3)}</td><td class="num">${mda(r.I,2)}</td><td class="num">${pf(r.J,2)}</td></tr>`).join("")}
    <tr class="total"><td>TOTAL</td><td class="num">${mda(m.m1.tot.B,1)}</td><td></td><td class="num">${mda(m.m1.tot.D,2)}</td><td></td><td class="num">${mda(m.m1.tot.F,2)}</td><td class="num">${mda(m.m1.tot.G,2)}</td><td class="num">${mda(m.m1.tot.H,3)}</td><td class="num">${mda(m.m1.tot.I,2)}</td><td></td></tr>
    </tbody></table></div>
  <div class="mini" style="margin-top:6px">Contrôle Σ allocations = base de distribution : ${okBadge(m.m1.ok)}</div>

  <h3 class="sub">Méthode 2 — moyennes pondérées (AAOIFI FAS 27)</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Catégorie</th><th class="num">Investi</th><th class="num">Poids</th><th class="num">Capital pond.</th><th class="num">Quote-part</th><th class="num">Part profit</th><th class="num">Clé Bq.</th><th class="num">Part Banque</th><th class="num">Part Dép. nette</th><th class="num">Rdt dép.</th></tr></thead>
    <tbody>

    <tr class="total"><td>TOTAL</td><td class="num">${mda(m.m2.tot.D>0?m.m1.tot.B:0,1)}</td><td></td><td class="num">${mda(m.m2.totPond,0)}</td><td class="num">100 %</td><td class="num">${mda(m.m2.tot.F,2)}</td><td></td><td class="num">${mda(m.m2.tot.H,2)}</td><td class="num">${mda(m.m2.tot.K,2)}</td><td></td></tr>
    </tbody></table></div>
  <div class="mini" style="margin-top:6px">Contrôle Σ allocations = base de distribution : ${okBadge(m.m2.ok)}</div>

  <h3 class="sub">Comparaison — part nette revenant aux déposants</h3>
  <div class="grid2">
    <div class="card" style="padding:14px 16px">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Catégorie</th><th class="num">M1</th><th class="num">M2</th><th class="num">Écart</th></tr></thead>
        <tbody>
        ${m.compare.filter(r=>r.m1||r.m2).map(r=>`<tr><td class="cat">${esc(r.cat)}</td><td class="num">${mda(r.m1,2)}</td><td class="num">${mda(r.m2,2)}</td><td class="num" style="color:${r.delta>=0?'var(--ok)':'var(--err)'}">${r.delta>=0?'+':''}${mda(r.delta,2)}</td></tr>`).join("")}
        <tr class="total"><td>TOTAL</td><td class="num">${mda(m.m1.tot.I,2)}</td><td class="num">${mda(m.m2.tot.K,2)}</td><td class="num">${mda(m.m2.tot.K-m.m1.tot.I,2)}</td></tr>
        </tbody></table></div>
    </div>
    <div class="card"><h3 class="sub" style="margin-top:2px">Rendement déposant par catégorie</h3>${groupedBars(m.compare.filter(r=>r.rM1||r.rM2))}</div>

  <h3 class="sub">Simulation déposant — Moudaraba Motlaqa (BDC nominatif)</h3>

        <tr><td>Personne physique</td><td class="num"><select class="cell" data-path="simMoudaraba.pp"><option ${s.pp==='Oui'?'selected':''}>Oui</option><option ${s.pp==='Non'?'selected':''}>Non</option></select></td></tr>
      </tbody></table></div>
    </div>
    <div class="card" style="padding:16px 18px">
      <div class="tbl-wrap"><table><tbody>
        <tr><td>Clé déposant (selon maturité)</td><td class="num">${pf(sim.cleDep,0)}</td></tr>
        <tr><td>Profit attribuable au placement</td><td class="num">${mda(sim.profitAttr,3)}</td></tr>
        <tr><td>Part de la banque (Moudarib)</td><td class="num">${mda(sim.partBanque,3)}</td></tr>
        <tr><td>Profit brut du déposant</td><td class="num">${mda(sim.profitBrutDep,3)}</td></tr>

VIEWS.conformite=m=>{
  const pts=[
    "Moudaraba (Norme AAOIFI n° 13) : les déposants (Rab al-Mal) supportent les pertes en capital ; la banque (Moudarib) perd son effort et sa part de profit. Toute garantie de capital ou de rendement par le Moudarib invalide le contrat (une garantie par un tiers indépendant reste admise).",
    "Les clés de répartition et les pondérations doivent être fixées, documentées et PUBLIÉES avant le début de chaque période ; toute modification ne vaut que pour les périodes futures.",
    "PER : dotée sur le produit BRUT du pool, avant la part du Moudarib — financée conjointement par la banque et les déposants. IRR : dotée UNIQUEMENT sur la part des déposants, après la part du Moudarib (AAOIFI FAS 27, IFSB GN-3). Le sort des réserves en cas de clôture du pool doit être défini.",
    "Le lissage des rendements (smoothing) via PER/IRR doit rester transparent : mention au contrat, information périodique des titulaires de comptes d'investissement, plafonds fixés par l'ALCO et validés par le Comité Charia.",
    "La banque peut renoncer volontairement (hiba/tanazul) à une partie de sa part de Moudarib pour soutenir le rendement servi — jamais l'inverse (prélever plus que la clé contractuelle est interdit).",
    "Wakala bi al-istithmar (Norme AAOIFI n° 23) : rémunération du Wakil = frais fixes ou % connus d'avance ; taux « attendu » indicatif et NON garanti ; clause d'incitation expressément stipulée ; pertes au Muwakkil sauf faute.",
    "Musharaka (Norme AAOIFI n° 12) : partage des profits librement négocié (l'associé passif ne pouvant excéder sa quote-part de capital) ; partage des pertes IMPÉRATIVEMENT au prorata des apports. Dans la Moutanaqissa, la promesse d'achat (wa'd) doit être unilatérale et distincte du contrat de société.",
    "Ségrégation : comptabilité de la fenêtre islamique strictement séparée du conventionnel — exigence du Règlement BA n° 20-02 et condition de validité charia du pool.",
    "Revenus non conformes (pénalités de retard, produits accidentels) : isolés et affectés à un compte de purification (œuvres caritatives) sur décision du Comité Charia.",
    "Produits en souffrance : suspendre la constatation des produits des financements impayés avant distribution (ne distribuer que des profits réalisés ou quasi-réalisés).",
    "Fiscalité locale : retenue IRG à la source sur les profits versés aux personnes physiques ; vérifier le régime des personnes morales avec la Direction fiscale.",
    "Gouvernance : validation annuelle par le Comité Charia (audit interne + revue externe), reporting ALCO mensuel des rendements servis vs marché, test de « displaced commercial risk » (IFSB)."
  ];
  return `
  <h2 class="section">Gouvernance &amp; conformité charia — points de vigilance</h2>
  <p class="lead">Cadre : Règlement Banque d'Algérie n° 20-02, normes AAOIFI (FAS 27 ; normes charia n° 12, 13, 23) et IFSB GN-3.</p>
  <div class="card"><ul class="comp-list">
    ${pts.map((p,i)=>`<li><span class="num">${i+1}</span><span>${esc(p)}</span></li>`).join("")}
  </ul></div>`;
};

VIEWS.allocation=m=>{
  const AL=STATE.allocation, a=m.allocation, c=a.casc, b=a.basket;
  const gainUp=a.gain>=0;
  const ic=n=>'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+n+'</svg>';
  return `
  <h2 class="section">Allocation par déposant</h2>
  <p class="lead">Adosser le dépôt d'un client aux financements les plus rentables et ajuster les clés de répartition pour porter son taux de rémunération. Régime <b>Moudaraba Mouqayyada</b> — compte d'investissement affecté.</p>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Rendement du panier retenu",pf(b.rendement,2),"","brand",{icon:"invest",
      note:`${a.nbSel}/${a.nbTotal} financements · marge brute <b>${pf(b.margeBrute,2)}</b>`})}
    ${kpi("Taux net servi au déposant",pf(c.tauxNet,2),"","gold",{icon:"pct",
      note:`pool global : <b>${pf(a.ref.casc.tauxNet,2)}</b> · écart <span class="delta ${gainUp?"up":"down"}">${gainUp?"+":""}${pf(a.gain,2)}</span>`})}
    ${kpi("Net versé",mda(c.net,3),"MDA",null,{icon:"coins",
      note:`brut <b>${mda(c.depBrut,3)}</b> − IRR <b>${mda(c.irr,3)}</b> − IRG <b>${mda(c.irg,3)}</b>`})}
    ${kpi("Adossement du dépôt",a.capacite>0?nf(Math.min(999,a.capacite/Math.max(AL.montant,1e-9)),1)+"×":"—","",a.couvert?null:"warn",
      {icon:"shield",bar:Math.min(1,a.capacite/Math.max(AL.montant,1e-9)),
       note:`encours adossés <b>${mda(a.capacite,0)}</b> MDA pour un dépôt de <b>${mda(AL.montant,0)}</b> MDA`})}
  </div>

  <h3 class="sub">1 · Dépôt du client</h3>
  <div class="card">
    <div class="ctl-row">
      <label class="fld"><span>Titulaire du compte</span>${txtInput("allocation.nom",AL.nom)}</label>
      <label class="fld"><span>Montant du dépôt (MDA)</span>${numInput("allocation.montant",AL.montant,{step:1})}</label>
      <label class="fld"><span>Maturité</span>
        <select class="cell" data-path="allocation.maturite">${Object.keys(STATE.params.mat).map(k=>`<option ${k===AL.maturite?"selected":""}>${k}</option>`).join("")}</select></label>
      <label class="fld"><span>Personne physique</span>
        <select class="cell" data-path="allocation.pp"><option ${AL.pp==="Oui"?"selected":""}>Oui</option><option ${AL.pp==="Non"?"selected":""}>Non</option></select></label>
      <label class="fld"><span>Taux net visé</span>${numInput("allocation.cible",AL.cible,{pct:true,step:0.1})}</label>
    </div>
    <div class="cover ${a.couvert?"ok":"ko"}">
      <span class="ci">${a.couvert?ic('<path d="m5 13 4 4L19 7"/>'):ic('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>')}</span>
      <span>${a.couvert
        ? `Adossement suffisant : les financements retenus portent <b>${mda(a.capacite,0)}</b> MDA d'encours pour un dépôt de <b>${mda(AL.montant,0)}</b> MDA.`
        : `<b>Adossement insuffisant</b> — les financements retenus ne portent que <b>${mda(a.capacite,0)}</b> MDA d'encours pour un dépôt de <b>${mda(AL.montant,0)}</b> MDA. Élargir la sélection : un compte affecté doit être couvert par des actifs réels.`}</span>
    </div>
  </div>

  <h3 class="sub">2 · Assiette d'attribution de la rémunération</h3>
  <div class="card">
    <div class="segrow" role="radiogroup" aria-label="Assiette d'attribution">
      ${[["pool","Par pool","Mutualisation intégrale : le dépôt reçoit une quote-part de l'ensemble des financements."],
         ["type","Par type de financement","Le dépôt est adossé à une famille de contrats (vente, location, participatif)."],
         ["client","Par client","Contrats de financement désignés, choisis un à un pour ce déposant."]]
        .map(o=>`<button type="button" class="seg ${AL.assiette===o[0]?"on":""}" data-path="allocation.assiette" data-val="${o[0]}" role="radio" aria-checked="${AL.assiette===o[0]}">
           <b>${o[1]}</b><span>${o[2]}</span></button>`).join("")}
    </div>
    ${AL.assiette==="type"?`<div class="ctl-row" style="margin-top:14px;margin-bottom:0">
      <label class="fld"><span>Famille de contrats retenue</span>
        <select class="cell" data-path="allocation.famille">${Object.keys(FAMILLES).map(f=>{
          const rows=m.ecoul.rows.filter(r=>FAMILLES[f].indexOf(r.post)>=0);
          const b2=computeBasket(rows,m.ecoul.totRevAnnuel,m.revenus.totCharges,STATE.params.dotationPER);
          return `<option value="${esc(f)}" ${f===AL.famille?"selected":""}>${f} — ${pf(b2.rendement,2)}</option>`;}).join("")}</select></label>
      <div class="fld"><span>Contrats couverts</span><div class="statline">${(FAMILLES[AL.famille]||[]).map(x=>esc(x)).join(" · ")}</div></div>
    </div>`:""}
    ${AL.assiette==="pool"?`<div class="note info" style="margin:14px 0 0">Aucune affectation : le taux servi suit le rendement moyen du pool. C'est le régime <b>Moudaraba Motlaqa</b> de droit commun.</div>`:""}
  </div>

  <h3 class="sub">3 · Financements classés par rentabilité</h3>
  <div class="card">
    ${AL.assiette!=="client"?`<div class="note" style="margin:0 0 14px">Sélection pilotée par l'assiette choisie ci-dessus. Basculer sur <b>Par client</b> pour désigner les contrats un à un.</div>`:""}
    <div class="actbar">
      <button type="button" class="abtn go" data-act="al-opt" ${AL.assiette!=="client"?"disabled":""}>${ic('<path d="M13 3 5 13.5h6L11 21l8-10.5h-6L13 3Z"/>')}Optimiser pour ${pf(AL.cible,2)}</button>
      <button type="button" class="abtn" data-act="al-top" data-n="1" ${AL.assiette!=="client"?"disabled":""}>Le plus rentable</button>
      <button type="button" class="abtn" data-act="al-top" data-n="3" ${AL.assiette!=="client"?"disabled":""}>Top 3</button>
      <button type="button" class="abtn" data-act="al-all" ${AL.assiette!=="client"?"disabled":""}>Tous</button>
      <button type="button" class="abtn" data-act="al-none" ${AL.assiette!=="client"?"disabled":""}>Aucun</button>
      <span class="sep"></span>
      <span class="mini">Sélection : <b>${a.nbSel}</b>/${a.nbTotal}</span>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:34px"></th><th style="width:44px">Rang</th><th>Financement</th><th class="num">Taux de profit</th><th class="num">Encours moyen</th><th class="num">Revenu annuel</th><th class="num">Part du revenu</th>${a.parSource?'<th class="num">Clé déposant</th>':""}</tr></thead>
      <tbody>
      ${a.tous.map((r,i)=>{
        const on=!!AL.posts[r.post];
        return `<tr class="${on?"picked":""}">
          <td><input type="checkbox" class="chk" data-path="allocation.posts.${r.post}" ${on?"checked":""} ${AL.assiette!=="client"?"disabled":""} aria-label="Retenir ${esc(r.post)}"></td>
          <td><span class="rank ${i===0?"top1":i<3?"top":""}">${i+1}</span></td>
          <td class="cat">${esc(r.post)}</td>
          <td class="num" style="color:${i===0?"var(--gold)":"inherit"};font-weight:600">${pf(r.tauxEffectif,2)}</td>
          <td class="num">${mda(r.encMoyen,0)}</td>
          <td class="num">${mda(r.revAnnuel,1)}</td>
          <td class="num">${pf(r.partRevenu,1)}</td>${a.parSource?`<td class="num" style="color:var(--charia);font-weight:600">${pf((STATE.params.keysSource[r.post]||[0,0])[1],0)}</td>`:""}</tr>`;}).join("")}
      <tr class="total"><td></td><td></td><td>PANIER RETENU</td><td class="num">${pf(b.rendement,2)}</td><td class="num">${mda(b.enc,0)}</td><td class="num">${mda(b.rev,1)}</td><td class="num">—</td>${a.parSource?`<td class="num">${pf(a.cleSource||0,2)}</td>`:""}</tr>
      </tbody></table></div>
    <div class="note info" style="margin-bottom:0">${a.opt.atteint
      ? `L'optimisation retient les <b>${a.opt.posts.length}</b> financements les plus rentables : c'est le panier le <b>plus largement adossé</b> qui tient encore la cible de ${pf(AL.cible,2)}. Ajouter un financement moins rentable dilue le rendement.`
      : `Cible de <b>${pf(AL.cible,2)}</b> hors de portée : même adossé au seul financement le plus rentable, le taux net plafonne à <b>${pf(a.opt.max,2)}</b>. Agir sur les clés ci-dessous, ou revoir la cible.`}</div>
  </div>

  <h3 class="sub">4 · Clés de répartition du compte</h3>
  <div class="grid2">
    <div class="card">
      <div class="tbl-wrap"><table><tbody>
        <tr><td>Origine de la clé</td><td class="num"><select class="cell" data-path="allocation.cleMode">
          <option value="contrat" ${AL.cleMode==="contrat"?"selected":""}>${a.parSource?"Moyenne des sources":"Clé contractuelle"} (${pf(a.cleContrat,2)})</option>
          <option value="manuel" ${AL.cleMode==="manuel"?"selected":""}>Clé négociée</option></select></td></tr>
        <tr><td>Clé effective (après tanazul)</td><td class="num">${pf(c.cleEffective,2)}</td></tr>
        <tr><td>Clé de maturité (${esc(AL.maturite)})</td><td class="num">${pf(a.cleMaturite,0)}</td></tr>
        ${a.parSource?`<tr><td>Clé moyenne pondérée des sources <span class="tag charia">par source</span></td><td class="num">${pf(a.cleSource||0,2)}</td></tr>`:""}
        <tr><td>Part Moudarib nette</td><td class="num">${mda(c.partBanque,3)} MDA</td></tr>
      </tbody></table></div>
    </div>
    <div class="card">
      <div class="lever">
        <div class="lv-h"><span>Clé déposant négociée <span class="tag charia">charia</span></span><b>${pf(AL.cleMode==="manuel"?AL.cleManuelle:a.cleContrat,2)}</b></div>
        <input class="rng" type="range" min="0" max="100" step="1" value="${((AL.cleMode==="manuel"?AL.cleManuelle:a.cleContrat)*100).toFixed(0)}" data-path="allocation.cleManuelle" data-pct="1" data-activate="allocation.cleMode|manuel" aria-label="Clé déposant négociée">
        <div class="lv-s">Ne vaut que pour les périodes futures, après publication et validation ALCO + Comité Charia.</div>
      </div>
      <div class="lever">
        <div class="lv-h"><span>Tanazul — renonciation du Moudarib <span class="tag charia">charia</span></span><b>${pf(AL.tanazul,2)}</b></div>
        <input class="rng" type="range" min="0" max="100" step="1" value="${(AL.tanazul*100).toFixed(0)}" data-path="allocation.tanazul" data-pct="1" aria-label="Tanazul">
        <div class="lv-s">Renonciation volontaire de la banque — licite et applicable immédiatement.</div>
      </div>
    </div>
  </div>

  <h3 class="sub">5 · Effet de l'allocation</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Base d'adossement</th><th class="num">Rendement panier</th><th class="num">Clé</th><th class="num">Taux net servi</th><th class="num">Net versé (MDA)</th></tr></thead>
    <tbody>
      <tr><td class="cat">Pool global (mutualisé)</td><td class="num">${pf(a.ref.basket.rendement,2)}</td><td class="num">${pf(a.cleContrat,0)}</td><td class="num">${pf(a.ref.casc.tauxNet,2)}</td><td class="num">${mda(a.ref.casc.net,3)}</td></tr>
      <tr class="total"><td>Panier affecté (Mouqayyada)</td><td class="num">${pf(b.rendement,2)}</td><td class="num">${pf(c.cleEffective,2)}</td><td class="num">${pf(c.tauxNet,2)}</td><td class="num">${mda(c.net,3)}</td></tr>
      <tr><td>Écart</td><td class="num"><span class="delta ${b.rendement>=a.ref.basket.rendement?"up":"down"}">${b.rendement>=a.ref.basket.rendement?"+":""}${pf(b.rendement-a.ref.basket.rendement,2)}</span></td><td class="num">—</td><td class="num"><span class="delta ${gainUp?"up":"down"}">${gainUp?"+":""}${pf(a.gain,2)}</span></td><td class="num"><span class="delta ${gainUp?"up":"down"}">${gainUp?"+":""}${mda(c.net-a.ref.casc.net,3)}</span></td></tr>
    </tbody></table></div>

  <div class="note info">Base de calcul du panier : <b>revenus des financements retenus − charges au prorata − PER</b>, rapportés à leurs <b>encours moyens</b>. Les <b>commissions du pool</b> (non rattachables à des actifs désignés) en sont exclues — d'où un rendement de panier différent du rendement du pool global affiché en Synthèse, qui est lui rapporté aux <b>ressources investies</b>.</div>

  <div class="note charia">Un compte d'investissement <b>affecté</b> impose une comptabilité ségréguée du panier, la mention contractuelle des actifs éligibles et un adossement effectif du dépôt (AAOIFI FAS 27 · comptes restreints). Le rendement reste <b>non garanti</b> : le titulaire supporte le risque de perte en capital, sauf faute, négligence ou violation du mandat par le Moudarib.</div>`;
};

VIEWS.clients=m=>{
  const C=m.clients, T=m.tiers;
  const seg=s=>`<span class="segtag ${s==="Particulier"?"pp":"ent"}">${esc(s)}</span>`;
  const f=(STATE.filtreClient||"").trim().toLowerCase();
  const tiersVus = f? T.filter(t=>(t.nom+" "+t.id+" "+t.segment+" "+(t.secteur||"")+" "+(t.agence||"")).toLowerCase().indexOf(f)>=0):T;
  return `
  <h2 class="section">Référentiel clients &amp; rentabilité</h2>
  <p class="lead">Référentiel des tiers (agence, segment, compte, contact, secteur, dirigeant, forme juridique) et détail de leurs financements et placements, avec ségrégation du principal et de la marge.</p>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Tiers en portefeuille",C.nbClients,"",null,{icon:"users",
      note:`${C.lignes.length} positions · ${m.secteurs.length} secteur(s)`})}
    ${kpi("Encours de financement",mda(C.totFin,0),"MDA","brand",{icon:"invest",
      note:`marge générée <b>${mda(C.totRevenu,1)}</b> MDA · taux <b>${pf(C.tauxFinMoyen,2)}</b>`})}
    ${kpi("Dépôts collectés",mda(C.totPlc,0),"MDA","gold",{icon:"wallet",
      note:`rémunération servie <b>${mda(C.totRemu,2)}</b> MDA · taux <b>${pf(C.tauxPlcMoyen,2)}</b>`})}
    ${kpi("Gap de taux",pf(C.gap,2),"",C.gap>0?"brand":"warn",{icon:"scale",
      note:`financement <b>${pf(C.tauxFinMoyen,2)}</b> − placement <b>${pf(C.tauxPlcMoyen,2)}</b>`})}
  </div>

  <h3 class="sub">1 · Référentiel des tiers</h3>
  <div class="actbar">
    <input class="search" type="search" data-path="filtreClient" value="${esc(STATE.filtreClient||"")}" placeholder="Rechercher (nom, identifiant, segment, secteur, agence)…" aria-label="Rechercher un tiers">
    <span class="sep"></span><span class="mini">${tiersVus.length} / ${T.length} tiers</span>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>ID</th><th>Nom / Raison sociale</th><th>Segment</th><th>Agence</th><th>N° de compte</th><th>Email</th><th>Adresse</th><th>Secteur d'activité</th><th>Gérant / DG</th><th>Forme juridique</th></tr></thead>
    <tbody>
    ${tiersVus.map(t=>{const i=STATE.tiers.findIndex(x=>x[0]===t.id);return `<tr>
      <td class="mini">${esc(t.id)}</td>
      <td>${txtInput(`tiers.${i}.1`,t.nom)}</td>
      <td><select class="cell" data-path="tiers.${i}.2"><option ${t.segment==="Entreprise"?"selected":""}>Entreprise</option><option ${t.segment==="Particulier"?"selected":""}>Particulier</option></select></td>
      <td>${txtInput(`tiers.${i}.3`,t.agence)}</td>
      <td class="mini">${txtInput(`tiers.${i}.4`,t.compte)}</td>
      <td class="mini">${txtInput(`tiers.${i}.5`,t.email)}</td>
      <td>${txtInput(`tiers.${i}.6`,t.adresse)}</td>
      <td>${txtInput(`tiers.${i}.7`,t.secteur)}</td>
      <td>${txtInput(`tiers.${i}.8`,t.gerant)}</td>
      <td>${txtInput(`tiers.${i}.9`,t.forme)}</td></tr>`;}).join("")}
    </tbody></table></div>
  <div class="actbar" style="margin-top:12px">
    <button type="button" class="abtn" data-act="ti-add">Ajouter un tiers</button>
    ${T.length?`<button type="button" class="abtn" data-act="ti-del">Retirer le dernier</button>`:""}
  </div>

  <h3 class="sub">2 · Rentabilité par client</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Client</th><th>Secteur</th><th>Agence</th><th class="num">Fin. (principal)</th><th class="num">Marge générée</th><th class="num">Taux fin.</th><th class="num">Dépôts (principal)</th><th class="num">Rémun. servie</th><th class="num">Taux servi</th><th class="num">Contribution nette</th></tr></thead>
    <tbody>
    ${C.parClient.map(c=>`<tr>
      <td class="cat">${esc(c.nom)}<div class="mini">${esc(c.id)} · ${seg(c.segment)}</div></td>
      <td class="mini">${esc(c.secteur||"—")}</td><td class="mini">${esc(c.agence||"—")}</td>
      <td class="num">${c.fin?mda(c.fin,0):"—"}</td>
      <td class="num">${c.revenu?mda(c.revenu,2):"—"}</td>
      <td class="num">${c.fin?pf(c.tauxFin,2):"—"}</td>
      <td class="num">${c.plc?mda(c.plc,0):"—"}</td>
      <td class="num">${c.plc?mda(c.remu,3):"—"}</td>
      <td class="num">${c.plc?pf(c.tauxPlc,2):"—"}</td>
      <td class="num"><span class="delta ${c.net>=0?"up":"down"}">${c.net>=0?"+":""}${mda(c.net,2)}</span></td></tr>`).join("")}
    <tr class="total"><td>TOTAL</td><td></td><td></td><td class="num">${mda(C.totFin,0)}</td><td class="num">${mda(C.totRevenu,2)}</td>
      <td class="num">${pf(C.tauxFinMoyen,2)}</td><td class="num">${mda(C.totPlc,0)}</td><td class="num">${mda(C.totRemu,2)}</td>
      <td class="num">${pf(C.tauxPlcMoyen,2)}</td><td class="num">${mda(C.totRevenu-C.totRemu,2)}</td></tr>
    </tbody></table></div>
  <div class="note info">La <b>marge générée</b> (financements) et la <b>rémunération servie</b> (dépôts) sont ségréguées du principal. La <b>contribution nette</b> est une marge de premier niveau : elle n'intègre ni charges de structure ni coût du risque.</div>

  <h3 class="sub">3 · Détail des financements — principal &amp; marge</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Client</th><th>Produit</th><th class="num">Principal (encours)</th><th class="num">Taux de marge</th><th class="num">Marge annuelle</th></tr></thead>
    <tbody>
    ${C.lignes.filter(p=>p.sens==="Financement").map(p=>`<tr>
      <td class="cat">${esc(p.nom)} <span class="mini">${esc(p.id)}</span></td><td>${esc(p.produit)}</td>
      <td class="num">${mda(p.principal,0)}</td><td class="num">${pf(p.taux,2)}</td><td class="num">${mda(p.marge,2)}</td></tr>`).join("")}
    <tr class="total"><td>TOTAL</td><td></td><td class="num">${mda(C.totFin,0)}</td><td class="num">${pf(C.tauxFinMoyen,2)}</td><td class="num">${mda(C.totRevenu,2)}</td></tr>
    </tbody></table></div>

  <h3 class="sub">4 · Détail des placements — principal &amp; rémunération</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Client</th><th>Produit</th><th>Maturité</th><th class="num">Principal (capital)</th><th class="num">Rémun. brute</th><th class="num">IRR</th><th class="num">IRG</th><th class="num">Rémun. nette</th><th class="num">Taux net</th></tr></thead>
    <tbody>
    ${C.lignes.filter(p=>p.sens==="Placement").map(p=>`<tr>
      <td class="cat">${esc(p.nom)} <span class="mini">${esc(p.id)}</span></td><td>${esc(p.produit)}</td>
      <td class="mini">${esc(p.maturite||"à vue")}</td>
      <td class="num">${mda(p.principal,0)}</td><td class="num">${mda(p.margeBrute,3)}</td>
      <td class="num">−${mda(p.irr,3)}</td><td class="num">−${mda(p.irg,3)}</td>
      <td class="num">${mda(p.remuneration,3)}</td><td class="num">${pf(p.taux,2)}</td></tr>`).join("")}
    <tr class="total"><td>TOTAL</td><td></td><td></td><td class="num">${mda(C.totPlc,0)}</td>
      <td class="num">${mda(sum(C.parClient.map(c=>c.margeBrutePlc)),2)}</td><td class="num"></td><td class="num"></td>
      <td class="num">${mda(C.totRemu,2)}</td><td class="num">${pf(C.tauxPlcMoyen,2)}</td></tr>
    </tbody></table></div>

  <h3 class="sub">5 · Courbe des taux &amp; gap d'intermédiation</h3>
  <div class="grid2">
    <div class="card"><h3 class="sub" style="margin-top:2px">Placement vs financement par maturité</h3>
      ${multiLine([
        {name:"Taux de financement (moyen)",values:C.gapCourbe.map(g=>g.financement)},
        {name:"Taux de placement (brut)",values:C.gapCourbe.map(g=>g.placementBrut)},
        {name:"Taux servi net",values:C.gapCourbe.map(g=>g.placementNet)}
      ],C.gapCourbe.map(g=>g.mat),{pct:true,zero:true,aria:"Courbe des taux de placement et de financement"})}</div>
    <div class="card"><h3 class="sub" style="margin-top:2px">Gap par maturité</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Maturité</th><th class="num">Financement</th><th class="num">Placement brut</th><th class="num">Gap</th></tr></thead>
        <tbody>${C.gapCourbe.map(g=>`<tr><td class="cat">${esc(g.mat)}</td>
          <td class="num">${pf(g.financement,2)}</td><td class="num">${pf(g.placementBrut,2)}</td>
          <td class="num"><span class="delta ${g.gap>=0?"up":"down"}">${g.gap>=0?"+":""}${pf(g.gap,2)}</span></td></tr>`).join("")}
        </tbody></table></div></div>
  </div>

  <h3 class="sub">6 · Positions (financements &amp; placements)</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Client</th><th>Sens</th><th>Produit</th><th class="num">Montant (MDA)</th><th>Maturité</th></tr></thead>
    <tbody>
    ${STATE.positions.map((r,i)=>{const t=STATE.tiers.find(x=>x[0]===r[0]);return `<tr>
      <td><select class="cell" data-path="positions.${i}.0" style="min-width:150px">${STATE.tiers.map(x=>`<option value="${esc(x[0])}" ${x[0]===r[0]?"selected":""}>${esc(x[1])}</option>`).join("")}</select></td>
      <td><select class="cell" data-path="positions.${i}.1"><option ${r[1]==="Financement"?"selected":""}>Financement</option><option ${r[1]==="Placement"?"selected":""}>Placement</option></select></td>
      <td><select class="cell" data-path="positions.${i}.2" style="min-width:180px">${(r[1]==="Financement"?FIN_POSTS:CATS_PLACEMENT).map(x=>`<option ${x===r[2]?"selected":""}>${esc(x)}</option>`).join("")}</select></td>
      <td class="num">${numInput(`positions.${i}.3`,r[3],{step:1})}</td>
      <td><select class="cell" data-path="positions.${i}.4"><option value="" ${!r[4]?"selected":""}>à vue</option>${Object.keys(STATE.params.mat).map(k=>`<option ${k===r[4]?"selected":""}>${k}</option>`).join("")}</select></td></tr>`;}).join("")}
    </tbody></table></div>
  <div class="actbar" style="margin-top:12px">
    <button type="button" class="abtn" data-act="po-add">Ajouter une position</button>
    ${STATE.positions.length?`<button type="button" class="abtn" data-act="po-del">Retirer la dernière</button>`:""}
  </div>`;
};

VIEWS.cotation=m=>{
  const CO=STATE.cotation, q=m.cotation, c=q.casc, C=m.clients;
  return `
  <h2 class="section">Cotation d'un placement</h2>
  <p class="lead">Établir le taux indicatif servi à un client pour une demande de placement, vérifier la marge d'intermédiation et la position vis-à-vis du marché avant engagement commercial.</p>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Taux net proposé",pf(c.tauxNet,2),"","gold",{icon:"pct",
      note:`brut <b>${pf(c.tauxBrut,2)}</b> · clé <b>${pf(c.cleEffective,2)}</b>`})}
    ${kpi("Profit net versé",mda(c.net,3),"MDA",null,{icon:"coins",
      note:`sur ${mda(CO.montant,0)} MDA · ${esc(CO.maturite)}`})}
    ${kpi("Marge d'intermédiation",pf(q.marge,2),"",q.marge>=STATE.params.margeMin?"brand":"warn",
      {icon:"scale",bar:Math.max(0,Math.min(1,q.marge/0.06)),
       note:`minimum requis <b>${pf(STATE.params.margeMin,2)}</b>`})}
    ${kpi("Écart au marché",(q.ecartMarche>=0?"+":"")+pf(q.ecartMarche,2),"",q.ecartMarche>=0?"brand":"warn",
      {icon:"gauge",note:`référence marché <b>${pf(STATE.params.tauxMarche,2)}</b>`})}
  </div>

  <h3 class="sub">1 · Demande du client</h3>
  <div class="card">
    <div class="ctl-row">
      <label class="fld"><span>Client</span>
        <select class="cell" data-path="cotation.clientId">
          <option value="">— Nouveau client / prospect —</option>
          ${C.parClient.map(x=>`<option value="${esc(x.id)}" ${x.id===CO.clientId?"selected":""}>${esc(x.nom)}</option>`).join("")}
        </select></label>
      <label class="fld"><span>Type de placement</span>
        <select class="cell" data-path="cotation.produit">
          ${CATS_PLACEMENT.map(x=>`<option value="${esc(x)}" ${x===CO.produit?"selected":""}>${esc(x)}</option>`).join("")}
        </select></label>
      <label class="fld"><span>Montant (MDA)</span>${numInput("cotation.montant",CO.montant,{step:1})}</label>
      <label class="fld"><span>Maturité</span>
        <select class="cell" data-path="cotation.maturite">${Object.keys(STATE.params.mat).map(k=>`<option ${k===CO.maturite?"selected":""}>${k}</option>`).join("")}</select></label>
      <label class="fld"><span>Personne physique</span>
        <select class="cell" data-path="cotation.pp"><option ${CO.pp==="Oui"?"selected":""}>Oui</option><option ${CO.pp==="Non"?"selected":""}>Non</option></select></label>
    </div>
    ${q.client?`<div class="cover ok"><span class="ci"></span><span>Relation existante : <b>${esc(q.client.nom)}</b> — ${mda(q.client.fin,0)} MDA de financements (revenu ${mda(q.client.revenu,2)}) et ${mda(q.client.plc,0)} MDA de dépôts. Contribution nette actuelle <b>${mda(q.client.net,2)}</b> MDA.</span></div>`
      :`<div class="note info" style="margin-bottom:0">Prospect sans position enregistrée : la cotation ne tient pas compte d'une relation existante.</div>`}
  </div>

  <h3 class="sub">2 · Assiette d'adossement</h3>
  <div class="card">
    <div class="segrow" role="radiogroup" aria-label="Assiette d'adossement">
      ${[["pool","Pool global","Le placement suit le rendement moyen du pool (Moudaraba Motlaqa)."],

      <select class="cell" data-path="cotation.assietteClient">${m.tiers.map(t=>`<option value="${esc(t.id)}" ${t.id===CO.assietteClient?"selected":""}>${esc(t.nom)} — ${esc(t.secteur||"—")}</option>`).join("")}</select></label>
      <div class="fld"><span>Financements adossés</span><div class="statline">${(q.postes||[]).map(esc).join(" · ")||"aucun financement pour ce client"}</div></div></div>`:""}
    ${CO.assiette==="secteur"?`<div class="ctl-row" style="margin-top:14px;margin-bottom:0"><label class="fld"><span>Secteur d'activité</span>
      <select class="cell" data-path="cotation.secteur">${m.secteurs.map(sec=>`<option value="${esc(sec)}" ${sec===CO.secteur?"selected":""}>${esc(sec)}</option>`).join("")}</select></label>
      <div class="fld"><span>Financements du secteur</span><div class="statline">${(q.postes||[]).map(esc).join(" · ")||"aucun financement pour ce secteur"}</div></div></div>`:""}
    ${CO.assiette==="projet"?`<div style="margin-top:14px"><div class="mini" style="margin-bottom:8px">Sélectionner les financements adossés :</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px 18px">${m.ecoul.rows.map(r=>`<label class="mini" style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" class="chk" data-path="cotation.postes.${r.post}" ${(CO.postes||{})[r.post]?"checked":""}> ${esc(r.post)} <b>(${pf(r.tauxEffectif,1)})</b></label>`).join("")}</div></div>`:""}
    <div class="cover ${q.assietteValide?"ok":"ko"}" style="margin-top:14px"><span class="ci"></span><span>${q.assietteValide
      ? `Assiette : <b>${esc(q.libAssiette)}</b> — rendement <b>${pf(q.rendementAssiette,2)}</b>, taux de marge <b>${pf(q.tauxFinMoyen,2)}</b>.`
      : `<b>Aucun financement adossé</b> à cette assiette : élargir la sélection. Un compte affecté doit être couvert par des actifs réels.`}</span></div>
    <div class="note charia" style="margin-bottom:0">Adosser une cotation à un panier restreint (projet, client, secteur) relève de la <b>Moudaraba Mouqayyada</b> — compte d'investissement affecté : comptabilité ségréguée et actifs éligibles mentionnés au contrat.</div>
  </div>

  <h3 class="sub">3 · Conditions proposées</h3>
  <div class="grid2">
    <div class="card">
      <div class="tbl-wrap"><table><tbody>
        <tr><td>Rendement de l'assiette retenue</td><td class="num">${pf(q.rendementAssiette,2)}</td></tr>
        <tr><td>Clé de la grille (${esc(CO.maturite)})</td><td class="num">${pf(q.cleGrille,0)}</td></tr>
        <tr><td>Clé appliquée</td><td class="num"><select class="cell" data-path="cotation.cleMode">
          <option value="grille" ${CO.cleMode==="grille"?"selected":""}>Grille standard</option>
          <option value="negocie" ${CO.cleMode==="negocie"?"selected":""}>Clé négociée</option></select></td></tr>

        <tr><td>Retenue IRG</td><td class="num">−${mda(c.irg,3)}</td></tr>
        <tr class="total"><td>NET VERSÉ</td><td class="num">${mda(c.net,3)} MDA</td></tr>
        <tr><td>Rémunération de la banque (Moudarib)</td><td class="num">${mda(c.partBanque,3)}</td></tr>
      </tbody></table></div>
    </div>
    <div class="card">
      <div class="lever">
        <div class="lv-h"><span>Clé déposant négociée <span class="tag charia">charia</span></span><b>${pf(CO.cleMode==="negocie"?CO.cleManuelle:q.cleGrille,2)}</b></div>
        <input class="rng" type="range" min="0" max="100" step="1" value="${((CO.cleMode==="negocie"?CO.cleManuelle:q.cleGrille)*100).toFixed(0)}" data-path="cotation.cleManuelle" data-pct="1" data-activate="cotation.cleMode|negocie" aria-label="Clé négociée">
        <div class="lv-s">Toute clé hors grille doit être validée et ne vaut que pour les périodes futures.</div>
      </div>
      <div class="lever">
        <div class="lv-h"><span>Tanazul — geste commercial <span class="tag charia">charia</span></span><b>${pf(CO.tanazul,2)}</b></div>
        <input class="rng" type="range" min="0" max="100" step="1" value="${(CO.tanazul*100).toFixed(0)}" data-path="cotation.tanazul" data-pct="1" aria-label="Tanazul">
