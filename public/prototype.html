<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMS — Profit Sharing Management</title>
<style>
/* Aucune ressource externe : la page doit s'ouvrir sur un poste isolé, sans réseau. */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#eef2f7;
  --ink:#0b1220; --ink-2:#33415a; --muted:#647089; --faint:#8a95a8;
  --line:#e3e8f0; --line-2:#d2dae6;
  --navy:#0f172a; --navy-2:#182338; --navy-3:#233149;
  --brand:#0c7a58; --brand-2:#12a074; --brand-ink:#ffffff; --brand-soft:#e7f4ef;
  --gold:#9a6a08; --gold-2:#b5820f; --gold-soft:#fbf2dd;
  --pos:#0c7a4e; --pos-bg:#e4f4ec; --neg:#c0362c; --neg-bg:#fbeae8;
  --info:#1d4ed8; --info-bg:#eaf0ff;
  --saisie:#1d4ed8; --saisie-bg:#eef3ff; --saisie-line:#b9caf5;
  --charia:#9a6a08; --charia-bg:#fbf2dd; --charia-line:#e6cf95;
  --ok:#0c7a4e; --ok-bg:#e4f4ec; --err:#c0362c; --err-bg:#fbeae8;
  --rail:#0f172a; --rail-2:#141f36; --rail-ink:#e8edf6; --rail-muted:#8b97ad; --rail-line:#22304a; --rail-active:#12a074;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 1px 3px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);
  --shadow-lg:0 4px 12px rgba(15,23,42,.08),0 18px 40px rgba(15,23,42,.10);
  --r:10px; --r-sm:7px; --r-lg:14px;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular",ui-monospace,"DejaVu Sans Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070b13; --surface:#0f1826; --surface-2:#131f30; --surface-3:#172436;
  --ink:#e7edf6; --ink-2:#b7c2d4; --muted:#8895ac; --faint:#65728a;
  --line:#1d2a3d; --line-2:#28374f;
  --navy:#0b1220; --navy-2:#131e33; --navy-3:#1d2b45;
  --brand:#12a074; --brand-2:#1cc290; --brand-ink:#04140e; --brand-soft:#0e2a22;
  --gold:#d3a340; --gold-2:#e8bd63; --gold-soft:#231c0d;
  --pos:#2fc586; --pos-bg:#0e2a1e; --neg:#f0736a; --neg-bg:#2c1512;
  --info:#6da2ff; --info-bg:#0f1d33;
  --saisie:#6da2ff; --saisie-bg:#0e1c31; --saisie-line:#23385c;
  --charia:#d3a340; --charia-bg:#231c0d; --charia-line:#4a3c14;
  --ok:#2fc586; --ok-bg:#0e2a1e; --err:#f0736a; --err-bg:#2c1512;
  --rail:#0a111d; --rail-2:#0f1a2c; --rail-ink:#dce5f2; --rail-muted:#7c8aa3; --rail-line:#1a273c; --rail-active:#1cc290;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 6px 20px rgba(0,0,0,.5),0 24px 50px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#070b13; --surface:#0f1826; --surface-2:#131f30; --surface-3:#172436;
  --ink:#e7edf6; --ink-2:#b7c2d4; --muted:#8895ac; --faint:#65728a;
  --line:#1d2a3d; --line-2:#28374f;
  --navy:#0b1220; --navy-2:#131e33; --navy-3:#1d2b45;
  --brand:#12a074; --brand-2:#1cc290; --brand-ink:#04140e; --brand-soft:#0e2a22;
  --gold:#d3a340; --gold-2:#e8bd63; --gold-soft:#231c0d;
  --pos:#2fc586; --pos-bg:#0e2a1e; --neg:#f0736a; --neg-bg:#2c1512;
  --info:#6da2ff; --info-bg:#0f1d33;
  --saisie:#6da2ff; --saisie-bg:#0e1c31; --saisie-line:#23385c;
  --charia:#d3a340; --charia-bg:#231c0d; --charia-line:#4a3c14;
  --ok:#2fc586; --ok-bg:#0e2a1e; --err:#f0736a; --err-bg:#2c1512;
  --rail:#0a111d; --rail-2:#0f1a2c; --rail-ink:#dce5f2; --rail-muted:#7c8aa3; --rail-line:#1a273c; --rail-active:#1cc290;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 6px 20px rgba(0,0,0,.5),0 24px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.num,td.num,th.num,.k-v,input.cell,.vl{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px}


.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0 24px;height:60px;display:flex;align-items:center;gap:14px}
.top .crumb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.top .crumb .c1{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.2px}
.top .crumb .c2{font-size:15.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.periodchip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2)}
.periodchip b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line-2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.ok .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.pill.err{background:var(--err-bg);color:var(--err);border-color:transparent}
.pill.err .dot{background:var(--err);box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 20%,transparent)}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);height:34px;padding:0 13px;border-radius:8px;font-weight:600;cursor:pointer;font-size:12.5px;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.btn svg{width:15px;height:15px;stroke:currentColor}
.btn:hover{border-color:var(--brand-2);color:var(--brand-2);background:var(--brand-soft)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}
.wrap{padding:24px 26px 40px;max-width:1240px;width:100%}
.view{display:none}
.view.active{display:block;animation:fade .28s cubic-bezier(.22,1,.36,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
h2.section{font-size:20px;margin:0 0 5px;font-weight:700;letter-spacing:-.3px}
.lead{color:var(--muted);margin:0 0 22px;max-width:82ch;font-size:13px;line-height:1.6}
h3.sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--brand);margin:28px 0 13px;font-weight:700;display:flex;align-items:center;gap:9px}
h3.sub::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--brand);display:inline-block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:18px 20px;margin-bottom:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm)}
.tbl-wrap::-webkit-scrollbar{height:10px}.tbl-wrap::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}.tbl-wrap::-webkit-scrollbar-track{background:transparent}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--surface-2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);position:sticky;top:0;border-bottom:1px solid var(--line-2)}
tbody tr{transition:background .12s}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.cat{font-weight:600;color:var(--ink)}
tr.total td{font-weight:700;border-top:1.5px solid var(--line-2);background:var(--surface-2);color:var(--ink)}
tr.total td.num{font-size:13px;color:var(--ink)}
input.cell{width:100%;min-width:84px;max-width:148px;border:1px solid var(--saisie-line);background:var(--saisie-bg);color:var(--saisie);border-radius:7px;padding:6px 9px;font-family:var(--mono);font-size:12.5px;text-align:right;font-weight:600;transition:border-color .15s,box-shadow .15s}
input.cell:hover{border-color:var(--saisie)}
input.cell:focus{outline:none;border-color:var(--saisie);box-shadow:0 0 0 3px color-mix(in srgb,var(--saisie) 22%,transparent)}
input.cell.charia{border-color:var(--charia-line);background:var(--charia-bg);color:var(--charia)}
input.cell.charia:focus{border-color:var(--charia);box-shadow:0 0 0 3px color-mix(in srgb,var(--charia) 22%,transparent)}
input.txt{border:1px solid var(--saisie-line);background:var(--saisie-bg);color:var(--saisie);border-radius:7px;padding:7px 10px;font-size:13px;font-weight:600;font-family:inherit}
input.txt:focus{outline:none;border-color:var(--saisie);box-shadow:0 0 0 3px color-mix(in srgb,var(--saisie) 22%,transparent)}
select.cell{border:1px solid var(--saisie-line);background:var(--saisie-bg);color:var(--saisie);border-radius:7px;padding:7px 10px;font-weight:600;font-family:inherit;font-size:13px;cursor:pointer}
select.cell:focus{outline:none;border-color:var(--saisie);box-shadow:0 0 0 3px color-mix(in srgb,var(--saisie) 22%,transparent)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.2px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.err{background:var(--err-bg);color:var(--err)}
.tag{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.4px;text-transform:uppercase;vertical-align:middle}
.tag.saisie{background:var(--saisie-bg);color:var(--saisie)}
.tag.charia{background:var(--charia-bg);color:var(--charia);box-shadow:inset 0 0 0 1px var(--charia-line)}
.tag.auto{background:var(--surface-3);color:var(--muted);font-family:var(--mono);text-transform:none;letter-spacing:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin:16px 0 4px;font-size:12px;color:var(--muted)}
.legend .li{display:flex;align-items:center;gap:8px}
.sw{width:13px;height:13px;border-radius:4px;flex:none}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--gold-2);border-radius:9px;padding:13px 16px;font-size:12.5px;color:var(--ink-2);margin:16px 0;line-height:1.55}
.note.charia{border-left-color:var(--charia)}
.note.info{border-left-color:var(--info)}
.note b{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}
.mini{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);fill:var(--muted)}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--navy),var(--navy-2));border-radius:var(--r-lg);padding:30px 30px;box-shadow:var(--shadow);margin-bottom:20px;color:#fff}
.hero::after{content:"";pointer-events:none;position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(18,160,116,.28),transparent 68%)}
.hero h2{font-size:25px;margin:0 0 8px;letter-spacing:-.5px;color:#fff;position:relative}
.hero p{margin:0;color:#c4cede;max-width:80ch;position:relative;font-size:13px;line-height:1.65}
.flowchain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px;position:relative}
.flowchain .n{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#eaf0f8;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.flowchain .n:hover{background:rgba(18,160,116,.3);border-color:var(--brand-2)}
.flowchain .ar{color:#5f6f88;font-weight:700}
.arch{display:grid;grid-template-columns:158px 1fr;gap:0 18px;font-size:13px}
.arch .a-k{font-weight:600;color:var(--brand);padding:9px 0;border-bottom:1px solid var(--line)}
.arch .a-v{color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line);line-height:1.5}
.comp-list{list-style:none;padding:0;margin:0}
.comp-list li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:13px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.comp-list li:last-child{border-bottom:none}
.comp-list .num{width:25px;height:25px;border-radius:7px;background:var(--charia-bg);color:var(--charia);font-weight:700;display:grid;place-items:center;flex:none;font-size:12px;font-family:var(--mono);box-shadow:inset 0 0 0 1px var(--charia-line)}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.mob-toggle{display:none}
@media print{
  .side,.top .btn,.mob-toggle,.selftest,.periodchip{display:none!important}
  .app{grid-template-columns:1fr}.view{display:block!important;page-break-after:always}
  .top{position:static}body{background:#fff;font-size:11px}
  .card,.tbl-wrap,.kpi{box-shadow:none;border-color:#ccc}
  .hero{background:#0f172a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ---- Moteur de calcul : contrôles ---- */
.ctl-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:190px;flex:1}
.fld>span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.fld input.cell{max-width:none}
.statline{font-size:12.5px;color:var(--ink-2);padding:7px 0}
.statline b{color:var(--ink);font-family:var(--mono);font-weight:600}
.solve{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--brand-2);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand-2) 35%,transparent);border-radius:8px;padding:5px 13px;text-align:center;letter-spacing:-.5px}
.solve.ko{color:var(--err);background:var(--err-bg);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px;margin:14px 0}
.pchip{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"c n r" "c e r";gap:0 10px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);cursor:pointer;transition:all .15s}
.pchip:hover{border-color:var(--brand-2)}
.pchip.on{border-color:var(--brand-2);background:var(--brand-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand-2) 25%,transparent)}
.pchip input{grid-area:c;width:16px;height:16px;accent-color:var(--brand-2);cursor:pointer}
.pchip .pn{grid-area:n;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25}
.pchip .pe{grid-area:e;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.pchip .pr{grid-area:r;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--brand)}
.lever{padding:12px 0;border-bottom:1px solid var(--line)}
.lever:last-child{border-bottom:none;padding-bottom:0}
.lever:first-child{padding-top:0}
.lv-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:9px}
.lv-h b{font-family:var(--mono);font-size:14px;color:var(--brand-2)}
.lv-s{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.45}
input.rng{width:100%;height:5px;border-radius:5px;background:var(--surface-3);appearance:none;outline:none;cursor:pointer}
input.rng:disabled{opacity:.45;cursor:not-allowed}
input.rng::-webkit-slider-thumb{appearance:none;width:17px;height:17px;border-radius:50%;background:var(--brand-2);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
input.rng::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--brand-2);border:2px solid var(--surface);cursor:pointer}
input.rng:focus-visible{outline:2px solid var(--brand-2);outline-offset:3px}
/* ============ NAVIGATION v3 — rail repliable + tiroir mobile fiable ============ */
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--brand);color:#fff;padding:10px 16px;border-radius:0 0 8px 0;font-weight:600}
.skip:focus{left:0}
.app{display:grid;grid-template-columns:var(--railw,262px) 1fr;min-height:100vh;transition:grid-template-columns .2s cubic-bezier(.22,1,.36,1)}
body.nav-collapsed{--railw:72px}

.side{background:var(--rail);color:var(--rail-ink);border-right:1px solid var(--rail-line);
      position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;z-index:60}
.brand{padding:16px 14px;border-bottom:1px solid var(--rail-line);display:flex;align-items:center;gap:10px;min-height:64px}
.brand .bwrap{flex:1;min-width:0;overflow:hidden}
.brand .t1{font-weight:700;font-size:17px;letter-spacing:1.5px;color:#fff;white-space:nowrap}
.brand .t2{font-size:10.5px;color:var(--rail-muted);margin-top:1px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.railbtn{appearance:none;background:transparent;border:1px solid transparent;color:var(--rail-muted);width:30px;height:30px;border-radius:7px;display:grid;place-items:center;cursor:pointer;flex:none;transition:all .15s}
.railbtn svg{width:16px;height:16px;stroke:currentColor;transition:transform .2s}
.railbtn:hover{background:rgba(255,255,255,.09);color:#fff}
.railbtn:focus-visible{outline:2px solid var(--rail-active);outline-offset:1px}
.railbtn.close{display:none}
body.nav-collapsed .railbtn#railBtn svg{transform:rotate(180deg)}
body.nav-collapsed .brand{padding:16px 0;justify-content:center}
body.nav-collapsed .brand .bwrap{display:none}

.nav{padding:10px 12px 14px;flex:1;overflow-y:auto;overscroll-behavior:contain}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--rail-line);border-radius:6px}
.nav .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--rail-muted);padding:14px 10px 6px;font-weight:700;white-space:nowrap}
.nav button[data-v]{appearance:none;background:transparent;border:0;width:100%;text-align:left;font-family:inherit;
  display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:8px;color:var(--rail-ink);
  font-weight:500;cursor:pointer;font-size:13.5px;transition:background .15s,color .15s;position:relative;margin-bottom:1px}
.nav button[data-v] svg{width:19px;height:19px;flex:none;stroke:currentColor;opacity:.7;transition:opacity .15s}
.nav button[data-v] .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button[data-v]:hover{background:rgba(255,255,255,.07)}
.nav button[data-v]:hover svg{opacity:1}
.nav button[data-v]:focus-visible{outline:2px solid var(--rail-active);outline-offset:-2px}
.nav button[data-v].active{background:rgba(18,160,116,.16);color:#fff;font-weight:600}
.nav button[data-v].active svg{opacity:1;stroke:var(--rail-active)}
.nav button[data-v].active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--rail-active)}
/* rail replié : icônes seules + info-bulle native via title */
body.nav-collapsed .nav{padding:10px 8px}
body.nav-collapsed .nav .grp{text-align:center;padding:12px 0 5px;font-size:0}
body.nav-collapsed .nav .grp::after{content:"•";font-size:11px;letter-spacing:0;color:var(--rail-line)}
body.nav-collapsed .nav button[data-v]{justify-content:center;padding:10px 0}
body.nav-collapsed .nav button[data-v] .lbl{display:none}
body.nav-collapsed .nav button[data-v].active::before{left:-8px}

.sidefoot{padding:12px 14px;border-top:1px solid var(--rail-line);display:flex;align-items:center;gap:10px;flex:none}
.sf-dot{width:8px;height:8px;border-radius:50%;background:var(--rail-active);flex:none;box-shadow:0 0 0 3px rgba(18,160,116,.22)}
.sf-dot.ko{background:var(--err);box-shadow:0 0 0 3px rgba(192,54,44,.25)}
.sf-txt{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sf-txt b{font-size:12.5px;color:#fff;font-family:var(--mono);font-weight:600;line-height:1.2}
.sf-txt span{font-size:10px;color:var(--rail-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.nav-collapsed .sidefoot{justify-content:center;padding:12px 0}
body.nav-collapsed .sf-txt{display:none}

/* voile du tiroir */
.scrim{position:fixed;inset:0;background:rgba(6,12,20,.55);backdrop-filter:blur(2px);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
body.nav-open .scrim{opacity:1;pointer-events:auto}

/* --- >=1100px : rail complet --- */
/* --- 721-1099px : rail compact en icones, TOUJOURS visible (jamais masque) --- */
@media(max-width:1099px) and (min-width:721px){
  .app{grid-template-columns:76px 1fr!important}
  .side{position:sticky;transform:none;width:auto}
  .brand{padding:16px 0;justify-content:center}
  .brand .bwrap{display:none}
  .railbtn#railBtn{display:none}
  .nav{padding:10px 8px}
  .nav .grp{text-align:center;padding:12px 0 5px;font-size:0}
  .nav .grp::after{content:"2";font-size:11px;letter-spacing:0;color:var(--rail-line)}
  .nav button[data-v]{justify-content:center;padding:11px 0}
  .nav button[data-v] .lbl{display:none}
  .nav button[data-v].active::before{left:-8px}
  .sidefoot{justify-content:center;padding:12px 0}
  .sf-txt{display:none}
  .mob-toggle{display:none}
  .scrim{display:none}
}
/* --- <=720px : tiroir avec voile --- */
@media(max-width:720px){
  .app{grid-template-columns:1fr!important}
  .side{position:fixed;top:0;left:0;width:280px;transform:translateX(-102%);
        transition:transform .24s cubic-bezier(.22,1,.36,1);box-shadow:none}
  body.nav-open .side{transform:none;box-shadow:var(--shadow-lg)}
  body.nav-collapsed{--railw:262px}
  body.nav-collapsed .brand{padding:16px 14px;justify-content:flex-start}
  body.nav-collapsed .brand .bwrap,body.nav-collapsed .sf-txt{display:block}
  body.nav-collapsed .nav button[data-v]{justify-content:flex-start;padding:9px 11px}
  body.nav-collapsed .nav button[data-v] .lbl{display:block}
  body.nav-collapsed .nav .grp{text-align:left;font-size:9.5px;padding:14px 10px 6px}
  body.nav-collapsed .nav .grp::after{content:none}
  .railbtn#railBtn{display:none}
  .railbtn.close{display:grid}
  .mob-toggle{display:inline-flex!important}
  .periodchip{display:none}
  .wrap{padding:16px 14px 40px}
}
@media(min-width:1100px){ .mob-toggle{display:none} .scrim{display:none} }
@media (prefers-reduced-motion:reduce){ .app,.side,.scrim{transition:none!important} }
/* ---- panneau de validation intégré (remplace le widget flottant) ---- */
.testhead{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.th-t{font-size:13.5px;font-weight:700;color:var(--ink)}
.th-s{font-size:11.5px;color:var(--muted);margin-top:3px;max-width:62ch;line-height:1.5}
.th-score{font-family:var(--mono);font-size:22px;font-weight:600;padding:6px 15px;border-radius:9px;letter-spacing:-.5px;flex:none}
.th-score.ok{background:var(--ok-bg);color:var(--ok)}
.th-score.ko{background:var(--err-bg);color:var(--err)}
.testgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:2px 20px}
.trow{display:grid;grid-template-columns:16px 1fr auto;gap:9px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.trow .ti{color:var(--ok);font-weight:800;text-align:center}
.trow.ko .ti{color:var(--err)}
.trow .tn{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tv{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:500}
.trow.ko .tv{color:var(--err)}
/* libellés de boutons masqués sur petits écrans */
@media(max-width:1180px){ .btn .btxt{display:none} .btn{padding:0 9px} .btn.primary{padding:0 11px} }
/* ---- Indicateurs (remplacent les anciennes cartes .kpi) ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:13px;margin-bottom:6px}
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:15px 16px 14px;box-shadow:var(--shadow-sm);transition:border-color .18s,box-shadow .18s,transform .18s;overflow:hidden}
.stat::after{content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;
  background:radial-gradient(120% 100% at 100% 0%,var(--tint,transparent),transparent 62%);opacity:.5}
.stat:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--line-2)}
.stat .s-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;position:relative;z-index:1}
.stat .s-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--icobg,var(--surface-3));color:var(--icofg,var(--muted))}
.stat .s-ico svg{width:16px;height:16px;stroke:currentColor}
.stat .s-lab{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.3;letter-spacing:.1px}
.stat .s-val{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.8px;color:var(--ink);
  line-height:1.1;position:relative;z-index:1;white-space:nowrap}
.stat .s-unit{font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:500;margin-left:5px;letter-spacing:0}
.stat .s-foot{margin-top:11px;position:relative;z-index:1}
.stat .s-bar{height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.stat .s-bar i{display:block;height:100%;border-radius:5px;background:var(--barc,var(--muted));transition:width .35s cubic-bezier(.22,1,.36,1)}
.stat .s-note{font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.4}
.stat .s-note b{color:var(--ink-2);font-weight:600;font-family:var(--mono)}
.stat.t-brand{--tint:color-mix(in srgb,var(--brand-2) 13%,transparent);--icobg:var(--brand-soft);--icofg:var(--brand);--barc:var(--brand-2)}
.stat.t-brand .s-val{color:var(--brand)}
.stat.t-gold{--tint:color-mix(in srgb,var(--gold-2) 15%,transparent);--icobg:var(--gold-soft);--icofg:var(--gold);--barc:var(--gold-2)}
.stat.t-gold .s-val{color:var(--gold)}
.stat.t-warn{--tint:color-mix(in srgb,var(--err) 12%,transparent);--icobg:var(--err-bg);--icofg:var(--err);--barc:var(--err)}
.stat.t-warn .s-val{color:var(--err)}
.stat.t-base{--tint:transparent;--icobg:var(--surface-3);--icofg:var(--ink-2);--barc:var(--ink-2)}
@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}.stat .s-val{font-size:21px}}

/* ---- Allocation par déposant ---- */
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--mono);
  font-size:11px;font-weight:700;background:var(--surface-3);color:var(--muted)}
.rank.top{background:var(--brand-soft);color:var(--brand)}
.rank.top1{background:var(--gold-soft);color:var(--gold)}
tr.picked td{background:color-mix(in srgb,var(--brand-2) 7%,var(--surface))}
tr.picked:hover td{background:color-mix(in srgb,var(--brand-2) 11%,var(--surface))}
.chk{width:17px;height:17px;accent-color:var(--brand-2);cursor:pointer;vertical-align:middle}
.actbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:13px}
.actbar .sep{flex:1}
.abtn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  height:31px;padding:0 12px;border-radius:8px;font-weight:600;font-size:12px;font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.abtn:hover{border-color:var(--brand-2);color:var(--brand-2);background:var(--brand-soft)}
.abtn:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.abtn.go{background:var(--brand);border-color:var(--brand);color:#fff}
.abtn.go:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.abtn svg{width:14px;height:14px;stroke:currentColor}
.cover{display:flex;align-items:center;gap:11px;padding:12px 15px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);font-size:12.5px;color:var(--ink-2);line-height:1.5}
.cover.ko{background:var(--err-bg);border-color:color-mix(in srgb,var(--err) 30%,transparent);color:var(--err)}
.cover.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.cover b{font-family:var(--mono);font-weight:600}
.cover .ci{width:20px;height:20px;flex:none}
.cover .ci svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.delta{font-family:var(--mono);font-weight:600;font-size:12px}
.delta.up{color:var(--ok)} .delta.down{color:var(--err)}
/* ---- Sélecteur segmenté (assiette d'attribution) ---- */
.segrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.seg{appearance:none;text-align:left;font-family:inherit;cursor:pointer;background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;transition:all .15s;display:block}
.seg b{display:block;font-size:13px;font-weight:650;color:var(--ink);margin-bottom:4px}
.seg span{display:block;font-size:11px;color:var(--muted);line-height:1.45}
.seg:hover{border-color:var(--brand-2)}
.seg:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.seg.on{border-color:var(--brand-2);background:var(--brand-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand-2) 30%,transparent)}
.seg.on b{color:var(--brand)}
.abtn:disabled,input.chk:disabled{opacity:.4;cursor:not-allowed}
.abtn:disabled:hover{border-color:var(--line-2);color:var(--ink-2);background:var(--surface)}
/* ---- Clients & cotation ---- */
.segtag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.3px}
.segtag.ent{background:var(--info-bg);color:var(--info)}
.segtag.pp{background:var(--brand-soft);color:var(--brand)}
.sens{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px}
.sens.f{background:var(--brand-soft);color:var(--brand)}
.sens.p{background:var(--gold-soft);color:var(--gold)}
tr.sub-row td{background:var(--surface-2);font-size:11.5px;color:var(--muted);border-bottom:1px dashed var(--line)}
tr.sub-row:hover td{background:var(--surface-3)}
/* ---- Import, recherche, dossier, impression ciblée ---- */
textarea.paste{width:100%;border:1px solid var(--saisie-line);background:var(--saisie-bg);color:var(--ink);
  border-radius:9px;padding:11px 13px;font-family:var(--mono);font-size:12px;line-height:1.6;resize:vertical}
textarea.paste:focus{outline:none;border-color:var(--saisie);box-shadow:0 0 0 3px color-mix(in srgb,var(--saisie) 22%,transparent)}
tr.lineok td{background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
tr.lineko td{background:color-mix(in srgb,var(--err) 7%,var(--surface))}
input.search{flex:1;min-width:220px;max-width:420px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:13px}
input.search:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 20%,transparent)}
.toast{position:fixed;left:50%;bottom:-90px;transform:translateX(-50%);z-index:300;background:var(--navy);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  transition:bottom .28s cubic-bezier(.22,1,.36,1);max-width:80vw}
.toast.show{bottom:24px}
.toast.ko{background:var(--err)}
.avis-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:14px 0 12px;
  border-bottom:2px solid var(--navy);margin-bottom:14px}
.avis-head b{font-size:15px}
@media print{
  body.print-target .top,body.print-target .side{display:none!important}
  body.print-target .view > *{display:none!important}
  body.print-target #avisImprimable,body.print-target #avisImprimable *,
  body.print-target #ficheImprimable,body.print-target #ficheImprimable *{display:revert!important}
  .actbar,textarea.paste,.toast{display:none!important}
}
/* ---- Circuit de validation, journal ---- */
.wf{display:flex;align-items:flex-start;gap:0;flex-wrap:wrap}
.wf-step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px;text-align:center}
.wf-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);
  font-weight:700;font-size:12px;background:var(--surface-3);color:var(--muted);border:2px solid var(--line-2)}
.wf-step.done .wf-dot{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-2)}
.wf-step.cur .wf-dot{background:var(--brand);color:#fff;border-color:var(--brand);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-2) 22%,transparent)}
.wf-lab{font-size:11.5px;font-weight:650;color:var(--ink-2);line-height:1.3;max-width:130px}
.wf-step.cur .wf-lab{color:var(--brand)}
.wf-role{font-size:10px;color:var(--muted)}
.wf-line{flex:1;min-width:18px;height:2px;background:var(--line-2);margin-top:15px}
tr.jr-evt td{background:color-mix(in srgb,var(--brand-2) 6%,var(--surface));font-style:italic}
.wrap input:disabled,.wrap select:disabled,.wrap textarea:disabled{opacity:.55;cursor:not-allowed}
.hash{font-family:var(--mono);font-size:11px;letter-spacing:.5px;background:var(--surface-3);
  padding:2px 7px;border-radius:5px;color:var(--ink-2);white-space:nowrap}
input.cell[type="date"]{font-family:var(--sans);text-align:left}
</style>

  const cbs = s.cbs.map(r=>({compte:r[0],lib:r[1],code:r[2],moyen:r[3],fin:r[4],courus:r[5],cat:MAP[r[2]]||"NON MAPPÉ"}));

  out.cbs={rows:cbs, totMoyen:sum(cbs.map(r=>r.moyen)), totFin:sum(cbs.map(r=>r.fin)), totCourus:sum(cbs.map(r=>r.courus)), nonMapped};

  // --- Pool_Ressources : SUMIFS soldes moyens par catégorie × taux de participation
  const sumBy=(field,cat)=>sum(cbs.filter(r=>r.cat===cat).map(r=>r[field]));
  const pool=RES_CATS.map(cat=>{
    const moyen=sumBy("moyen",cat), tx=P.cat[cat][0], invest=moyen*tx;
    return {cat, moyen, tx, invest};
  });
  const totInvest=sum(pool.map(p=>p.invest)), totRes=sum(pool.map(p=>p.moyen));
  pool.forEach(p=>p.quote = totInvest? p.invest/totInvest : 0);
  out.pool={rows:pool, totRes, totInvest, tauxEmploi: totRes? totInvest/totRes:0};

  // --- Ecoulements : run-off 12 mois + revenus + rapprochement
  const fin=FIN_POSTS.map(post=>{
    const enc0=sumBy("fin",post), courus=sumBy("courus",post);
    const [prod,ecoulTx,marge]=s.ecoul[post];
    const enc=[enc0]; for(let m=1;m<=12;m++) enc.push(enc[m-1]*(1-ecoulTx)+prod);
    const rev=[]; for(let m=0;m<12;m++) rev.push((enc[m]+enc[m+1])/2*marge/12);
    const revAnnuel=sum(rev);
    return {post,enc0,prod,ecoulTx,marge,courus,enc,rev,revAnnuel};
  });
  const totEncByMonth=[]; for(let m=0;m<=12;m++) totEncByMonth.push(sum(fin.map(f=>f.enc[m])));
  const totRevAnnuel=sum(fin.map(f=>f.revAnnuel));
  const encMoyen=sum(totEncByMonth)/totEncByMonth.length;
  out.ecoul={rows:fin, totEncByMonth, totRevAnnuel, encMoyen,
             coussin: totInvest-encMoyen, liqOK:(totInvest-encMoyen)>=0};

  // --- Revenus_Pool
  const rev=out.ecoul.rows;
  const rBy=n=>rev.find(f=>f.post===n).revAnnuel;
  const margeMrb=rBy("Mourabaha immobilière")+rBy("Mourabaha équipement")+rBy("Mourabaha exploitation (stocks)");
  const produits={
    margeMrb, ijara:rBy("Ijara Mountahia Bitamlik"), salam:rBy("Salam"),
    istisna:rBy("Istisna'a"), moucharaka:rBy("Moucharaka de financement"), commissions:s.revenus.commissions
  };
  const totProduits=produits.margeMrb+produits.ijara+produits.salam+produits.istisna+produits.moucharaka+produits.commissions;
  // Une charge n'est déduite de la base que si elle est imputable au pool ET approuvée (CDC §16.2)
  const chargesSup = (s.chargesMatrice||[]).filter(c=>c[2]==="pool" && +c[3]===1)
                       .reduce((a,c)=>a+(+c[1]||0),0);
  const chargesRejetees = (s.chargesMatrice||[]).filter(c=>c[2]==="pool" && +c[3]!==1)
                       .reduce((a,c)=>a+(+c[1]||0),0);
  const chargesBanque = (s.chargesMatrice||[]).filter(c=>c[2]==="banque")
                       .reduce((a,c)=>a+(+c[1]||0),0);
  const totCharges=s.revenus.chargesGestion+s.revenus.pertesDepreciations+chargesSup;
  const ncBrut=Math.max(0,s.revenus.nonConformes||0);
  const produitBrut=totProduits-totCharges-ncBrut;
  const per=produitBrut*P.dotationPER;
  const base=produitBrut-per;
  const rendementBrut= totInvest? base/totInvest:0;
  out.revenus={produits,totProduits,totCharges,produitBrut,per,base,rendementBrut,
               chargesSup,chargesRejetees,chargesBanque};

  // ===================== PURIFICATION DES REVENUS NON CONFORMES (CDC §16.3) =====================
  // Les revenus non conformes sont retirés de la base AVANT tout partage :
  // ils ne peuvent bénéficier ni aux déposants ni aux actionnaires (PUR-002).
  const PU=s.purification;
  const ncPeriode = Math.max(0, s.revenus.nonConformes||0);
  const puCumul   = (PU.cumulOuv||0) + ncPeriode;
  const puVerse   = Math.max(0, PU.verse||0);
  const puSolde   = puCumul - puVerse;
  out.purification={
    ncPeriode, cumulOuv:PU.cumulOuv||0, cumul:puCumul, verse:puVerse, solde:puSolde,
    beneficiaire:PU.beneficiaire||"", decision:PU.decision||"",
    documente: !!(PU.beneficiaire&&PU.decision),
    partDuProduit: totProduits ? ncPeriode/totProduits : 0
  };


  // clés déposant moyennes pondérées DAT / BDC (Parametres B40/B41)
  const mats=Object.keys(P.mat);
  const cleDatMoy=sum(mats.map(m=>P.mat[m][0]*P.mat[m][2]));
  const cleBdcMoy=sum(mats.map(m=>P.mat[m][1]*P.mat[m][2]));

  // clé banque par catégorie de ressource (pour Moudaraba)
  const catCleBanque={
    "Fonds propres":P.keys["Fonds propres"][0],
    "Provisions (Credoc, cautions…)":P.keys["Provisions"][0],
    "Comptes courants (à vue)":P.keys["Comptes courants"][0],
    "Comptes épargne":P.keys["Comptes épargne"][0],
    "DAT islamiques":1-cleDatMoy,
    "BDC islamiques":1-cleBdcMoy
  };

  // --- Moudaraba Méthode 1 (clé fixe)
  const m1=pool.map(p=>{
    const B=p.invest, C=P.cat[p.cat][1], D=base*C, E=catCleBanque[p.cat];
    const F=D*E, G=D-F, H=G*P.dotationIRR, I=G-H, J=B?I/B:0;
    return {cat:p.cat,B,C,D,E,F,G,H,I,J};
  });
  const m1T={D:sum(m1.map(x=>x.D)),F:sum(m1.map(x=>x.F)),G:sum(m1.map(x=>x.G)),H:sum(m1.map(x=>x.H)),I:sum(m1.map(x=>x.I)),B:sum(m1.map(x=>x.B))};
  out.m1={rows:m1,tot:m1T, ok:Math.abs(R6(m1T.D-base))===0};

  // --- Moudaraba Méthode 2 (moyennes pondérées AAOIFI)
  const m2p=pool.map(p=>{const C=P.cat[p.cat][2]; return {cat:p.cat,B:p.invest,C,D:p.invest*C};});
  const totPond=sum(m2p.map(x=>x.D));
  const m2=m2p.map(x=>{
    const E=totPond?x.D/totPond:0, F=base*E, G=catCleBanque[x.cat], H=F*G, I=F-H, J=I*P.dotationIRR, K=I-J, L=x.B?K/x.B:0;
    return {cat:x.cat,B:x.B,C:x.C,D:x.D,E,F,G,H,I,J,K,L};
  });
  const m2T={D:sum(m2.map(x=>x.D)),F:sum(m2.map(x=>x.F)),H:sum(m2.map(x=>x.H)),I:sum(m2.map(x=>x.I)),J:sum(m2.map(x=>x.J)),K:sum(m2.map(x=>x.K))};
  out.m2={rows:m2,tot:m2T,totPond, ok:Math.abs(R6(m2T.F-base))===0};

  // comparaison M1 vs M2 (part nette déposant)
  out.compare=pool.map((p,i)=>({cat:p.cat, m1:m1[i].I, m2:m2[i].K, delta:m2[i].K-m1[i].I, rM1:m1[i].J, rM2:m2[i].L}));

  // --- Simulation déposant Moudaraba
  const sim=s.simMoudaraba;
  const bdcRow=m1.find(x=>x.cat==="BDC islamiques");
  const cleDep=(P.mat[sim.maturite]?P.mat[sim.maturite][2]:0);
  const rendBrutBdc=bdcRow.B?bdcRow.D/bdcRow.B:0;
  const profitAttr=sim.montant*rendBrutBdc;
  const partBanque=profitAttr*(1-cleDep);
  const profitBrutDep=profitAttr*cleDep;
  const irrInd=profitBrutDep*P.dotationIRR;
  const netAvImpot=profitBrutDep-irrInd;
  const irg=sim.pp==="Oui"?netAvImpot*P.tauxIRG:0;
  const netVerse=netAvImpot-irg;
  out.sim={cleDep,rendBrutBdc,profitAttr,partBanque,profitBrutDep,irrInd,netAvImpot,irg,netVerse,
           tauxBrut:sim.montant?profitBrutDep/sim.montant:0, tauxNet:sim.montant?netVerse/sim.montant:0};

  // cas d'école (données figées du support Dr Bennadji)
  const ec={profitPool:650,pondBdc:0.25,cleBanque12:0.45,encoursBdc:950,placement:25};
  ec.partCat=ec.profitPool*ec.pondBdc; ec.partBanque=ec.partCat*ec.cleBanque12; ec.netDistr=ec.partCat-ec.partBanque;
  ec.profitDep=ec.placement*ec.netDistr/ec.encoursBdc; ec.taux=ec.profitDep/ec.placement;
  ec.irg=ec.profitDep*P.tauxIRG; ec.net=ec.profitDep-ec.irg;
  out.ecole=ec;

  // --- Wakala
  const w=s.wakalaOp, wk=P.wakala;
  const rendReal=rendementBrut;
  const wBrut=w.montant*rendReal*w.duree/P.baseJours;
  const wFraisTh=w.montant*wk.frais*w.duree/P.baseJours;
  const wAttendu=w.montant*wk.tauxAttendu*w.duree/P.baseJours;
  const wFrais=(wk.renonciationFrais===1 && (wBrut-wFraisTh)<wAttendu)?0:wFraisTh;
  const wNet=wBrut-wFrais;
  const wClient=Math.min(wNet,wAttendu)+(1-wk.partExcedentBanque)*Math.max(0,wNet-wAttendu);
  const wIncit=wk.partExcedentBanque*Math.max(0,wNet-wAttendu);
  const wBankTot=wFrais+wIncit;
  const wIrg=w.pp==="Oui"?wClient*P.tauxIRG:0;
  const sensRates=[0.02,0.03,0.04,0.045,0.05,0.06,0.08,rendReal];
  const sens=sensRates.map(r=>{
    const b=w.montant*r*w.duree/P.baseJours;
    const c=(wk.renonciationFrais===1 && (b-wFraisTh)<wAttendu)?0:wFraisTh;
    const n=b-c, cl=Math.min(n,wAttendu)+(1-wk.partExcedentBanque)*Math.max(0,n-wAttendu);
    const inc=wk.partExcedentBanque*Math.max(0,n-wAttendu);
    return {r,b,c,n,cl,inc,tot:c+inc,taux:w.montant?cl/w.montant*P.baseJours/w.duree:0, isReal:Math.abs(r-rendReal)<1e-12};
  });
  out.wakala={rendReal,wBrut,wFraisTh,wAttendu,wFrais,wNet,wClient,wIncit,wBankTot,wIrg,
              wNetVerse:wClient-wIrg, tauxClient:w.montant?wClient/w.montant*P.baseJours/w.duree:0,
              alerte:wNet<wAttendu, sens};

  // --- Musharaka
  const mu=s.musharakaOp, mp=P.musharaka;
  const capTot=mu.capBanque+mu.capClient, qBanque=capTot?mu.capBanque/capTot:0, qClient=capTot?mu.capClient/capTot:0;
  const scen=r=>({r, banque:r>=0?r*mp.ratioBanque:r*qBanque, client:r>=0?r*mp.ratioClient:r*qClient});
  const A=scen(mu.resultatA), B=scen(mu.resultatB);
  const partInit=mu.coutActif*(1-mu.apportClient), rachat=mu.periodes?partInit/mu.periodes:0;
  const mout=[]; let deb=partInit;
  for(let i=1;i<=mu.periodes;i++){const loyer=deb*mu.tauxLoyer/12, fin=deb-rachat; mout.push({p:i,deb,loyer,rachat,fin,ech:loyer+rachat}); deb=fin;}
  out.musharaka={capTot,qBanque,qClient,A,B, partInit,rachat,mout,
    totLoyer:sum(mout.map(x=>x.loyer)), totRachat:sum(mout.map(x=>x.rachat)), totEch:sum(mout.map(x=>x.ech)),
    finalNul:Math.abs(R6(mout[mout.length-1].fin))===0,
    okA:Math.abs(R6(A.banque+A.client-mu.resultatA))===0, okB:Math.abs(R6(B.banque+B.client-mu.resultatB))===0};

  // --- Contrôles de cohérence (Synthese : 11 contrôles)
  const K=P.keys;
  const keyOK = ["Fonds propres","Provisions","Comptes courants","Comptes épargne","DAT & BDC — 6 mois","DAT & BDC — 12 mois","DAT & BDC — 24 mois","DAT & BDC — 60 mois"]
      .every(k=>Math.abs(R6(K[k][0]+K[k][1]-1))===0);
  const pondM1OK=Math.abs(R6(RES_CATS.reduce((a,c)=>a+P.cat[c][1],0)-1))===0;
  const mixDatOK=Math.abs(R6(sum(mats.map(m=>P.mat[m][0]))-1))===0 && Math.abs(R6(sum(mats.map(m=>P.mat[m][1]))-1))===0;
  const musRatioOK=Math.abs(R6(mp.ratioBanque+mp.ratioClient-1))===0;
  out.controls=[
    {n:"Somme des pondérations (Méthode 1) = 100 %", ok:pondM1OK, loc:"Paramètres"},
    {n:"Clés Banque + Déposant = 100 % (toutes catégories)", ok:keyOK, loc:"Paramètres"},
    {n:"Mix des maturités DAT & BDC = 100 %", ok:mixDatOK, loc:"Paramètres"},
    {n:"Σ allocations Méthode 1 = base de distribution", ok:out.m1.ok, loc:"Moudaraba"},
    {n:"Σ allocations Méthode 2 = base de distribution", ok:out.m2.ok, loc:"Moudaraba"},
    {n:"Wakala : client + banque = profit brut", ok:Math.abs(R6(wClient+wBankTot-wBrut))===0, loc:"Wakala"},
    {n:"Musharaka : partage exhaustif (2 scénarios)", ok:out.musharaka.okA&&out.musharaka.okB, loc:"Musharaka"},
    {n:"Moutanaqissa : part banque finale nulle", ok:out.musharaka.finalNul, loc:"Musharaka"},
    {n:"Somme des ratios Musharaka = 100 %", ok:musRatioOK, loc:"Paramètres"},
    {n:"Import CBS : toutes les lignes sont mappées", ok:nonMapped===0, loc:"Import CBS"},
    {n:"Liquidité : financements ≤ ressources investies", ok:out.ecoul.liqOK, loc:"Écoulements"},
    {n:"Aucun actif suralloué entre les pools",
     ok:(function(){const a={};(s.pools||[]).forEach(p=>(p.actifs||[]).forEach(x=>{a[x[0]]=(a[x[0]]||0)+(+x[1]);}));
        return Object.keys(a).every(k=>R6(a[k])<=1);})(), loc:"Référentiels"},
    {n:"Produits publiés complets (nisba et référence charia)",
     ok:(s.produits||[]).every(p=>p.statut!=="Publié" ||
        (Math.abs(R6((+p.nisbaDep)+(+p.nisbaBanque)-1))===0 && !!p.reference)), loc:"Référentiels"},
    {n:"Charges déduites toutes approuvées par le Comité Charia",
     ok: out.revenus.chargesRejetees===0, loc:"Risques & DCR"},
    {n:"Purification documentée si revenus non conformes",
     ok: out.purification.ncPeriode===0 || out.purification.documente, loc:"Résultat du pool"},
    {n:"Clés publiées avant leur date d'effet",
     ok: !s.gouvernance.publieLe || (s.gouvernance.publieLe.slice(0,10) <= P.dateEffet), loc:"Gouvernance"},
    {n:"Clés par source : Banque + Déposant = 100 %",
     ok:FIN_POSTS.every(p2=>{const k=P.keysSource[p2]||[0,0];return Math.abs(R6(k[0]+k[1]-1))===0;}),
     loc:"Paramètres"}
  ];
  out.controlsOK=out.controls.filter(c=>c.ok).length;

  // ===================== MOTEUR DE SIMULATION =====================
  // Taux de profit effectif de chaque poste de financement (projet) + trajectoire mensuelle
  out.ecoul.rows.forEach(r=>{
    r.encMoyen   = sum(r.enc)/r.enc.length;
    r.tauxEffectif = r.encMoyen ? r.revAnnuel/r.encMoyen : 0;
    r.partRevenu = out.ecoul.totRevAnnuel ? r.revAnnuel/out.ecoul.totRevAnnuel : 0;
    r.tauxMensuel = r.rev.map((v,i)=>{ const em=(r.enc[i]+r.enc[i+1])/2; return em ? v*12/em : 0; });
  });

  const MO = s.moteur;
  // Panier adossé au dépôt : global (Moudaraba Motlaqa) ou dédié (Moudaraba Mouqayyada / compte restreint)
  const selPosts = out.ecoul.rows.filter(r => MO.mode==="global" ? true : !!MO.posts[r.post]);
  const bEnc = sum(selPosts.map(r=>r.encMoyen));
  const bRev = sum(selPosts.map(r=>r.revAnnuel));
  const bCharges = out.ecoul.totRevAnnuel ? totCharges * (bRev/out.ecoul.totRevAnnuel) : 0;  // charges au prorata des revenus
  const bNet = bRev - bCharges;
  const bPer = bNet * P.dotationPER;                 // PER : sur le produit brut, AVANT part du Moudarib
  const bBase = bNet - bPer;
  const bRendement = bEnc ? bBase/bEnc : 0;
  out.basket = {rows:selPosts, count:selPosts.length, enc:bEnc, rev:bRev, charges:bCharges,
                net:bNet, per:bPer, base:bBase, rendement:bRendement,
                margeBrute: bEnc ? bRev/bEnc : 0,
                dedie: MO.mode!=="global" && selPosts.length<out.ecoul.rows.length};

  const cleContrat = P.mat[MO.maturite] ? P.mat[MO.maturite][2] : 0;
  const cleApp = (MO.cleMode==="contrat") ? cleContrat : MO.cleManuelle;
  const baseOpts = {montant:MO.montant, cleDep:cleApp, tanazul:MO.tanazul, rendementBase:bRendement,
                    irrRate:P.dotationIRR, irgRate:P.tauxIRG, pp:(MO.pp==="Oui")};
  const casc = depositCascade(baseOpts);
  out.moteur = {cleContrat, cleApp, casc, rendementRetenu:bRendement, mode:MO.mode};

  // Courbe des taux servis par maturité (structure par terme)
  out.moteur.courbeMaturite = Object.keys(P.mat).map(mt=>{
    const c = depositCascade(Object.assign({},baseOpts,{cleDep:P.mat[mt][2]}));
    return {mat:mt, cle:P.mat[mt][2], tauxBrut:c.tauxBrut, tauxNet:c.tauxNet};
  });

  // Courbe de sensibilité : taux net servi = f(clé déposant)
  out.moteur.sensibilite = [];
  for(let i=0;i<=20;i++){
    const k=i/20;
    out.moteur.sensibilite.push({cle:k, tauxNet:depositCascade(Object.assign({},baseOpts,{cleDep:k})).tauxNet});
  }

  // Objectif de rendement — résolution inverse sur le levier choisi
  const levierFn = (lev)=>(x)=>{
    const o = Object.assign({},baseOpts);
    if(lev==="cle") o.cleDep=x;
    else if(lev==="tanazul") o.tanazul=x;
    else if(lev==="irr") o.irrRate=x;
    else if(lev==="per") o.rendementBase = bEnc ? (bNet - bNet*x)/bEnc : 0;
    return depositCascade(o).tauxNet;
  };
  const lv = MO.levier;
  const borneHaute = (lv==="per"||lv==="irr") ? 0.60 : 1;
  const gs = goalSeek(levierFn(lv), 0, borneHaute, MO.cible);
  out.moteur.goal = {ok:gs.ok, x:gs.x, raison:gs.raison, min:gs.min, max:gs.max,
                     levier:lv, cible:MO.cible, actuel:casc.tauxNet, cleContrat:cleContrat,
                     borneHaute:borneHaute};
  // ===================== ALLOCATION PAR DÉPOSANT =====================
  const AL = s.allocation;
  const ctxB = {totRev: out.ecoul.totRevAnnuel, totCharges: totCharges, per: P.dotationPER};
  const alTous = out.ecoul.rows.slice().sort((a,b)=>b.tauxEffectif-a.tauxEffectif);

  // Assiette d'attribution de la rémunération liée aux financements
  let alSel;
  if(AL.assiette==="pool")      alSel = alTous.slice();                                   // mutualisation intégrale
  else if(AL.assiette==="type") alSel = alTous.filter(r=>(FAMILLES[AL.famille]||[]).indexOf(r.post)>=0); // par nature de contrat
  else                          alSel = alTous.filter(r=>!!AL.posts[r.post]);             // par client (contrats désignés)

  const alB    = computeBasket(alSel, ctxB.totRev, ctxB.totCharges, ctxB.per);
  const alCleContrat = P.mat[AL.maturite] ? P.mat[AL.maturite][2] : 0;
  // Clé issue des sources retenues (si le paramétrage par source est actif)
  const alCleSource = P.useKeysSource ? cleMoyenneSource(alSel, P.keysSource) : null;
  const alCleRef = (alCleSource!==null && alSel.length) ? alCleSource : alCleContrat;
  const alCle = (AL.cleMode==="contrat") ? alCleRef : AL.cleManuelle;
  const alOpts = {montant:AL.montant, cleDep:alCle, tanazul:AL.tanazul, rendementBase:alB.rendement,
                  irrRate:P.dotationIRR, irgRate:P.tauxIRG, pp:(AL.pp==="Oui")};
  const alCasc = depositCascade(alOpts);

  // Référence : le même dépôt adossé au pool global (mutualisation intégrale)
  const refB = computeBasket(alTous, ctxB.totRev, ctxB.totCharges, ctxB.per);
  const refCasc = depositCascade(Object.assign({},alOpts,{rendementBase:refB.rendement,
                    cleDep:alCleRef, tanazul:0}));

  // Adossement : le dépôt doit être couvert par les encours des financements retenus
  const capacite = alB.enc;
  const couvert  = capacite >= AL.montant;

  // Proposition d'optimisation vers la cible
  const opt = optimiserPanier(alTous, AL.cible, ctxB, alOpts);

  out.allocation = {
    tous:alTous, sel:alSel, basket:alB, cle:alCle, cleContrat:alCleRef, cleMaturite:alCleContrat,
    cleSource:alCleSource, parSource:!!P.useKeysSource, assiette:AL.assiette, casc:alCasc,
    ref:{basket:refB, casc:refCasc},
    gain: alCasc.tauxNet - refCasc.tauxNet,
    capacite, couvert, opt,
    nbSel: alSel.length, nbTotal: alTous.length
  };
  // ===================== DIMENSION CLIENT =====================
  const rendPool = computeBasket(out.ecoul.rows, out.ecoul.totRevAnnuel, totCharges, P.dotationPER).rendement;
  const tauxPoste = {}; out.ecoul.rows.forEach(r=>tauxPoste[r.post]=r.tauxEffectif);

  const tiersById={}; (s.tiers||[]).forEach(t=>tiersById[t[0]]={id:t[0],nom:t[1],segment:t[2],agence:t[3],
    compte:t[4],email:t[5],adresse:t[6],secteur:t[7],gerant:t[8],forme:t[9]});
  const cl = (s.positions||[]).map(r=>{
    const t=tiersById[r[0]]||{id:r[0],nom:r[0],segment:"Entreprise",secteur:"",agence:""};
    return {id:r[0], nom:t.nom, segment:t.segment, secteur:t.secteur||"", agence:t.agence||"",
            compte:t.compte||"", tiers:t, sens:r[1], produit:r[2], montant:r[3], maturite:r[4]};
  });
  cl.forEach(p=>{
    p.principal = p.montant;                 // ségrégation : le principal (encours ou capital)
    if(p.sens==="Financement"){
      p.taux = tauxPoste[p.produit]||0;
      p.marge = p.montant*p.taux;              // ségrégation : la marge (revenu généré)
      p.revenu = p.marge;
      p.remuneration = 0;
    }else{
      p.cle = clePlacement(P,p.produit,p.maturite);
      const c = depositCascade({montant:p.montant, cleDep:p.cle, tanazul:0, rendementBase:rendPool,
                                irrRate:P.dotationIRR, irgRate:P.tauxIRG, pp:(p.segment==="Particulier")});
      p.taux=c.tauxNet; p.tauxBrut=c.tauxBrut;
      p.margeBrute=c.depBrut;                  // rémunération brute (avant IRR/IRG)
      p.irr=c.irr; p.irg=c.irg;
      p.remuneration=c.net;                    // rémunération nette servie
      p.partBanque=c.partBanque; p.revenu=0;
    }
  });

  // Agrégat par client (rentabilité de la relation)
  const mapCl={};
  cl.forEach(p=>{
    if(!mapCl[p.id]) mapCl[p.id]={id:p.id,nom:p.nom,segment:p.segment,secteur:p.secteur,agence:p.agence,
      compte:p.compte,fin:0,revenu:0,plc:0,remu:0,margeBrutePlc:0,lignes:[]};
    if(p.sens==="Placement") mapCl[p.id].margeBrutePlc+=(p.margeBrute||0);
    const o=mapCl[p.id]; o.lignes.push(p);
    if(p.sens==="Financement"){o.fin+=p.montant;o.revenu+=p.revenu;}
    else{o.plc+=p.montant;o.remu+=p.remuneration;}
  });
  const parClient=Object.keys(mapCl).map(k=>{const o=mapCl[k];
    return Object.assign({},o,{net:o.revenu-o.remu, tauxFin:o.fin?o.revenu/o.fin:0, tauxPlc:o.plc?o.remu/o.plc:0});
  }).sort((a,b)=>b.net-a.net);

  // Rendement par type de financement, avec le détail des clients
  const parFin = out.ecoul.rows.map(r=>{
    const lg=cl.filter(p=>p.sens==="Financement"&&p.produit===r.post);
    return {poste:r.post, taux:r.tauxEffectif, encoursCBS:r.encMoyen, revenuCBS:r.revAnnuel,
            encoursClients:sum(lg.map(x=>x.montant)), revenuClients:sum(lg.map(x=>x.revenu)),
            nbClients:Object.keys(lg.reduce((a,x)=>{a[x.id]=1;return a;},{})).length, lignes:lg};
  });

  // Rémunération par type de placement, avec le détail des clients
  const parPlc = CATS_PLACEMENT.map(cat=>{
    const lg=cl.filter(p=>p.sens==="Placement"&&p.produit===cat);
    const mt=sum(lg.map(x=>x.montant)), rm=sum(lg.map(x=>x.remuneration));
    return {cat, montant:mt, remuneration:rm, taux: mt?rm/mt:0,
            nbClients:Object.keys(lg.reduce((a,x)=>{a[x.id]=1;return a;},{})).length, lignes:lg};
  });

  // ===================== GAP DE TAUX (marge d'intermédiation) =====================
  const encFin = sum(out.ecoul.rows.map(r=>r.encMoyen));
  const tauxFinMoyen = encFin ? sum(out.ecoul.rows.map(r=>r.revAnnuel))/encFin : 0;
  const mtPlc  = sum(cl.filter(p=>p.sens==="Placement").map(p=>p.montant));
  const remuPlc= sum(cl.filter(p=>p.sens==="Placement").map(p=>p.remuneration));
  const tauxPlcMoyen = mtPlc ? remuPlc/mtPlc : 0;
  const gapCourbe = Object.keys(P.mat).map(mt2=>{
    const c=depositCascade({montant:100, cleDep:P.mat[mt2][2], tanazul:0, rendementBase:rendPool,
                            irrRate:P.dotationIRR, irgRate:P.tauxIRG, pp:true});
    return {mat:mt2, placementBrut:c.tauxBrut, placementNet:c.tauxNet,
            financement:tauxFinMoyen, gap:tauxFinMoyen-c.tauxBrut};
  });

  out.secteurs=[...new Set((s.tiers||[]).map(t=>t[7]).filter(x=>x&&x!=="—"))];
  out.tiers=(s.tiers||[]).map(t=>({id:t[0],nom:t[1],segment:t[2],agence:t[3],compte:t[4],email:t[5],
    adresse:t[6],secteur:t[7],gerant:t[8],forme:t[9]}));
  out.clients={lignes:cl, parClient, parFin, parPlc, rendPool,
    totFin:sum(parClient.map(c2=>c2.fin)), totPlc:sum(parClient.map(c2=>c2.plc)),
    totRevenu:sum(parClient.map(c2=>c2.revenu)), totRemu:sum(parClient.map(c2=>c2.remu)),
    tauxFinMoyen, tauxPlcMoyen, gap:tauxFinMoyen-tauxPlcMoyen, gapCourbe,
    nbClients:parClient.length};

  // ===================== RÉSERVES PER / IRR : MOUVEMENTS DE LA PÉRIODE =====================
  const R=s.reserves;
  const perDot = per;                                   // dotation de la période (Revenus_Pool)
  const irrDot = out.m1.tot.H;                          // dotation IRR (part des déposants)
  const perClot = R.perOuv + perDot - R.perReprise;
  const irrClot = R.irrOuv + irrDot - R.irrReprise;
  const plafondPER = P.plafondPER * totInvest;          // plafonds exprimés en % des encours investis
  const plafondIRR = P.plafondIRR * totInvest;
  out.reserves={
    perOuv:R.perOuv, perDot, perReprise:R.perReprise, perClot, plafondPER, perDepasse:perClot>plafondPER,
    irrOuv:R.irrOuv, irrDot, irrReprise:R.irrReprise, irrClot, plafondIRR, irrDepasse:irrClot>plafondIRR,
    total:perClot+irrClot
  };

  // ===================== SCÉNARIO DE PERTE DU POOL =====================
  // Cascade d'absorption : IRR (déposants) → PER (partagée) → capital des déposants.
  // Le Moudarib ne perd jamais de capital : il perd son effort et sa part de profit.
  const enPerte = base < 0;
  const abs = enPerte ? absorberPerte(-base, irrClot, perClot) : null;
  out.perte={
    actif:enPerte, base,
    absorption:abs,
    capitalEntame: enPerte ? abs.parCapital>0 : false,
    tauxPerteCapital: (enPerte && totInvest) ? abs.parCapital/totInvest : 0,
    // simulation dirigée : quelle perte le dispositif absorbe-t-il sans entamer le capital ?
    capaciteAbsorption: irrClot+perClot,
    capaciteEnPct: totInvest ? (irrClot+perClot)/totInvest : 0
  };

  // ===================== IMPORT : ANALYSE DU COLLAGE =====================
  out.importPreview = analyserImport(s.importTxt, s.importCible, P);

  // ===================== FILTRE CLIENTS =====================
  const f=(s.filtreClient||"").trim().toLowerCase();
  out.clients.filtres = f
    ? out.clients.parClient.filter(c=>(c.nom+" "+c.id+" "+c.segment).toLowerCase().indexOf(f)>=0)
    : out.clients.parClient;
  // ===================== FICHE D'EXPLICATION DU PROFIT PAR COMPTE (CDC §33) =====================
  // Chaque position de placement reçoit le détail complet de sa cascade, du revenu
  // du pool jusqu'au montant net crédité, de façon à être explicable et reproductible.
  const placements = cl.filter(p=>p.sens==="Placement");
  out.explication = {
    positions: placements.map((p,i)=>{
      const c=depositCascade({montant:p.montant, cleDep:p.cle, tanazul:0, rendementBase:rendPool,
                              irrRate:P.dotationIRR, irgRate:P.tauxIRG, pp:(p.segment==="Particulier")});
      return {
        idx:i, id:p.id, nom:p.nom, segment:p.segment, produit:p.produit,
        maturite:p.maturite||"à vue", montant:p.montant,
        poidsCategorie: (P.cat[p.produit]?P.cat[p.produit][2]:1),
        baseParticipation: p.montant*(P.cat[p.produit]?P.cat[p.produit][2]:1),
        nisbaDeposant:p.cle, nisbaBanque:1-p.cle,
        rendementPool:rendPool, casc:c,
        tauxRealise:rendPool, tauxDistribue:c.tauxNet,
        ecartRealiseDistribue: rendPool - c.tauxNet
      };
    })
  };
  const totBases = sum(out.explication.positions.map(x=>x.baseParticipation));
  out.explication.totBases = totBases;
  out.explication.positions.forEach(x=>{ x.quotePart = totBases ? x.baseParticipation/totBases : 0; });

  // ===================== EMPREINTE DE L'ARRÊTÉ =====================
  out.empreinte = empreinteRun(s);
  // ===================== COTATION D'UN PLACEMENT =====================
  const CO=s.cotation;
  // Assiette d'adossement : pool global, famille de contrats, financements sélectionnés (projet),
  // portefeuille d'un client, ou financements d'un secteur d'activité.
  const ctxCot={totRev: out.ecoul.totRevAnnuel, totCharges: totCharges, per: P.dotationPER};
  const postesFinClient = cid => [...new Set(cl.filter(p=>p.sens==="Financement"&&p.id===cid).map(p=>p.produit))];
  const postesFinSecteur = sec => { const ids=(s.tiers||[]).filter(t=>t[7]===sec).map(t=>t[0]);
    return [...new Set(cl.filter(p=>p.sens==="Financement"&&ids.indexOf(p.id)>=0).map(p=>p.produit))]; };
  let coPostes=null, coLibAssiette="Pool global (mutualisé)";
  if(CO.assiette==="type"){ coPostes=(FAMILLES[CO.famille]||[]); coLibAssiette="Famille : "+CO.famille; }
  else if(CO.assiette==="projet"){ coPostes=out.ecoul.rows.filter(r=>!!(CO.postes||{})[r.post]).map(r=>r.post); coLibAssiette="Financements sélectionnés (projet)"; }
  else if(CO.assiette==="client"){ coPostes=postesFinClient(CO.assietteClient); coLibAssiette="Portefeuille de financement : "+CO.assietteClient; }
  else if(CO.assiette==="secteur"){ coPostes=postesFinSecteur(CO.secteur); coLibAssiette="Secteur : "+(CO.secteur||"—"); }
  const coSel = (coPostes&&coPostes.length) ? out.ecoul.rows.filter(r=>coPostes.indexOf(r.post)>=0) : out.ecoul.rows;
  const coBasket = computeBasket(coSel, ctxCot.totRev, ctxCot.totCharges, ctxCot.per);
  const coAssietteValide = !(coPostes && coPostes.length===0);   // sélection vide = assiette non adossée
  const coRendement = (coPostes&&coPostes.length) ? coBasket.rendement : rendPool;
  const coTauxFin   = (coPostes&&coPostes.length) ? coBasket.margeBrute : tauxFinMoyen;

  const coCleGrille = clePlacement(P,CO.produit,CO.maturite);
  const coCle = (CO.cleMode==="grille") ? coCleGrille : CO.cleManuelle;
  const coC = depositCascade({montant:CO.montant, cleDep:coCle, tanazul:CO.tanazul,
                rendementBase:coRendement, irrRate:P.dotationIRR, irgRate:P.tauxIRG, pp:(CO.pp==="Oui")});
  const coMarge = coTauxFin - coC.tauxBrut;                 // marge d'intermédiation de la banque
  const coEcartMarche = coC.tauxNet - P.tauxMarche;         // vs référence de marché (risque commercial translaté)
  let coCode, coCls;
  if(!coAssietteValide){ coCls="ko"; coCode="assiette"; }
  else if(coMarge < P.margeMin){ coCls="ko"; coCode="marge"; }
  else if(coEcartMarche < -0.005){ coCls="warn"; coCode="marche"; }
  else { coCls="ok"; coCode="ok"; }
  const coClient = parClient.filter(x=>x.id===CO.clientId)[0]||null;
  out.cotation={cleGrille:coCleGrille, cle:coCle, casc:coC, marge:coMarge, ecartMarche:coEcartMarche,
                code:coCode, cls:coCls, client:coClient, tauxFinMoyen:coTauxFin, margeMin:P.margeMin,
                assiette:CO.assiette, libAssiette:coLibAssiette, rendementAssiette:coRendement,
                basket:coBasket, postes:coPostes, assietteValide:coAssietteValide};
  // KPIs synthèse
  const remun=[m1.find(x=>x.cat==="Comptes épargne"),m1.find(x=>x.cat==="DAT islamiques"),m1.find(x=>x.cat==="BDC islamiques")];
  out.kpi={
    tauxMoyM1: sum(remun.map(x=>x.I))/sum(remun.map(x=>x.B)),
    tauxMoyM2: (m2.find(x=>x.cat==="Comptes épargne").K+m2.find(x=>x.cat==="DAT islamiques").K+m2.find(x=>x.cat==="BDC islamiques").K)/(m2.find(x=>x.cat==="Comptes épargne").B+m2.find(x=>x.cat==="DAT islamiques").B+m2.find(x=>x.cat==="BDC islamiques").B),
    ecartEpBdcM1: m1.find(x=>x.cat==="Comptes épargne").J - m1.find(x=>x.cat==="BDC islamiques").J,
    ecartEpBdcM2: m2.find(x=>x.cat==="Comptes épargne").L - m2.find(x=>x.cat==="BDC islamiques").L
  };
  // ===================== DCR — RISQUE COMMERCIAL DÉPLACÉ (CDC §21.3) =====================
  // Mesure ce que la banque abandonne (ou puise dans les réserves) pour soutenir un taux
  // servi compétitif, et l'impact de ce soutien sur sa propre marge.
  const encRemuneres = sum(out.m2.rows.filter(r=>r.K>0).map(r=>r.B));
  const tauxServi    = out.kpi.tauxMoyM2;
  const besoinSoutien = Math.max(0, P.tauxMarche - tauxServi) * encRemuneres;   // pour atteindre le marché
  const repriseReserves = (R.perReprise||0) + (R.irrReprise||0);               // soutien via réserves
  const profitTheoriqueActionnaires = out.m1.tot.F;                            // part Moudarib avant renonciation
  const dcrMontant = repriseReserves;                                          // soutien effectivement consenti
  out.dcr = {
    tauxServi, tauxMarche:P.tauxMarche, ecart: tauxServi - P.tauxMarche,
    encRemuneres, besoinSoutien, repriseReserves, dcrMontant,
    dcrResiduel: Math.max(0, besoinSoutien - repriseReserves),
    profitTheoriqueActionnaires,
    impactMarge: profitTheoriqueActionnaires ? dcrMontant/profitTheoriqueActionnaires : 0,
    couvertureReserves: besoinSoutien ? Math.min(1,(out.reserves.perClot+out.reserves.irrClot)/besoinSoutien) : 1,
    sousMarche: tauxServi < P.tauxMarche
  };

  // ===================== STRESS TESTS (CDC §21.2) =====================
  if(!opts.sansStress){
    const scenario = (lib, id, mut) => {
      const c = JSON.parse(JSON.stringify(s));
      mut(c);
      const r = computeModel(c, {sansStress:true});
      return {id, lib,
        base:r.revenus.base, rendement:r.revenus.rendementBrut, tauxServi:r.kpi.tauxMoyM2,
        perte:r.perte.actif, capitalEntame:r.perte.capitalEntame,
        perClot:r.reserves.perClot, irrClot:r.reserves.irrClot,
        deltaTaux: r.kpi.tauxMoyM2 - out.kpi.tauxMoyM2};
    };
    const facteurRevenus = (c,f) => { FIN_POSTS.forEach(p=>{ if(c.ecoul[p]) c.ecoul[p][2]*=f; }); };
    out.stress = [
      scenario("Revenus −10 %","ST-001a", c=>facteurRevenus(c,0.90)),
      scenario("Revenus −25 %","ST-001b", c=>facteurRevenus(c,0.75)),
      scenario("Revenus −50 %","ST-001c", c=>facteurRevenus(c,0.50)),
      scenario("Dépréciations ×2","ST-002a", c=>{ c.revenus.pertesDepreciations*=2; }),
      scenario("Dépréciations ×12 — défauts massifs","ST-002b", c=>{ c.revenus.pertesDepreciations*=12; }),
      scenario("PER épuisée","ST-006", c=>{ c.reserves.perOuv=0; c.reserves.perReprise=0; }),
      scenario("IRR consommée","ST-007", c=>{ c.reserves.irrOuv=0; c.reserves.irrReprise=0; }),
      scenario("Rendement concurrentiel −2 pts","ST-005", c=>{ c.params.tauxMarche+=0.02; })
    ];
    out.stressPire = out.stress.slice().sort((a,b)=>a.tauxServi-b.tauxServi)[0];

    // ===================== SCÉNARIOS & BUDGET (CDC §22) =====================
    const SC=s.scenarios;
    const projeter = (lib,id,f) => {
      const c = JSON.parse(JSON.stringify(s));
      FIN_POSTS.forEach(p=>{ if(c.ecoul[p]){ c.ecoul[p][2]*=f.rev; c.ecoul[p][0]*=f.enc; } });
      c.cbs.forEach(l=>{ if(FIN_POSTS.indexOf(MAP[l[2]])>=0) l[4]*=f.enc; });
      const r=computeModel(c,{sansStress:true});
      return {id, lib, rev:f.rev, enc:f.enc, base:r.revenus.base, rendement:r.revenus.rendementBrut,
              tauxServi:r.kpi.tauxMoyM2, partBanque:r.m1.tot.F, partDeposants:r.m2.tot.K};
    };
    out.scenarios = [
      projeter("Optimiste","OPT",SC.optimiste),
      projeter("Central","CEN",{rev:1,enc:1}),
      projeter("Stressé","STR",SC.stresse)
    ];
    const B=s.budget, reel=out.scenarios[1];
    out.budget = {
      baseBudget:B.base, baseReel:reel.base, ecartBase:reel.base-B.base,
      ecartBasePct: B.base ? (reel.base-B.base)/B.base : 0,
      tauxBudget:B.tauxServi, tauxReel:reel.tauxServi, ecartTaux:reel.tauxServi-B.tauxServi,
      atteint: reel.base>=B.base && reel.tauxServi>=B.tauxServi
    };
  }
  // ===================== CLASSIFICATION CAUSALE DES PERTES (CDC §19.1) =====================
  // La partie qui supporte la perte dépend de sa CAUSE : une perte née d'une faute,
  // d'une négligence ou d'une violation du mandat par le Moudarib lui incombe (LOS-005),
  // et ne peut être imputée aux déposants.
  const CAUSES_BANQUE = ["Faute ou négligence du gestionnaire","Violation du mandat","Non-conformité Charia"];
  const causePerte = s.perteCause||"Perte commerciale normale";
  const perteBanque = CAUSES_BANQUE.indexOf(causePerte)>=0;
  if(out.perte.actif){
    out.perte.cause = causePerte;
    out.perte.supporteePar = perteBanque ? "Banque (Moudarib)" : "Déposants (Rab al-Mal)";
    out.perte.imputableBanque = perteBanque;
    if(perteBanque){
      // Les réserves des déposants ne sont pas mobilisées : la banque absorbe intégralement.
      out.perte.absorption = {deficit:out.perte.absorption.deficit, parIRR:0, parPER:0, parCapital:0,
                              parBanque:out.perte.absorption.deficit};
      out.perte.capitalEntame = false;
      out.perte.tauxPerteCapital = 0;
    } else {
      out.perte.absorption.parBanque = 0;
    }
  } else {
    out.perte.cause = causePerte; out.perte.supporteePar = "—"; out.perte.imputableBanque = false;
  }

  // ===================== SOUS-LEDGER : ÉCRITURES COMPTABLES (CDC §24) =====================
  const ecrLignes=[]; let ne=0;
  const ecriture=(lib,debit,credit,montant,evt)=>{
    if(Math.abs(montant)<1e-9) return;
    ecrLignes.push({n:++ne, lib, debit, credit, montant, evt});
  };
  ecriture("Constatation des produits du pool","20x/42x Actifs et créances","70x Produits d'exploitation bancaire",
           out.revenus.totProduits,"constatation-revenus");
  ecriture("Charges directes imputées au pool","6xx Charges d'exploitation","20x/38 Comptes de régularisation",
           out.revenus.totCharges,"charges");
  ecriture("Dotation à la réserve de péréquation (PER)","Résultat du pool","Réserve PER",
           out.revenus.per,"dotation-per");
  ecriture("Part de la banque — commission de Moudarib","Résultat du pool","70x Commission de Moudaraba",
           out.m1.tot.F,"part-moudarib");
  ecriture("Part des déposants — profits à distribuer","Résultat du pool","Charges à payer — profits déposants",
           out.m1.tot.G,"part-deposants");
  ecriture("Dotation à la réserve pour risques d'investissement (IRR)","Charges à payer — profits déposants","Réserve IRR",
           out.m1.tot.H,"dotation-irr");
  ecriture("Retenue IRG à la source","Charges à payer — profits déposants","IRG à reverser au Trésor",
           sum(out.clients.lignes.filter(p=>p.sens==="Placement").map(p=>p.irg||0)),"irg");
  ecriture("Revenus non conformes affectés à la purification","Résultat du pool","Compte de purification",
           out.purification.ncPeriode,"purification");
  ecriture("Versement aux œuvres caritatives","Compte de purification","Trésorerie",
           out.purification.verse,"purification-versement");
  if(out.perte.actif && out.perte.imputableBanque)
    ecriture("Perte imputable au Moudarib (faute ou violation du mandat)","Résultat de la banque","Résultat du pool",
             out.perte.absorption.deficit,"perte-banque");
  const totDebit=sum(ecrLignes.map(e=>e.montant)), totCredit=totDebit; // écritures en partie double, une ligne = un couple
  out.ecritures={lignes:ecrLignes, totDebit, totCredit, equilibre:Math.abs(totDebit-totCredit)<1e-9, nb:ecrLignes.length};

  // ===================== RAPPROCHEMENTS (CDC §25) =====================
  const rap=(lib,a,b,seuil,freq)=>{
    const ecart=a-b, pct=b?Math.abs(ecart/b):(a?1:0);
    return {lib, a, b, ecart, pct, freq,
            criticite: Math.abs(ecart)<1e-6 ? "—" : (pct>seuil ? "Élevée" : "Faible"),
            ok: Math.abs(ecart)<1e-6 || pct<=seuil};
  };
  const encoursClientsFin = sum(out.clients.lignes.filter(p=>p.sens==="Financement").map(p=>p.montant));
  const encoursCBSFin     = sum(out.ecoul.rows.map(r=>r.encMoyen));
  const depotsClients     = sum(out.clients.lignes.filter(p=>p.sens==="Placement").map(p=>p.montant));
  const depotsCBS         = sum(out.pool.rows.filter(r=>["Comptes épargne","DAT islamiques","BDC islamiques"].indexOf(r.cat)>=0).map(r=>r.moyen));
  out.rapprochements=[
    rap("Revenus du modèle / produits courus CBS", out.ecoul.totRevAnnuel, sum(out.ecoul.rows.map(r=>r.courus)),0.05,"Quotidienne et à l'arrêté"),
    rap("Ressources investies / encours des financements", out.pool.totInvest, encoursCBSFin,0.20,"Quotidienne"),
    rap("Σ des parts allouées / base de distribution (M1)", out.m1.tot.D, out.revenus.base,0,"À chaque run"),
    rap("Σ des parts allouées / base de distribution (M2)", out.m2.tot.F, out.revenus.base,0,"À chaque run"),

    rap("Réserve PER — mouvement / solde comptable", out.reserves.perClot, out.reserves.perOuv+out.reserves.perDot-out.reserves.perReprise,0,"À chaque arrêté"),
    rap("Réserve IRR — mouvement / solde comptable", out.reserves.irrClot, out.reserves.irrOuv+out.reserves.irrDot-out.reserves.irrReprise,0,"À chaque arrêté"),
    rap("Purification — cumul / décaissement caritatif", out.purification.cumul, out.purification.verse,1,"Mensuelle")
  ];
  out.rapprochementsKO = out.rapprochements.filter(r=>!r.ok).length;

  // ===================== CENTRE D'EXCEPTIONS (CDC §28) =====================
  const meta=s.exceptionsMeta||{};
  const exc=[];
  const typeCtrl = n => /[Pp]urification|[Cc]haria|approuv/.test(n) ? "Incident Charia"
                     : /mapp/.test(n) ? "Donnée manquante"
                     : /liquidit|Liquidit/.test(n) ? "Dépassement de limite"
                     : "Calcul non équilibré";
  out.controls.forEach((c,i)=>{ if(!c.ok) exc.push({id:"CTL-"+i, type:typeCtrl(c.n),
    lib:c.n, severite:"Critique", source:c.loc, bloquante:true}); });
  out.rapprochements.forEach((r,i)=>{ if(!r.ok) exc.push({id:"RAP-"+i, type:"Rupture de rapprochement",
    lib:r.lib+" — écart "+r.ecart.toFixed(2), severite:r.criticite==="Élevée"?"Majeure":"Mineure",
    source:"Rapprochements", bloquante:false}); });
  // Les anomalies déjà couvertes par un contrôle (mapping, charges, purification) ne sont
  // pas ré-émises ici : elles remontent une seule fois, via le contrôle correspondant.
  exc.forEach(e=>{ const m2=meta[e.id]||{};
    e.statut=m2.statut||"Détectée"; e.proprietaire=m2.proprietaire||""; e.commentaire=m2.commentaire||""; });
  out.exceptions={liste:exc, nb:exc.length,
    bloquantes: exc.filter(e=>e.bloquante && ["Corrigée","Clôturée","Acceptée avec risque documenté"].indexOf(e.statut)<0).length,
    ouvertes: exc.filter(e=>["Clôturée","Acceptée avec risque documenté"].indexOf(e.statut)<0).length};
  // ===================== RÉFÉRENTIEL PRODUITS (CDC §10) =====================
  // Chaque produit porte son contrat charia, sa nisba datée, son statut de cycle de vie.
  // Un produit non publié ne peut pas être commercialisé (PRD-015).
  const prods = (s.produits||[]).map(p=>{
    const nisbaOK = Math.abs(R6((+p.nisbaDep)+(+p.nisbaBanque)-1))===0;
    return {code:p.code, lib:p.lib, contrat:p.contrat, statut:p.statut,
            nisbaDep:+p.nisbaDep, nisbaBanque:+p.nisbaBanque, nisbaOK,
            dateEffet:p.dateEffet, version:p.version, minimum:+p.minimum,
            tauxCible:+p.tauxCible, reference:p.reference,
            commercialisable: p.statut==="Publié" && nisbaOK && !!p.reference,
            bloquant: p.statut==="Publié" && (!nisbaOK || !p.reference)};
  });
  out.produits={liste:prods, nb:prods.length,
    publies:prods.filter(p=>p.statut==="Publié").length,
    commercialisables:prods.filter(p=>p.commercialisable).length,
    anomalies:prods.filter(p=>p.bloquant).length};

  // ===================== POOLS MULTIPLES (CDC §12) =====================
  // Chaque pool porte sa stratégie, ses ressources éligibles et ses actifs autorisés.
  const pls = (s.pools||[]).map(p=>{
    const actifs = (p.actifs||[]);
    // Allocation de chaque actif au pool, en % (ALK-001 : jamais plus de 100 % d'un actif)
    const encoursAlloue = sum(actifs.map(a=>{
      const r=out.ecoul.rows.filter(x=>x.post===a[0])[0];
      return r ? r.encMoyen*(+a[1]) : 0;
    }));
    const revenuAlloue = sum(actifs.map(a=>{
      const r=out.ecoul.rows.filter(x=>x.post===a[0])[0];
      return r ? r.revAnnuel*(+a[1]) : 0;
    }));
    const ressources = sum((p.ressources||[]).map(c=>{
      const r=out.pool.rows.filter(x=>x.cat===c)[0];
      return r ? r.invest : 0;
    }));
    return {id:p.id, lib:p.lib, type:p.type, devise:p.devise, statut:p.statut,
            restreint:p.type==="Restreint" || p.type==="Dédié",
            actifs, ressources:p.ressources||[],
            encoursAlloue, revenuAlloue, ressourcesInvesties:ressources,
            rendement: encoursAlloue ? (revenuAlloue*(1-P.dotationPER))/encoursAlloue : 0,
            liquiditeNonInvestie: ressources - encoursAlloue,
            surLiquide: ressources > encoursAlloue,
            sousAdosse: encoursAlloue > ressources};
  });
  // ALK-005 : détection des surallocations — la somme des quotes-parts d'un actif ≤ 100 %
  const allocParActif={};
  pls.forEach(p=>(p.actifs||[]).forEach(a=>{
    allocParActif[a[0]]=(allocParActif[a[0]]||0)+(+a[1]);
  }));
  const surAlloues = Object.keys(allocParActif).filter(k=>R6(allocParActif[k])>1)
    .map(k=>({actif:k, total:allocParActif[k]}));
  out.pools={liste:pls, nb:pls.length, allocParActif, surAlloues,
    nonAlloues: out.ecoul.rows.filter(r=>!allocParActif[r.post]).map(r=>r.post),
    totalAlloue: sum(pls.map(p=>p.encoursAlloue))};
  return out;
}
function sum(a){return a.reduce((x,y)=>x+y,0);}

/* ---- Cascade de rémunération d'un dépôt (fonction pure : sert au simulateur, aux courbes et au solveur) ---- */
function depositCascade(o){
  const montant=o.montant, cleDep=o.cleDep, tanazul=o.tanazul||0;
  const profitAttr = montant * o.rendementBase;
  const partBanqueBrute = profitAttr * (1 - cleDep);
  const renonce = partBanqueBrute * tanazul;              // hiba / tanazul : la banque abandonne une part de son Moudarib
  const partBanque = partBanqueBrute - renonce;
  const depBrut = profitAttr * cleDep + renonce;
  const irr = depBrut * o.irrRate;                        // IRR : uniquement sur la part des déposants (post-Moudarib)
  const netAvImpot = depBrut - irr;
  const irg = o.pp ? netAvImpot * o.irgRate : 0;
  const net = netAvImpot - irg;
  return {profitAttr, partBanqueBrute, renonce, partBanque, depBrut, irr, netAvImpot, irg, net,
          tauxBrut: montant ? depBrut/montant : 0,
          tauxNet:  montant ? net/montant : 0,
          cleEffective: cleDep + tanazul*(1-cleDep)};
}

/* ===================== EMPREINTE NUMÉRIQUE D'UN ARRÊTÉ (CDC §33) =====================
   Empreinte déterministe des données et paramètres : permet de démontrer qu'un run
   approuvé n'a pas été modifié après coup. Sérialisation à clés triées pour être
   indépendante de l'ordre d'insertion. */
function serialiserStable(o){
  if(o===null||typeof o!=="object") return JSON.stringify(o);
  if(Array.isArray(o)) return "["+o.map(serialiserStable).join(",")+"]";
  const ks=Object.keys(o).sort();
  return "{"+ks.map(k=>JSON.stringify(k)+":"+serialiserStable(o[k])).join(",")+"}";
}
function empreinte(obj){
  const s=serialiserStable(obj);
  // FNV-1a 32 bits sur deux passes décalées → 64 bits affichés en hexadécimal
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=(h1^c)>>>0; h1=Math.imul(h1,0x01000193)>>>0;
    h2=(h2^(c+i))>>>0; h2=Math.imul(h2,0x85ebca6b)>>>0;
  }
  const hex=n=>("00000000"+n.toString(16)).slice(-8).toUpperCase();
  return hex(h1)+"-"+hex(h2);
}
/* Périmètre de l'empreinte : ce qui détermine le résultat d'un arrêté. */
function empreinteRun(s){
  return empreinte({params:s.params, cbs:s.cbs, tiers:s.tiers, positions:s.positions, ecoul:s.ecoul,
                    revenus:s.revenus, reserves:s.reserves, purification:s.purification,
                    chargesMatrice:s.chargesMatrice, pools:s.pools, produits:s.produits});
}
