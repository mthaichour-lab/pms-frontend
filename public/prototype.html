  <span class="sep"></span><span class="mini">Document remis au client — taux indicatif, non garanti</span></div>
  <div id="avisImprimable">
  <div class="avis-head"><div><b>PMS — Avis de cotation</b><div class="mini">Exercice ${esc(STATE.params.exercice)} · établi le ${new Date().toLocaleDateString("fr-FR")}</div></div>
    <div class="mini" style="text-align:right">${q.client?esc(q.client.nom):"Prospect"}<br>${esc(CO.produit)} · ${esc(CO.maturite)} · ${mda(CO.montant,0)} MDA</div></div>
  <div id="avisCotation" class="cover ${q.cls==="ok"?"ok":q.cls==="ko"?"ko":""}" style="${q.cls==="warn"?"background:var(--charia-bg);border-color:var(--charia-line);color:var(--charia)":""}">
    <span class="ci"></span><span>${
      q.code==="assiette" ? `Aucun financement adossé à l'assiette retenue : la cotation ne peut être établie tant que le placement n'est pas couvert par des actifs réels.`
    : q.code==="marge" ? `Marge d'intermédiation insuffisante (${pf(q.marge,2)} &lt; minimum ${pf(q.margeMin,2)}) : cotation à refuser ou clé à revoir.`
    : q.code==="marche" ? `Taux servi inférieur au marché de ${pf(Math.abs(q.ecartMarche),2)} : <b>risque commercial translaté</b> (IFSB GN-4). Envisager un tanazul, sinon risque de fuite des dépôts.`
    : `Cotation acceptable : marge d'intermédiation ${pf(q.marge,2)}, taux servi ${q.ecartMarche>=0?"au-dessus de":"aligné sur"} la référence de marché.`
    }</span>
  </div>
  <div class="tbl-wrap" style="margin-top:14px"><table>
    <thead><tr><th>Élément d'appréciation</th><th class="num">Valeur</th><th>Seuil</th><th>Statut</th></tr></thead>
    <tbody>
      <tr><td>Marge d'intermédiation</td><td class="num">${pf(q.marge,2)}</td><td class="mini">≥ ${pf(STATE.params.margeMin,2)}</td><td>${okBadge(q.marge>=STATE.params.margeMin)}</td></tr>
      <tr><td>Taux net servi vs marché</td><td class="num">${pf(c.tauxNet,2)}</td><td class="mini">réf. ${pf(STATE.params.tauxMarche,2)}</td><td>${okBadge(q.ecartMarche>=-0.005)}</td></tr>
      <tr><td>Clé déposant</td><td class="num">${pf(c.cleEffective,2)}</td><td class="mini">grille ${pf(q.cleGrille,0)}</td><td>${okBadge(c.cleEffective<=1)}</td></tr>
      <tr><td>Taux de financement moyen du pool</td><td class="num">${pf(q.tauxFinMoyen,2)}</td><td class="mini">référence interne</td><td>—</td></tr>
    </tbody></table></div>
  </div>
  <div class="note charia">Le taux communiqué est <b>indicatif et non garanti</b> : en Moudaraba, le rendement effectif dépend du résultat réel du pool et le titulaire supporte le risque de perte en capital, sauf faute du Moudarib. Toute cotation hors grille engage l'ALCO ; sa validité doit être limitée dans le temps et mentionnée au client.</div>`;
};

VIEWS.gouvernance=m=>{
  const g=STATE.gouvernance, e=etapeDe(g.statut), idx=ETAPES.map(x=>x.code).indexOf(g.statut);
  const peutAvancer = e.suivant && g.role===e.role && g.utilisateur;
  const bloquePublication = e.suivant==="publie" && m.controlsOK<m.controls.length;
  return `
  <h2 class="section">Gouvernance — rôles &amp; circuit de validation</h2>
  <p class="lead">Les clés de répartition doivent être <b>arrêtées, validées et publiées avant le début de la période</b> de distribution (AAOIFI FAS 27). Ce circuit matérialise cette exigence et verrouille les paramètres une fois publiés.</p>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Étape en cours",e.label,"",g.statut==="publie"?"brand":"gold",{icon:"flag",
      note:`${idx+1} / ${ETAPES.length} · période <b>${esc(STATE.params.exercice)}</b>`})}
    ${kpi("Utilisateur déclaré",g.utilisateur||"—","",null,{icon:"users",note:`rôle <b>${esc(g.role)}</b>`})}
    ${kpi("Paramètres",parametresVerrouilles(g)?"Verrouillés":"Modifiables","",parametresVerrouilles(g)?"brand":"warn",
      {icon:"shield",note:parametresVerrouilles(g)?"aucune modification possible":"le circuit n'est pas achevé"})}
    ${kpi("Entrées au journal",STATE.journal.length,"",null,{icon:"layers",note:"piste d'audit horodatée"})}
  </div>

  <h3 class="sub">1 · Date d'effet et empreinte de l'arrêté</h3>
  <div class="card">
    <div class="ctl-row">
      <label class="fld"><span>Date d'effet des clés <span class="tag charia">charia</span></span>
        <input class="cell charia" type="date" data-path="params.dateEffet" value="${esc(STATE.params.dateEffet)}" style="max-width:180px;text-align:left"></label>
      <div class="fld"><span>Publication</span><div class="statline">${g.publieLe
        ? `publiées le <b>${new Date(g.publieLe).toLocaleString("fr-FR")}</b>` : "non publiées"}</div></div>
      <div class="fld"><span>Empreinte de l'arrêté en cours</span><div class="statline"><span class="hash">${esc(m.empreinte)}</span></div></div>
    </div>
    ${g.empreinteRun?`<div class="cover ${g.empreinteRun===m.empreinte?"ok":"ko"}"><span class="ci"></span><span>${
      g.empreinteRun===m.empreinte
        ? `Empreinte identique à celle enregistrée lors de la publication : <b>les données et paramètres n'ont pas été modifiés</b> depuis l'approbation.`
        : `<b>Les données ont changé depuis la publication.</b> Empreinte à la publication : <span class="hash">${esc(g.empreinteRun)}</span> — empreinte actuelle : <span class="hash">${esc(m.empreinte)}</span>. L'arrêté publié ne correspond plus à l'état courant.`
    }</span></div>`:""}
    <div class="note charia" style="margin-bottom:0">Les clés doivent être publiées <b>avant</b> leur date d'effet (AAOIFI FAS 27). L'empreinte est calculée sur les paramètres, la balance CBS, les positions clients, les écoulements, les revenus, les réserves et la purification.</div>
  </div>

  <h3 class="sub">2 · Identification</h3>
  <div class="card">
    <div class="ctl-row">
      <label class="fld"><span>Nom de l'utilisateur</span>${txtInput("gouvernance.utilisateur",g.utilisateur)}</label>
      <label class="fld"><span>Rôle</span>
        <select class="cell" data-path="gouvernance.role">
          ${ROLES.map(r=>`<option ${r===g.role?"selected":""}>${esc(r)}</option>`).join("")}
        </select></label>
    </div>
    <div class="cover ko" style="margin-top:4px"><span class="ci"></span><span>
      <b>Portée de ce contrôle.</b> L'identité est <b>déclarative</b> : ce fichier fonctionne sans serveur, il ne peut donc ni authentifier un utilisateur ni empêcher quiconque de choisir un autre rôle. Le circuit apporte de la <b>traçabilité et de la discipline de processus</b>, pas une sécurité d'accès. Un contrôle opposable à un auditeur suppose une application serveur avec comptes nominatifs — voir la note en fin de page.
    </span></div>
  </div>

  <h3 class="sub">3 · Circuit de validation</h3>
  <div class="card">
    <div class="wf">
      ${ETAPES.map((x,i)=>`<div class="wf-step ${i<idx?"done":i===idx?"cur":""}">
        <div class="wf-dot">${i<idx?"✓":i+1}</div>
        <div class="wf-lab">${esc(x.label)}</div>
        ${x.role?`<div class="wf-role">${esc(x.role)}</div>`:'<div class="wf-role">—</div>'}
      </div>`).join('<div class="wf-line"></div>')}
    </div>
    <div class="actbar" style="margin-top:16px">
      ${e.action?`<button type="button" class="abtn go" data-act="wf-next" ${peutAvancer&&!bloquePublication?"":"disabled"}>${esc(e.action)}</button>`:""}
      ${g.statut!=="brouillon"?`<button type="button" class="abtn" data-act="wf-reject">Renvoyer en brouillon</button>`:""}
      ${g.statut==="publie"?`<button type="button" class="abtn" data-act="wf-cloture">Clôturer et archiver la période</button>`:""}
      <span class="sep"></span>
      <span class="mini">${
        !g.utilisateur ? "Renseignez votre nom pour agir"
        : bloquePublication ? `<b style="color:var(--err)">Publication bloquée : ${m.controlsOK}/${m.controls.length} contrôles</b>`
        : e.suivant ? (g.role===e.role?"Vous pouvez valider cette étape":"Étape réservée au rôle « "+esc(e.role)+" »")
        : "Circuit achevé"}</span>
    </div>
  </div>

  ${g.validations.length?`<h3 class="sub">4 · Validations enregistrées</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Étape</th><th>Validée par</th><th>Rôle</th><th>Horodatage</th></tr></thead>
    <tbody>${g.validations.map(v=>`<tr><td class="cat">${esc(v.libelle)}</td><td>${esc(v.utilisateur)}</td>
      <td>${esc(v.role)}</td><td class="mini">${new Date(v.ts).toLocaleString("fr-FR")}</td></tr>`).join("")}
    </tbody></table></div>`:""}

  <div class="note charia">Une fois les paramètres <b>publiés</b>, toute modification est refusée : les clés ne valent que pour les périodes futures. Pour changer une clé, clôturez la période et ouvrez-en une nouvelle — l'ancienne reste archivée avec ses paramètres et son journal.</div>`;
};

VIEWS.journal=m=>{
  const f=(STATE.filtreJournal||"").trim().toLowerCase();
  const tout=STATE.journal;
  const vus=f?tout.filter(j=>(j.libelle+" "+j.utilisateur+" "+j.role+" "+j.type).toLowerCase().indexOf(f)>=0):tout;
  const fmt=v=>{ if(v===""||v==null) return "—";
    if(typeof v==="number") return Math.abs(v)<1&&v!==0?pf(v,2):nf(v,4);
    return esc(String(v)); };
  return `
  <h2 class="section">Journal des modifications</h2>
  <p class="lead">Piste d'audit horodatée : chaque changement de paramètre ou de réserve, chaque validation et chaque import y sont consignés, avec l'utilisateur déclaré, son rôle, la valeur avant et après.</p>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Entrées consignées",tout.length,"",null,{icon:"layers",note:`plafond de conservation : 500 entrées`})}
    ${kpi("Modifications de paramètres",tout.filter(j=>j.type==="parametre").length,"","gold",{icon:"scale"})}
    ${kpi("Événements de gouvernance",tout.filter(j=>j.type==="evenement").length,"","brand",{icon:"flag"})}
    ${kpi("Dernière écriture",tout.length?new Date(tout[0].ts).toLocaleDateString("fr-FR"):"—","",null,
      {icon:"clock",note:tout.length?esc(tout[0].utilisateur):"aucune"})}
  </div>

  <div class="actbar">
    <input class="search" type="search" data-path="filtreJournal" value="${esc(STATE.filtreJournal||"")}" placeholder="Filtrer (élément, utilisateur, rôle)…" aria-label="Filtrer le journal">
    <button type="button" class="abtn" data-act="jr-export">Exporter le journal (CSV)</button>
    <span class="sep"></span><span class="mini">${vus.length} / ${tout.length} entrée(s)</span>
  </div>
  ${tout.length?`<div class="tbl-wrap"><table>
    <thead><tr><th>Horodatage</th><th>Utilisateur</th><th>Rôle</th><th>Élément</th><th class="num">Avant</th><th class="num">Après</th><th>Période</th></tr></thead>
    <tbody>${vus.slice(0,200).map(j=>`<tr class="${j.type==="evenement"?"jr-evt":""}">
      <td class="mini">${new Date(j.ts).toLocaleString("fr-FR")}</td>
      <td>${esc(j.utilisateur)}</td><td class="mini">${esc(j.role)}</td>
      <td class="cat">${esc(j.libelle)}</td>
      <td class="num">${fmt(j.avant)}</td>
      <td class="num">${j.type==="evenement"?esc(String(j.apres||"—")):fmt(j.apres)}</td>
      <td class="mini">${esc(j.periode)}</td></tr>`).join("")}
    </tbody></table></div>
    ${vus.length>200?`<div class="mini" style="margin-top:6px">200 entrées les plus récentes affichées sur ${vus.length}.</div>`:""}`
   :`<div class="card"><div class="cover ok"><span class="ci"></span><span>Aucune modification enregistrée pour l'instant. Toute modification d'un paramètre ou d'une réserve sera consignée ici automatiquement.</span></div></div>`}

  <div class="note charia">Le journal est enregistré dans le dossier de travail et suit la période archivée. Il matérialise l'exigence de documentation des clés (AAOIFI FAS 27) et la traçabilité attendue par l'audit charia interne.</div>`;
};

VIEWS.periodes=m=>{
  const P=STATE.periodes, cmp=STATE.comparaison||{a:0,b:1};
  const A=P[cmp.a], B=P[cmp.b];
  const cur=indicateursPeriode(m);
  const val=(o,k,t)=>{ const v=o?o[k]:null; if(v==null) return "—"; return t==="pct"?pf(v,2):mda(v,2); };
  return `
  <h2 class="section">Périodes &amp; comparaison des arrêtés</h2>
  <p class="lead">Chaque période publiée peut être clôturée et archivée avec ses paramètres, ses indicateurs et son journal. Les arrêtés se comparent alors dans un même dossier, sans manipuler plusieurs fichiers.</p>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Périodes archivées",P.length,"",null,{icon:"layers",note:`période en cours : <b>${esc(STATE.params.exercice)}</b>`})}
    ${kpi("Rendement — période en cours",pf(cur.rendementBrut,2),"","brand",{icon:"gauge",
      note:`base <b>${mda(cur.base,1)}</b> MDA`})}
    ${kpi("Taux moyen servi (M2)",pf(cur.tauxMoyM2,2),"","gold",{icon:"pct"})}
    ${kpi("Statut du circuit",etapeDe(STATE.gouvernance.statut).label,"",
      STATE.gouvernance.statut==="publie"?"brand":"warn",{icon:"flag",
      note:STATE.gouvernance.statut==="publie"?"clôture possible":"publier avant de clôturer"})}
  </div>

  <h3 class="sub">1 · Archives</h3>
  ${P.length?`<div class="tbl-wrap"><table>
    <thead><tr><th>Période</th><th>Libellé</th><th>Clôturée le</th><th>Par</th><th class="num">Base distr.</th><th class="num">Rendement</th><th class="num">Taux servi</th><th>Contrôles</th><th>Actions</th></tr></thead>
    <tbody>${P.map((p,i)=>`<tr>
      <td class="cat">${esc(p.code)}</td><td>${esc(p.libelle)}</td>
      <td class="mini">${new Date(p.ts).toLocaleDateString("fr-FR")}</td>
      <td class="mini">${esc(p.cloturePar)}</td>
      <td class="num">${mda(p.indicateurs.base,2)}</td>
      <td class="num">${pf(p.indicateurs.rendementBrut,2)}</td>
      <td class="num">${pf(p.indicateurs.tauxMoyM2,2)}</td>
      <td class="mini">${esc(p.indicateurs.controles)}</td>
      <td><button type="button" class="abtn" data-act="pd-load" data-i="${i}">Recharger</button>
          <button type="button" class="abtn" data-act="pd-del" data-i="${i}">Supprimer</button></td></tr>`).join("")}
    </tbody></table></div>`
   :`<div class="card"><div class="cover ok"><span class="ci"></span><span>Aucune période archivée. Publiez les paramètres depuis <b data-goto="gouvernance" style="cursor:pointer;text-decoration:underline">Gouvernance</b>, puis clôturez la période pour l'archiver ici.</span></div></div>`}

  ${P.length>=2?`
  <h3 class="sub">2 · Comparaison de deux arrêtés</h3>
  <div class="card">
    <div class="ctl-row" style="margin-bottom:14px">
      <label class="fld"><span>Arrêté A</span><select class="cell" data-path="comparaison.a">
        ${P.map((p,i)=>`<option value="${i}" ${i===+cmp.a?"selected":""}>${esc(p.code)} — ${esc(p.libelle)}</option>`).join("")}</select></label>
      <label class="fld"><span>Arrêté B</span><select class="cell" data-path="comparaison.b">
        ${P.map((p,i)=>`<option value="${i}" ${i===+cmp.b?"selected":""}>${esc(p.code)} — ${esc(p.libelle)}</option>`).join("")}</select></label>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Indicateur</th><th class="num">${A?esc(A.code):"A"}</th><th class="num">${B?esc(B.code):"B"}</th><th class="num">Écart</th></tr></thead>
      <tbody>${LIGNES_COMPARAISON.map(([k,lab,t])=>{
        const a=A?A.indicateurs[k]:null, b=B?B.indicateurs[k]:null;
        const d=(a!=null&&b!=null)?b-a:null;
        return `<tr><td class="cat">${esc(lab)}</td>
          <td class="num">${val(A&&A.indicateurs,k,t)}</td>
          <td class="num">${val(B&&B.indicateurs,k,t)}</td>
          <td class="num">${d==null?"—":`<span class="delta ${d>=0?"up":"down"}">${d>=0?"+":""}${t==="pct"?pf(d,2):mda(d,2)}</span>`}</td></tr>`;
      }).join("")}</tbody></table></div>
  </div>`:""}

  ${P.length>=2?`<h3 class="sub">3 · Évolution du taux servi</h3>
  <div class="card">${multiLine([
      {name:"Rendement brut du pool",values:P.slice().reverse().map(p=>p.indicateurs.rendementBrut)},
      {name:"Taux moyen servi (M2)",values:P.slice().reverse().map(p=>p.indicateurs.tauxMoyM2)}
    ],P.slice().reverse().map(p=>p.code),{pct:true,zero:true,aria:"Évolution du taux servi par période"})}</div>`:""}

  <div class="note info">L'archive conserve l'intégralité des paramètres de la période : recharger un arrêté restitue exactement les clés qui étaient en vigueur, ce qui permet de rejouer une distribution passée à l'identique.</div>`;
};

VIEWS.explication=m=>{
  const E=m.explication, i=Math.min(STATE.explicationIdx||0, Math.max(0,E.positions.length-1));
  const x=E.positions[i];
  if(!x) return `<h2 class="section">Fiche d'explication du profit</h2>
    <div class="card"><div class="cover ko"><span class="ci"></span><span>Aucune position de placement enregistrée. Alimentez la table des positions clients depuis <b data-goto="clients" style="cursor:pointer;text-decoration:underline">Clients</b>.</span></div></div>`;
  const c=x.casc, pp=x.segment==="Particulier";
  const etape=(n,lib,formule,val,cls)=>`<tr class="${cls||""}">
    <td class="num" style="width:38px">${n}</td><td class="cat">${lib}</td>
    <td class="mini">${formule}</td><td class="num">${val}</td></tr>`;
  return `
  <h2 class="section">Fiche d'explication du profit</h2>
  <p class="lead">Restitution complète du calcul pour un compte : données d'entrée, étapes intermédiaires, ratios appliqués, réserves et fiscalité, jusqu'au montant net crédité. Répond au critère du cahier des charges : <b>tout montant distribué doit être explicable et reproductible</b>.</p>

  <div class="actbar">
    <label class="fld" style="max-width:420px"><span>Compte à expliquer</span>
      <select class="cell" data-path="explicationIdx">
        ${E.positions.map((p,k)=>`<option value="${k}" ${k===i?"selected":""}>${esc(p.nom)} — ${esc(p.produit)} · ${mda(p.montant,0)} MDA</option>`).join("")}
      </select></label>
    <span class="sep"></span>
    <button type="button" class="abtn go" data-act="print-fiche">Imprimer le relevé client</button>
  </div>

  <div id="ficheImprimable">
  <div class="avis-head">
    <div><b>Relevé de profit — compte d'investissement</b>
      <div class="mini">Exercice ${esc(STATE.params.exercice)} · édité le ${new Date().toLocaleDateString("fr-FR")} · empreinte de l'arrêté <span class="hash">${esc(m.empreinte)}</span></div></div>
    <div class="mini" style="text-align:right"><b>${esc(x.nom)}</b><br>${esc(x.id)} · ${esc(x.segment)}<br>${esc(x.produit)} · ${esc(x.maturite)}</div>
  </div>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Capital investi",mda(x.montant,0),"MDA",null,{icon:"wallet",note:`${esc(x.produit)} · ${esc(x.maturite)}`})}
    ${kpi("Profit net versé",mda(c.net,3),"MDA","gold",{icon:"coins",note:`taux servi <b>${pf(c.tauxNet,2)}</b>`})}
    ${kpi("Taux réalisé du pool",pf(x.tauxRealise,2),"","brand",{icon:"gauge",
      note:`taux distribué <b>${pf(x.tauxDistribue,2)}</b>`})}
    ${kpi("Nisba contractuelle",pf(x.nisbaDeposant,0),"",null,{icon:"scale",bar:x.nisbaDeposant,
      note:`déposant ${pf(x.nisbaDeposant,0)} / banque ${pf(x.nisbaBanque,0)}`})}
  </div>

  <h3 class="sub">1 · Base de participation</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th class="num" style="width:38px">#</th><th>Élément</th><th>Détail</th><th class="num">Valeur</th></tr></thead>
    <tbody>
      ${etape(1,"Solde éligible","capital investi sur la période",mda(x.montant,2)+" MDA")}
      ${etape(2,"Pondération de la catégorie","poids appliqué au produit "+esc(x.produit),nf(x.poidsCategorie,2))}
      ${etape(3,"Base de participation","solde × pondération",mda(x.baseParticipation,2)+" MDA","total")}
      ${etape(4,"Quote-part dans les bases pondérées","base du compte ÷ total des bases ("+mda(E.totBases,0)+")",pf(x.quotePart,3))}
    </tbody></table></div>

  <h3 class="sub">2 · Cascade de calcul du profit</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th class="num" style="width:38px">#</th><th>Étape</th><th>Formule appliquée</th><th class="num">Montant</th></tr></thead>
    <tbody>
      ${etape(5,"Produits du pool","revenus des financements + commissions",mda(m.revenus.totProduits,2))}
      ${etape(6,"Charges directes","− charges de gestion et dépréciations","−"+mda(m.revenus.totCharges,2))}
      ${m.purification.ncPeriode>0?etape(7,"Revenus non conformes","− montant à purifier (exclu de la base)","−"+mda(m.purification.ncPeriode,2),"jr-evt"):""}
      ${etape(m.purification.ncPeriode>0?8:7,"Produit brut du pool","produits − charges"+(m.purification.ncPeriode>0?" − non conformes":""),mda(m.revenus.produitBrut,2),"total")}
      ${etape(m.purification.ncPeriode>0?9:8,"Dotation PER","− "+pf(STATE.params.dotationPER,0)+" du produit brut, <b>avant</b> part du Moudarib","−"+mda(m.revenus.per,2))}
      ${etape(m.purification.ncPeriode>0?10:9,"Base de distribution","produit brut − PER",mda(m.revenus.base,2),"total")}
      ${etape(m.purification.ncPeriode>0?11:10,"Rendement du pool","base ÷ encours investis ("+mda(m.pool.totInvest,0)+")",pf(x.rendementPool,4))}
    </tbody></table></div>

  <h3 class="sub">3 · Part revenant au compte</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th class="num" style="width:38px">#</th><th>Étape</th><th>Formule appliquée</th><th class="num">Montant</th></tr></thead>
    <tbody>
      ${etape(12,"Profit attribuable au placement","capital × rendement du pool",mda(c.profitAttr,4))}
      ${etape(13,"Part de la banque (Moudarib)","profit × nisba banque ("+pf(x.nisbaBanque,0)+")","−"+mda(c.partBanque,4))}
      ${etape(14,"Profit brut du déposant","profit × nisba déposant ("+pf(x.nisbaDeposant,0)+")",mda(c.depBrut,4),"total")}
      ${etape(15,"Dotation IRR","− "+pf(STATE.params.dotationIRR,0)+" de la part du déposant, <b>après</b> Moudarib","−"+mda(c.irr,4))}
      ${etape(16,"Profit net avant impôt","brut − IRR",mda(c.netAvImpot,4))}
      ${etape(17,"Retenue IRG",pp?("− "+pf(STATE.params.tauxIRG,0)+" (personne physique)"):"non applicable (personne morale)","−"+mda(c.irg,4))}
      ${etape(18,"MONTANT NET CRÉDITÉ","net avant impôt − IRG",mda(c.net,4)+" MDA","total")}
    </tbody></table></div>

  <h3 class="sub">4 · Taux et réserves</h3>
  <div class="grid2">
    <div class="card"><div class="tbl-wrap"><table><tbody>
      <tr><td>Taux de profit <b>réalisé</b> par le pool</td><td class="num">${pf(x.tauxRealise,2)}</td></tr>
      <tr><td>Taux de profit <b>distribué</b> au compte</td><td class="num">${pf(x.tauxDistribue,2)}</td></tr>
      <tr><td>Écart réalisé / distribué</td><td class="num">${pf(x.ecartRealiseDistribue,2)}</td></tr>
      <tr><td>Taux brut avant IRR et IRG</td><td class="num">${pf(c.tauxBrut,2)}</td></tr>
    </tbody></table></div></div>
    <div class="card"><div class="tbl-wrap"><table><tbody>
      <tr><td>Réserve PER — solde de clôture</td><td class="num">${mda(m.reserves.perClot,2)} MDA</td></tr>
      <tr><td>Réserve IRR — solde de clôture</td><td class="num">${mda(m.reserves.irrClot,2)} MDA</td></tr>
      <tr><td>Prélèvement IRR sur ce compte</td><td class="num">${mda(c.irr,4)} MDA</td></tr>
      <tr><td>Capacité d'absorption d'une perte</td><td class="num">${pf(m.perte.capaciteEnPct,2)} des encours</td></tr>
    </tbody></table></div></div>
  </div>

  <div class="note charia">Le rendement d'un compte d'investissement Moudaraba <b>n'est pas garanti</b> : il dépend du résultat effectivement réalisé par le pool et le titulaire supporte le risque de perte en capital, sauf faute, négligence ou violation du mandat par le Moudarib. Les ratios de partage ont été arrêtés et publiés avant le début de la période.</div>
  </div>

  <div class="note info">Reproductibilité : à données et paramètres identiques, ce calcul restitue exactement le même montant. L'empreinte <span class="hash">${esc(m.empreinte)}</span> identifie le jeu de données et de paramètres utilisé.</div>`;
};

VIEWS.risques=m=>{
  const d=m.dcr, S=m.stress||[], SC=m.scenarios||[], B=m.budget||{};
  const CM=STATE.chargesMatrice||[];
  return `
  <h2 class="section">Risques, DCR &amp; stress tests</h2>
  <p class="lead">Mesure du risque commercial déplacé, résistance du dispositif à des chocs, projection par scénario et comparaison au budget. Cadre IFSB : risque de taux de rendement et <b>Displaced Commercial Risk</b>.</p>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Taux servi vs marché",pf(d.ecart,2),"",d.sousMarche?"warn":"brand",{icon:"gauge",
      note:`servi <b>${pf(d.tauxServi,2)}</b> · marché <b>${pf(d.tauxMarche,2)}</b>`})}
    ${kpi("Besoin de soutien",mda(d.besoinSoutien,2),"MDA",d.besoinSoutien>0?"gold":null,{icon:"scale",
      note:`pour aligner ${mda(d.encRemuneres,0)} MDA d'encours sur le marché`})}
    ${kpi("DCR consenti",mda(d.dcrMontant,2),"MDA",d.dcrMontant>0?"warn":null,{icon:"flag",
      note:`reprises de réserves de la période`})}
    ${kpi("Couverture par les réserves",pf(d.couvertureReserves,0),"",d.couvertureReserves>=1?"brand":"warn",
      {icon:"shield",bar:d.couvertureReserves,note:`PER + IRR face au besoin de soutien`})}
  </div>

  <h3 class="sub">1 · Risque commercial déplacé (DCR)</h3>
  <div class="tbl-wrap"><table><tbody>
    <tr><td>Taux moyen servi aux déposants (M2)</td><td class="num">${pf(d.tauxServi,2)}</td></tr>
    <tr><td>Référence de marché</td><td class="num">${pf(d.tauxMarche,2)}</td></tr>
    <tr><td>Écart au marché</td><td class="num"><span class="delta ${d.ecart>=0?"up":"down"}">${d.ecart>=0?"+":""}${pf(d.ecart,2)}</span></td></tr>
    <tr><td>Encours rémunérés concernés</td><td class="num">${mda(d.encRemuneres,1)} MDA</td></tr>
    <tr><td>Besoin de soutien pour atteindre le marché</td><td class="num">${mda(d.besoinSoutien,3)} MDA</td></tr>
    <tr><td>Profit théorique des actionnaires (part Moudarib)</td><td class="num">${mda(d.profitTheoriqueActionnaires,2)} MDA</td></tr>
    <tr><td>Soutien consenti via reprises de réserves</td><td class="num">${mda(d.repriseReserves,3)} MDA</td></tr>
    <tr class="total"><td>DCR de la période</td><td class="num">${mda(d.dcrMontant,3)} MDA</td></tr>
    <tr><td>Impact sur la marge de la banque</td><td class="num">${pf(d.impactMarge,2)}</td></tr>
    <tr><td>Besoin résiduel non couvert</td><td class="num">${mda(d.dcrResiduel,3)} MDA</td></tr>
  </tbody></table></div>
  <div class="note charia">La banque peut renoncer volontairement à une part de son Moudarib (<b>hiba / tanazul</b>) pour soutenir le rendement servi. Cette pratique doit rester exceptionnelle, approuvée et documentée : répétée sans encadrement, elle crée une <b>garantie implicite</b> incompatible avec la Moudaraba et non maîtrisée au plan prudentiel.</div>

  <h3 class="sub">2 · Stress tests</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Réf.</th><th>Scénario</th><th class="num">Base de distribution</th><th class="num">Rendement</th><th class="num">Taux servi</th><th class="num">Écart</th><th>Capital des déposants</th></tr></thead>
    <tbody>
    ${S.map(x=>`<tr class="${x.capitalEntame?"lineko":""}">
      <td class="mini">${esc(x.id)}</td><td class="cat">${esc(x.lib)}</td>
      <td class="num">${mda(x.base,2)}</td><td class="num">${pf(x.rendement,2)}</td>
      <td class="num">${pf(x.tauxServi,2)}</td>
      <td class="num"><span class="delta ${x.deltaTaux>=0?"up":"down"}">${x.deltaTaux>=0?"+":""}${pf(x.deltaTaux,2)}</span></td>
      <td>${x.capitalEntame?'<span class="badge err">ENTAMÉ</span>':(x.perte?'<span class="badge err">pool en perte</span>':'<span class="badge ok">préservé</span>')}</td></tr>`).join("")}
    </tbody></table></div>
  ${m.stressPire?`<div class="note ${m.stressPire.capitalEntame?"charia":"info"}">Scénario le plus défavorable : <b>${esc(m.stressPire.lib)}</b> — taux servi <b>${pf(m.stressPire.tauxServi,2)}</b>${m.stressPire.capitalEntame?", <b>le capital des déposants serait entamé</b>":", le capital des déposants reste préservé"}.</div>`:""}

  <h3 class="sub">3 · Scénarios de projection</h3>
  <div class="card">
    <div class="ctl-row" style="margin-bottom:14px">
      <label class="fld"><span>Optimiste — revenus</span>${numInput("scenarios.optimiste.rev",STATE.scenarios.optimiste.rev,{step:0.05})}</label>
      <label class="fld"><span>Optimiste — encours</span>${numInput("scenarios.optimiste.enc",STATE.scenarios.optimiste.enc,{step:0.05})}</label>
      <label class="fld"><span>Stressé — revenus</span>${numInput("scenarios.stresse.rev",STATE.scenarios.stresse.rev,{step:0.05})}</label>
      <label class="fld"><span>Stressé — encours</span>${numInput("scenarios.stresse.enc",STATE.scenarios.stresse.enc,{step:0.05})}</label>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Scénario</th><th class="num">Facteur revenus</th><th class="num">Facteur encours</th><th class="num">Base</th><th class="num">Rendement</th><th class="num">Taux servi</th><th class="num">Part banque</th></tr></thead>
      <tbody>${SC.map(x=>`<tr class="${x.id==="CEN"?"total":""}">
        <td class="cat">${esc(x.lib)}</td><td class="num">${nf(x.rev,2)}</td><td class="num">${nf(x.enc,2)}</td>
        <td class="num">${mda(x.base,2)}</td><td class="num">${pf(x.rendement,2)}</td>
        <td class="num">${pf(x.tauxServi,2)}</td><td class="num">${mda(x.partBanque,2)}</td></tr>`).join("")}
      </tbody></table></div>
  </div>

  <h3 class="sub">4 · Budget vs réalisé</h3>
  <div class="card">
    <div class="ctl-row" style="margin-bottom:14px">
      <label class="fld"><span>Base de distribution budgétée (MDA)</span>${numInput("budget.base",STATE.budget.base,{step:1})}</label>
      <label class="fld"><span>Taux servi budgété</span>${numInput("budget.tauxServi",STATE.budget.tauxServi,{pct:true,step:0.1})}</label>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Indicateur</th><th class="num">Budget</th><th class="num">Réalisé</th><th class="num">Écart</th></tr></thead>
      <tbody>
        <tr><td class="cat">Base de distribution</td><td class="num">${mda(B.baseBudget,2)}</td><td class="num">${mda(B.baseReel,2)}</td>
          <td class="num"><span class="delta ${B.ecartBase>=0?"up":"down"}">${B.ecartBase>=0?"+":""}${mda(B.ecartBase,2)}</span> (${pf(B.ecartBasePct,1)})</td></tr>
        <tr><td class="cat">Taux moyen servi</td><td class="num">${pf(B.tauxBudget,2)}</td><td class="num">${pf(B.tauxReel,2)}</td>
          <td class="num"><span class="delta ${B.ecartTaux>=0?"up":"down"}">${B.ecartTaux>=0?"+":""}${pf(B.ecartTaux,2)}</span></td></tr>
      </tbody></table></div>
    <div class="cover ${B.atteint?"ok":"ko"}" style="margin-top:12px"><span class="ci"></span><span>${
      B.atteint ? "Objectifs de base et de taux servi atteints sur la période."
                : "Objectifs non atteints : "+(B.ecartBase<0?"base inférieure au budget":"")+(B.ecartBase<0&&B.ecartTaux<0?" et ":"")+(B.ecartTaux<0?"taux servi inférieur au budget":"")+"."}</span></div>
  </div>

  <h3 class="sub">5 · Matrice d'imputabilité des charges</h3>
  <div class="card">
    <div class="tbl-wrap"><table>
      <thead><tr><th>Charge</th><th class="num">Montant (MDA)</th><th>Imputable à</th><th>Répartition</th><th>Approbation Charia</th><th>Effet sur la base</th></tr></thead>
      <tbody>
        <tr><td class="cat">Charges directes de gestion</td><td class="num">${mda(STATE.revenus.chargesGestion,2)}</td>
          <td><span class="sens f">Pool</span></td><td class="mini">au prorata des revenus</td><td>${okBadge(true)}</td><td class="mini">déduite</td></tr>
        <tr><td class="cat">Pertes et dépréciations</td><td class="num">${mda(STATE.revenus.pertesDepreciations,2)}</td>
          <td><span class="sens f">Pool</span></td><td class="mini">au prorata des revenus</td><td>${okBadge(true)}</td><td class="mini">déduite</td></tr>
        ${CM.map((c,i)=>`<tr>
          <td>${txtInput(`chargesMatrice.${i}.0`,c[0])}</td>
          <td class="num">${numInput(`chargesMatrice.${i}.1`,c[1],{step:0.5})}</td>
          <td><select class="cell" data-path="chargesMatrice.${i}.2">
            <option value="pool" ${c[2]==="pool"?"selected":""}>Pool</option>
            <option value="banque" ${c[2]==="banque"?"selected":""}>Banque (Moudarib)</option></select></td>
          <td class="mini">${c[2]==="pool"?"au prorata des revenus":"hors base"}</td>
          <td><select class="cell" data-path="chargesMatrice.${i}.3">
            <option value="1" ${+c[3]===1?"selected":""}>Approuvée</option>
            <option value="0" ${+c[3]===0?"selected":""}>Non approuvée</option></select></td>
          <td class="mini">${c[2]==="pool"?(+c[3]===1?"déduite":"<b style='color:var(--err)'>rejetée</b>"):"non déduite"}</td></tr>`).join("")}
        <tr class="total"><td>Total imputé au pool</td><td class="num">${mda(m.revenus.totCharges,2)}</td><td colspan="4"></td></tr>
      </tbody></table></div>
    <div class="actbar" style="margin-top:12px">
      <button type="button" class="abtn" data-act="ch-add">Ajouter une charge</button>
      ${CM.length?`<button type="button" class="abtn" data-act="ch-del">Retirer la dernière</button>`:""}
    </div>
    <div class="note charia" style="margin-bottom:0">Une charge n'est déductible de la base de partage que si elle est <b>directement imputable au pool</b> et <b>approuvée par le Comité Charia</b>. Les charges de structure de la banque sont supportées par le Moudarib au titre de sa rémunération et ne peuvent réduire la part des déposants.</div>
  </div>`;
};

VIEWS.comptable=m=>{
  const E=m.ecritures, R=m.rapprochements, X=m.exceptions;
  const STATUTS=["Détectée","Qualifiée","Assignée","En traitement","Corrigée","Contrôlée","Clôturée","Acceptée avec risque documenté"];
  return `
  <h2 class="section">Sous-ledger, rapprochements &amp; exceptions</h2>
  <p class="lead">Écritures comptables générées à partir du calcul, rapprochements de bout en bout et centre d'exceptions. Toute anomalie bloquante interdit la publication de l'arrêté.</p>

  <div class="kpis" style="margin-bottom:18px">
    ${kpi("Écritures générées",E.nb,"",null,{icon:"layers",note:`total <b>${mda(E.totDebit,2)}</b> MDA en partie double`})}
    ${kpi("Équilibre comptable",E.equilibre?"Équilibré":"Déséquilibré","",E.equilibre?"brand":"warn",
      {icon:"scale",note:`débits = crédits (GL-003)`})}
    ${kpi("Rapprochements",(R.length-m.rapprochementsKO)+"/"+R.length,"",m.rapprochementsKO?"warn":"brand",
      {icon:"gauge",bar:(R.length-m.rapprochementsKO)/R.length,note:`${m.rapprochementsKO} écart(s) hors seuil`})}
    ${kpi("Exceptions ouvertes",X.ouvertes,"",X.bloquantes?"warn":(X.ouvertes?"gold":"brand"),
      {icon:"flag",note:X.bloquantes?`<b>${X.bloquantes} bloquante(s)</b> pour la clôture`:"aucune bloquante"})}
  </div>

  <h3 class="sub">1 · Écritures du sous-ledger</h3>
  <div class="tbl-wrap"><table>
    <thead><tr><th class="num" style="width:38px">N°</th><th>Libellé de l'événement</th><th>Compte débité</th><th>Compte crédité</th><th class="num">Montant (MDA)</th></tr></thead>
    <tbody>

let TESTS={pass:0,total:0,rows:[]};
function runTests(){
  const ref=computeModel(defaults());
  const rows=[]; let pass=0;
  for(const name in REF){
    const got=REF[name][0](ref), exp=REF[name][1];
    const ok=Math.abs(got-exp)<1e-6; if(ok)pass++;
    rows.push({name,got,exp,ok});
  }
  TESTS={pass,total:rows.length,rows};
  return TESTS;
}

/* Indicateur : libellé, valeur, unité, tonalité + contexte optionnel (jauge / note) */
function kpi(label,val,unit,cls,extra){
  extra=extra||{};
  const tone=cls==="gold"?"gold":cls==="brand"?"brand":cls==="warn"?"warn":"base";
  const icon=extra.icon||(tone==="gold"?"coins":tone==="brand"?"invest":"wallet");
  let foot="";
  if(typeof extra.bar==="number"){
    const p=Math.max(0,Math.min(1,extra.bar));
    foot=`<div class="s-bar" role="img" aria-label="${esc(extra.barLabel||"")} ${pf(p,1)}"><i style="width:${(p*100).toFixed(1)}%"></i></div>`
        +(extra.note?`<div class="s-note">${extra.note}</div>`:"");
  } else if(extra.note){ foot=`<div class="s-note">${extra.note}</div>`; }
  return `<div class="stat t-${tone}">
    <div class="s-head"><span class="s-ico">${icoSvg(icon)}</span><span class="s-lab">${esc(label)}</span></div>
    <div class="s-val">${val}${unit?`<span class="s-unit">${esc(unit)}</span>`:""}</div>
    ${foot?`<div class="s-foot">${foot}</div>`:""}
  </div>`;
}

function barsH(data){

  return `<div style="display:flex;flex-direction:column;gap:9px">${data.map(d=>`
    <div style="display:grid;grid-template-columns:180px 1fr 92px;align-items:center;gap:10px">

    </div>`).join("")}</div>`;
}

function groupedBars(rows){
  const W=520,H=210,pad=34,bw=Math.min(46,(W-2*pad)/rows.length/2.4);
  const max=Math.max(...rows.flatMap(r=>[r.rM1,r.rM2]),0.001);
  const y=v=>H-pad-(v/max)*(H-2*pad);
  const gap=(W-2*pad)/rows.length;
  let bars="";
  rows.forEach((r,i)=>{
    const x=pad+gap*i+gap/2;
    bars+=`<rect x="${x-bw-2}" y="${y(r.rM1)}" width="${bw}" height="${H-pad-y(r.rM1)}" fill="var(--gold)" rx="3"><title>M1 ${esc(r.cat)} : ${pf(r.rM1)}</title></rect>`;
    bars+=`<rect x="${x+2}" y="${y(r.rM2)}" width="${bw}" height="${H-pad-y(r.rM2)}" fill="var(--primary-2)" rx="3"><title>M2 ${esc(r.cat)} : ${pf(r.rM2)}</title></rect>`;
    bars+=`<text x="${x}" y="${H-pad+14}" font-size="9.5" text-anchor="middle">${esc(r.cat.split(" ")[0])}</text>`;
  });
  const ticks=[0,.25,.5,.75,1].map(t=>{const v=max*t;return `<line class="grid" x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad-5}" y="${y(v)+3}" font-size="9" text-anchor="end">${pf(v,1)}</text>`;}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${ticks}${bars}
    <line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/></svg>
    <div class="legend" style="margin-top:4px"><div class="li"><span class="sw" style="background:var(--gold)"></span>Méthode 1 (clé fixe)</div><div class="li"><span class="sw" style="background:var(--primary-2)"></span>Méthode 2 (AAOIFI)</div></div>`;
}

function lineChart(vals,labels){
  const W=520,H=210,pad=36;
  const max=Math.max(...vals)*1.08,min=Math.min(...vals)*0.9;
  const x=i=>pad+i*(W-2*pad)/(vals.length-1);
  const y=v=>H-pad-((v-min)/((max-min)||1))*(H-2*pad);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const area=`${pad},${H-pad} ${pts} ${W-pad},${H-pad}`;
  const ticks=[0,.25,.5,.75,1].map(t=>{const v=min+(max-min)*t;return `<line class="grid" x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad-6}" y="${y(v)+3}" font-size="9" text-anchor="end">${mda(v,0)}</text>`;}).join("");
  const xl=labels.map((l,i)=> (i%2===0||i===labels.length-1)?`<text x="${x(i)}" y="${H-pad+14}" font-size="9" text-anchor="middle">${l}</text>`:"").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${ticks}
    <polygon points="${area}" fill="color-mix(in srgb,var(--primary) 12%,transparent)"/>
    <polyline points="${pts}" fill="none" stroke="var(--primary-2)" stroke-width="2.2"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="var(--primary-2)"><title>${labels[i]} : ${mda(v,1)}</title></circle>`).join("")}
    ${xl}<line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/></svg>`;
}

function waterfall(steps){
  const W=520,H=220,pad=40;
  let cum=0; const pts=[];
  steps.forEach(s=>{if(s.type==="tot"){pts.push({label:s.label,base:0,val:s.value,type:s.type});}else{const b=cum;cum+=s.value;pts.push({label:s.label,base:Math.min(b,cum),val:Math.abs(s.value),type:s.type});}});
  const allv=[...pts.map(p=>p.base+p.val), ...steps.filter(s=>s.type==='tot').map(s=>s.value)];
  const max=Math.max(...allv)*1.1;
  const bw=(W-2*pad)/steps.length*0.6, gap=(W-2*pad)/steps.length;
  const y=v=>H-pad-(v/max)*(H-2*pad);
  let bars="";
  pts.forEach((p,i)=>{
    const x=pad+gap*i+gap/2-bw/2;
    const col=p.type==="pos"?"var(--primary-2)":p.type==="neg"?"var(--err)":"var(--gold)";
    const top=p.type==="tot"?y(p.val):y(p.base+p.val);
    const h=p.type==="tot"?(H-pad-y(p.val)):(y(p.base)-y(p.base+p.val));
    bars+=`<rect x="${x}" y="${top}" width="${bw}" height="${Math.max(h,1)}" fill="${col}" rx="3"/>`;
    bars+=`<text x="${x+bw/2}" y="${top-5}" font-size="10" text-anchor="middle" fill="var(--ink)">${mda(p.type==='tot'?p.val:steps[i].value,1)}</text>`;
    bars+=`<text x="${x+bw/2}" y="${H-pad+14}" font-size="10" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}<line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/></svg>`;
}

const SERIES_STYLE=[
  {c:"#12a074",d:""},{c:"#1d4ed8",d:"6 3"},{c:"#b5820f",d:""},{c:"#c0362c",d:"3 2"},
  {c:"#7c3aed",d:"7 2 2 2"},{c:"#0891b2",d:""},{c:"#be185d",d:"4 3"}

function multiLine(series,labels,opts){
  opts=opts||{};
  const W=580,H=250,padL=48,padR=14,padT=14,padB=30;
  const all=series.reduce((a,s)=>a.concat(s.values),[]);
  let max=Math.max.apply(null,all), min=Math.min.apply(null,all);
  if(!isFinite(max)||!isFinite(min)){max=1;min=0;}
  if(max===min){max=max+Math.abs(max||1)*0.15;min=min-Math.abs(min||1)*0.15;}
  else {const sp=(max-min)*0.12;max+=sp;min-=sp;}
  if(opts.zero&&min>0)min=0;
  const n=labels.length;
  const x=i=>padL+(n<2?0:i*(W-padL-padR)/(n-1));
  const y=v=>H-padB-((v-min)/((max-min)||1))*(H-padB-padT);
  const f=v=>opts.pct?pf(v,2):nf(v,1);
  let g="";
  for(let t=0;t<=4;t++){const v=min+(max-min)*t/4;
    g+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL-7}" y="${y(v)+3}" font-size="9" text-anchor="end">${f(v)}</text>`;}
  let paths="";
  series.forEach((s,si)=>{
    const st=SERIES_STYLE[si%SERIES_STYLE.length];
    const pts=s.values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    paths+=`<polyline points="${pts}" fill="none" stroke="${st.c}" stroke-width="2.1" ${st.d?`stroke-dasharray="${st.d}"`:""} stroke-linejoin="round" stroke-linecap="round"/>`;
    paths+=s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.4" fill="${st.c}"><title>${esc(s.name)} · ${labels[i]} : ${f(v)}</title></circle>`).join("");
  });
  const xl=labels.map((l,i)=>(n<=8||i%2===0||i===n-1)?`<text x="${x(i)}" y="${H-padB+14}" font-size="9" text-anchor="middle">${esc(l)}</text>`:"").join("");
  const leg=series.map((s,si)=>{const st=SERIES_STYLE[si%SERIES_STYLE.length];
    return `<div class="li"><span class="sw" style="background:${st.c}"></span>${esc(s.name)}</div>`;}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(opts.aria||"Graphique")}">${g}${paths}${xl}
    <line class="axis" x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}"/></svg>
    <div class="legend" style="margin-top:2px">${leg}</div>`;
}

function barsRate(data){
  const max=Math.max.apply(null,data.map(d=>d.value).concat([0.0001]));
  return `<div style="display:flex;flex-direction:column;gap:9px">${data.map((d,i)=>{
    const st=SERIES_STYLE[i%SERIES_STYLE.length];
    return `<div style="display:grid;grid-template-columns:150px 1fr 74px;align-items:center;gap:10px">
      <div class="mini" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(d.label)}">${esc(d.label)}</div>
      <div style="background:var(--surface-3);border-radius:5px;height:18px;overflow:hidden"><div style="width:${Math.max(1,d.value/max*100)}%;height:100%;background:${st.c};border-radius:5px"></div></div>
      <div class="num" style="font-family:var(--mono);font-size:12px;text-align:right">${pf(d.value,2)}</div>
    </div>`;}).join("")}</div>`;
}

document.addEventListener("click",e=>{
  const sg=e.target.closest(".seg[data-path]");
  if(sg){ setPath(STATE,sg.dataset.path,sg.dataset.val); recompute(); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, tous=MODEL.allocation.tous, P={};
  if(act==="al-all") tous.forEach(r=>P[r.post]=true);
  else if(act==="al-none"){}
  else if(act==="al-top"){ const n=+el.dataset.n||1; tous.slice(0,n).forEach(r=>P[r.post]=true); }
  else if(act==="al-opt"){ MODEL.allocation.opt.posts.forEach(p=>P[p]=true); }
  else if(act==="imp-apply"){ appliquerImport(); return; }
  else if(act==="imp-model"){ modeleImport(); return; }
  else if(act==="imp-clear"){ STATE.importTxt=""; recompute(); renderView(CURRENT); return; }
  else if(act==="print-avis"){ imprimerSeul("#avisImprimable"); return; }
  else if(act==="print-fiche"){ imprimerSeul("#ficheImprimable"); return; }
  else if(act==="ch-add"){ STATE.chargesMatrice.push(["Nouvelle charge",0,"pool",1]); recompute(); renderView(CURRENT); return; }
  else if(act==="ch-del"){ STATE.chargesMatrice.pop(); recompute(); renderView(CURRENT); return; }
  else if(act==="ec-export"){ exporterEcritures(); return; }
  else if(act==="pr-add"){ STATE.produits.push({code:"NEW-"+(STATE.produits.length+1),lib:"Nouveau produit",
      contrat:"Moudaraba non restreinte",nisbaDep:0.5,nisbaBanque:0.5,minimum:1,tauxCible:0.03,
      dateEffet:STATE.params.dateEffet,statut:"Brouillon",version:"v1",reference:""});
    recompute(); renderView(CURRENT); return; }
  else if(act==="pr-del"){ STATE.produits.pop(); recompute(); renderView(CURRENT); return; }
  else if(act==="pl-add"){ STATE.pools.push({id:"POOL-"+(STATE.pools.length+1),lib:"Nouveau pool",
      type:"Dédié",devise:"DZD",statut:"Ouvert",ressources:[],actifs:[]});
    recompute(); renderView(CURRENT); return; }
  else if(act==="pl-del"){ STATE.pools.pop(); recompute(); renderView(CURRENT); return; }
  else if(act==="ti-add"){ const n=STATE.tiers.length+1; STATE.tiers.push(["C-"+String(100+n).slice(1),"Nouveau tiers","Entreprise","","","","","","",""]); recompute(); renderView(CURRENT); return; }
  else if(act==="ti-del"){ STATE.tiers.pop(); recompute(); renderView(CURRENT); return; }
  else if(act==="po-add"){ const id=(STATE.tiers[0]||["C-001"])[0]; STATE.positions.push([id,"Financement","Mourabaha équipement",50,""]); recompute(); renderView(CURRENT); return; }
  else if(act==="po-del"){ STATE.positions.pop(); recompute(); renderView(CURRENT); return; }
  else if(act==="wf-next"){ avancerWorkflow(); return; }
  else if(act==="wf-reject"){ rejeterWorkflow(); return; }
  else if(act==="wf-cloture"){ cloturerPeriode(); return; }
  else if(act==="jr-export"){ exporterJournal(); return; }
  else if(act==="pd-load"){ restaurerPeriode(+el.dataset.i); return; }
  else if(act==="pd-del"){ supprimerPeriode(+el.dataset.i); return; }
  else return;
  STATE.allocation.posts=P; recompute();
});

/* ===================== ACTIONS DE GOUVERNANCE ===================== */
function journaliser(chemin,avant,apres,type){
  const g=STATE.gouvernance;
  STATE.journal.unshift({
    ts:new Date().toISOString(), utilisateur:g.utilisateur||"(non identifié)", role:g.role,
    type:type||"parametre", chemin:chemin, libelle:libellePath(chemin),
    avant:avant, apres:apres, periode:STATE.params.exercice, statut:g.statut
  });
  if(STATE.journal.length>500) STATE.journal.length=500;
}
function evenement(libelle,detail){
  const g=STATE.gouvernance;
  STATE.journal.unshift({
    ts:new Date().toISOString(), utilisateur:g.utilisateur||"(non identifié)", role:g.role,
    type:"evenement", chemin:"", libelle:libelle, avant:"", apres:detail||"",
    periode:STATE.params.exercice, statut:g.statut
  });
}
function avancerWorkflow(){
  const g=STATE.gouvernance, e=etapeDe(g.statut);
  if(!e.suivant) return;
  if(!g.utilisateur){ toast("Renseignez votre nom avant de valider",true); return; }
  if(g.role!==e.role){ toast("Cette étape relève du rôle « "+e.role+" »",true); return; }
  if(e.suivant==="publie" && MODEL.controlsOK<MODEL.controls.length){
    toast("Publication refusée : "+MODEL.controlsOK+"/"+MODEL.controls.length+" contrôles seulement",true); return; }
  if(e.suivant==="publie" && MODEL.exceptions.bloquantes>0){
    toast("Publication refusée : "+MODEL.exceptions.bloquantes+" exception(s) bloquante(s) non traitée(s)",true); return; }
  if(e.suivant==="publie"){ g.publieLe=new Date().toISOString(); g.empreinteRun=MODEL.empreinte; }
  g.validations.push({etape:e.suivant, libelle:etapeDe(e.suivant).label,
                      utilisateur:g.utilisateur, role:g.role, ts:new Date().toISOString()});
  g.statut=e.suivant;
  evenement("Circuit de validation : "+etapeDe(g.statut).label, g.utilisateur+" ("+g.role+")");
  recompute(); renderView(CURRENT);
  toast(e.suivant==="publie" ? "Paramètres publiés et verrouillés" : "Étape validée : "+etapeDe(g.statut).label);
}
function rejeterWorkflow(){
  const g=STATE.gouvernance;
  if(g.statut==="brouillon") return;
  if(g.role==="Lecture seule"){ toast("Action non permise en lecture seule",true); return; }
  const ancien=g.statut; g.statut="brouillon"; g.validations=[];
  evenement("Retour en brouillon depuis « "+etapeDe(ancien).label+" »", g.utilisateur+" ("+g.role+")");
  recompute(); renderView(CURRENT);
  toast("Dossier renvoyé en brouillon");
}
function cloturerPeriode(){
  const g=STATE.gouvernance;
  if(g.statut!=="publie"){ toast("Clôture impossible : les paramètres ne sont pas publiés",true); return; }
  const snap=JSON.parse(JSON.stringify(STATE));
  delete snap.periodes; delete snap.journal;
  STATE.periodes.unshift({
    code:STATE.params.exercice, libelle:STATE.periodeLibelle||("Arrêté "+STATE.params.exercice),
    ts:new Date().toISOString(), cloturePar:g.utilisateur||"(non identifié)",
    indicateurs:indicateursPeriode(MODEL), empreinte:MODEL.empreinte, etat:snap
  });
  evenement("Clôture et archivage de la période "+STATE.params.exercice,
            "indicateurs figés · "+MODEL.controlsOK+"/"+MODEL.controls.length+" contrôles");
  // La nouvelle période repart vierge : l'horodatage de publication et l'empreinte
  // appartiennent à la période archivée, pas à celle qui s'ouvre.
  g.statut="brouillon"; g.validations=[]; g.publieLe=""; g.empreinteRun="";
  recompute(); renderView(CURRENT);
  toast("Période archivée — nouvelle période ouverte en brouillon");
}
function restaurerPeriode(i){
  const p=STATE.periodes[i]; if(!p) return;
  const journal=STATE.journal, periodes=STATE.periodes;
  STATE=fillDefaults(defaults(),p.etat);
  STATE.journal=journal; STATE.periodes=periodes;
  evenement("Rechargement de la période archivée "+p.code, p.libelle);
  recompute(); renderView(CURRENT);
  toast("Période "+p.code+" rechargée");
}
function supprimerPeriode(i){
  const p=STATE.periodes[i]; if(!p) return;
  if(!confirm("Supprimer définitivement l'archive « "+p.libelle+" » ?")) return;
  STATE.periodes.splice(i,1);
  evenement("Suppression de l'archive "+p.code, p.libelle);
  recompute(); renderView(CURRENT); toast("Archive supprimée");
}
function exporterJournal(){
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const L=[["Horodatage","Utilisateur","Rôle","Type","Élément","Valeur avant","Valeur après","Période","Statut"].map(q).join(";")];
  STATE.journal.forEach(j=>L.push([j.ts,j.utilisateur,j.role,j.type,j.libelle,j.avant,j.apres,j.periode,j.statut].map(q).join(";")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+L.join("\r\n")],{type:"text/csv;charset=utf-8;"}));
  a.download="PMS_journal_"+STATE.params.exercice+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast("Journal exporté ("+STATE.journal.length+" entrées)");
}
/* Verrouillage effectif des champs après publication ou en lecture seule */
function appliquerVerrou(){
  const g=STATE.gouvernance;
  const lock=parametresVerrouilles(g);
  document.querySelectorAll('[data-path^="params."],[data-path^="reserves."]').forEach(el=>{ el.disabled=lock; });
  if(g.role==="Lecture seule"){
    document.querySelectorAll('.wrap input,.wrap select,.wrap textarea,.wrap .abtn,.wrap .seg')
      .forEach(el=>{ el.disabled=true; });
  }
  const b=document.getElementById("lockPill");
  if(b){ b.className="pill "+(lock?"err":"ok"); b.querySelector("span:last-child").textContent=
    lock?(g.role==="Lecture seule"?"Lecture seule":"Paramètres verrouillés"):etapeDe(g.statut).label; }
}

/* ===================== DOSSIER DE TRAVAIL (enregistrer / ouvrir) ===================== */
function enregistrerDossier(){
  const paquet={ application:"PMS — Profit Sharing Management", version:BUILD,
    periode:STATE.params.exercice, enregistreLe:new Date().toISOString(), donnees:STATE };
  const nom="PMS_dossier_"+STATE.params.exercice+"_"+new Date().toISOString().slice(0,10)+".json";
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(paquet,null,1)],{type:"application/json"}));
  a.download=nom; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast("Dossier enregistré : "+nom);
}
function ouvrirDossier(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const p=JSON.parse(fr.result);
      const d=p&&p.donnees?p.donnees:p;
      if(!d||!d.params||!d.cbs) throw new Error("structure de dossier non reconnue");
      STATE=fillDefaults(defaults(),d);
      recompute(); renderView(CURRENT);
      toast("Dossier ouvert"+(p.periode?" — exercice "+p.periode:"")+(p.enregistreLe?" (enregistré le "+p.enregistreLe.slice(0,10)+")":""));
    }catch(e){ toast("Dossier illisible : "+e.message,true); }
  };
  fr.onerror=()=>toast("Lecture du fichier impossible",true);
  fr.readAsText(file);
}
function toast(msg,ko){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.className="toast show"+(ko?" ko":""); t.textContent=msg;
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>{t.className="toast";},4200);
}

/* ===================== APPLICATION D'UN IMPORT ===================== */
function appliquerImport(){
  const p=MODEL.importPreview;
  if(!p||p.vide){ toast("Rien à importer",true); return; }
  const bons=p.lignes.filter(l=>!l.err.length).map(l=>l.val);
  if(!bons.length){ toast("Aucune ligne valide",true); return; }
  if(p.cible==="cbs") STATE.cbs=bons; else if(p.cible==="tiers") STATE.tiers=bons; else STATE.positions=bons;
  evenement("Import "+(p.cible==="cbs"?"balance CBS":p.cible==="tiers"?"référentiel tiers":"positions clients"),
            bons.length+" ligne(s) importée(s)"+(p.ko?", "+p.ko+" rejetée(s)":""));
  STATE.importTxt=""; recompute(); renderView(CURRENT);
  toast(bons.length+" ligne(s) importée(s)"+(p.ko?" — "+p.ko+" ligne(s) rejetée(s)":""));
}
function modeleImport(){

   : "id_tiers;sens;produit;montant;maturite\nC-011;Financement;Mourabaha équipement;120;\nC-011;Placement;DAT islamiques;80;12 mois";
  STATE.importTxt=txt; recompute(); renderView(CURRENT);
}

/* ===================== IMPRESSION CIBLÉE ===================== */
function imprimerSeul(sel){
  const el=document.querySelector(sel);
  if(!el){ window.print(); return; }
  el.classList.add("print-only");
  document.body.classList.add("print-target");
  const fin=()=>{ el.classList.remove("print-only"); document.body.classList.remove("print-target");
                  window.removeEventListener("afterprint",fin); };
  window.addEventListener("afterprint",fin);
  window.print();
  setTimeout(fin,1500);
}
