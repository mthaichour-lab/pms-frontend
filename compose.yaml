services:
  web:
    image: ${PMS_FRONTEND_IMAGE:-pms-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.compose
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${PMS_WEB_BIND_ADDRESS:-127.0.0.1}:${PMS_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - pms

networks:
  pms:
    name: pms-network
    external: true
