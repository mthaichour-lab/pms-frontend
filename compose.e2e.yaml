networks:
  pms:
    name: pms-frontend-e2e-network

services:
  # The real E2E probe runs inside the Compose network. Avoid publishing the
  # backend stack's developer ports, which prevents collisions with a running
  # local PMS instance and with Windows-reserved host ports.
  postgres:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  keycloak:
    ports: !reset []

  api:
    ports: !reset []

  allocation-fixture:
    image: postgres:16-alpine
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-pms_app}
      - -d
      - ${POSTGRES_DB:-pms}
      - -f
      - /fixtures/allocation-fixture.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${PMS_FRONTEND_CONTEXT}/tests/e2e/allocation-fixture.sql:/fixtures/allocation-fixture.sql:ro
    depends_on:
      postgres: { condition: service_healthy }
      db-seed: { condition: service_completed_successfully }
    restart: "no"
    networks: [pms]

  web:
    image: pms-frontend:e2e
    build:
      context: ${PMS_FRONTEND_CONTEXT:?set PMS_FRONTEND_CONTEXT}
      dockerfile: Dockerfile
      target: runtime
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXTAUTH_URL: http://web:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/pms-dev
      OIDC_CLIENT_ID: pms-web
      CORE_API_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
      keycloak-bootstrap: { condition: service_completed_successfully }
      db-seed: { condition: service_completed_successfully }
    read_only: true
    init: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=0755
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [pms]

  frontend-e2e:
    image: pms-frontend:e2e-runner
    build:
      context: ${PMS_FRONTEND_CONTEXT:?set PMS_FRONTEND_CONTEXT}
      dockerfile: Dockerfile
      target: e2e
    command: ["node", "tests/e2e/real-bff-integration.mjs"]
    environment:
      PMS_WEB_URL: http://web:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      OIDC_TOKEN_URL: http://keycloak:8080/realms/pms-dev/protocol/openid-connect/token
      OIDC_CLIENT_ID: pms-e2e
      OIDC_TEST_USERNAME: ${KEYCLOAK_DEV_USER:-developer}
      OIDC_TEST_PASSWORD: ${KEYCLOAK_DEV_PASSWORD:?set KEYCLOAK_DEV_PASSWORD}
    volumes:
      - ${PMS_FRONTEND_CONTEXT}/tests/e2e/real-bff-integration.mjs:/app/tests/e2e/real-bff-integration.mjs:ro
    depends_on:
      web: { condition: service_healthy }
      allocation-fixture: { condition: service_completed_successfully }
    read_only: true
    init: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [pms]
