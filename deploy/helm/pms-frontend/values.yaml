image:
  repository: registry.example.invalid/pms-frontend
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
replicas: 2
port: 3000
secretName: pms-frontend-secrets
config:
  nextAuthUrl: https://pms.example.invalid
  keycloakIssuer: https://keycloak.example.invalid/realms/pms
  keycloakClientId: pms-web
  coreApiUrl: http://pms-backend-api
resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { cpu: 1000m, memory: 512Mi }
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
podDisruptionBudget: { enabled: true, minAvailable: 1 }
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels: { app.kubernetes.io/name: pms-frontend }
