apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pms-frontend.fullname" . }}
  labels: {{- include "pms-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: pms-frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "pms-frontend.labels" . | nindent 8 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.port }} }]
          env:
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: PORT, value: {{ .Values.port | quote }} }
            - { name: NEXTAUTH_URL, value: {{ .Values.config.nextAuthUrl | quote }} }
            - { name: KEYCLOAK_ISSUER, value: {{ .Values.config.keycloakIssuer | quote }} }
            - { name: KEYCLOAK_CLIENT_ID, value: {{ .Values.config.keycloakClientId | quote }} }
            - { name: CORE_API_URL, value: {{ .Values.config.coreApiUrl | quote }} }
            - { name: NEXTAUTH_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: nextauth-secret } } }
            - { name: KEYCLOAK_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: keycloak-client-secret } } }
          startupProbe: { httpGet: { path: /api/health, port: http }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pms-frontend.fullname" . }}
  labels: {{- include "pms-frontend.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: pms-frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pms-frontend.fullname" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: { app.kubernetes.io/name: pms-frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
{{- end }}
